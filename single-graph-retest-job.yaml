apiVersion: batch/v1
kind: Job
metadata:
  name: univr-single-graph-retest
  namespace: default
spec:
  template:
    metadata:
      labels:
        app: univr-single-graph-retest
    spec:
      restartPolicy: Never
      nodeSelector:
        node-type: trn3-dev1
      resourceClaims:
        - name: neurons
          resourceClaimTemplateName: s-lnc1
      containers:
        - name: repro
          image: 621547421844.dkr.ecr.us-west-2.amazonaws.com/native-pytorch:2.11.0-neuronx-py312-sdk2.31.0-ubuntu24.04-neurondlcbuilder-development-6486001458-0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - "-exc"
            - |
              set -euo pipefail

              cd /tmp
              git clone -b main https://yahavb:${GITHUB_TOKEN}@github.com/yahavb/pave_univr_trn2_repro.git REPRO
              cd REPRO

              echo "┌── PROVENANCE ──"
              echo "│ commit : $(git rev-parse HEAD)"
              echo "│ subject: $(git log -1 --pretty=%s)"
              echo "└────────────────"

              # THE ONE QUESTION
              # SINGLE_GRAPH_NCC_EBIR033.md records that whole-forward fullgraph=True is REJECTED
              # BY THE COMPILER BACKEND at the production tile:
              #   [NCC_EBIR033] ... got in=17776640 and out=128
              #   17,776,640 = 1,269,760 px (992x1280 tile) x 14 resamples per forward
              #   128        = chosen by the backend, not by the model
              # Dynamo traces it fine; neuronx-cc then refuses. Identical error, identical operand
              # sizes, identical failing instruction I-21406-0_VN_0 for gather / gridsample /
              # nki-dyn -- so the trigger is FUSING 14 RESAMPLES, not any resample implementation.
              #
              # That was measured on neuronx-cc 2.26.6360.0. This image is SDK 2.31, five minor
              # versions later, and STATE.md already marks the doc STALE because the limit moved
              # once (single-graph works up to 512x768). So the constraint is UNVERIFIED here.
              #
              # This gates the NEFF-layout question. Today an eager run caches 275 NEFFs while the
              # script reports the graph structure as ~4 graphs. Whether the floor is 1 NEFF or
              # something larger is set by what the compiler accepts, so retest before designing
              # any layout.
              #
              # This is the doc's OWN reproducer, unchanged: one tile, one core, --iters 0 so it
              # compiles and stops without timing anything. gather only -- it needs no NKI
              # toolchain, and the doc established the failure is implementation-independent, so
              # one arm answers it. NEURON_LAUNCH_BLOCKING=1 to report at the failing dispatch.

              OUT=/tmp/univr_sg_out; mkdir -p "$OUT"

              echo "neuronx-cc: $(neuronx-cc --version 2>&1 | tr '\n' ' ' || echo 'NOT ON PATH')"
              python -c 'import torch_neuronx as t; print("torch-neuronx:", t.__version__)' 2>&1 || true
              echo ""

              echo "=== whole-forward fullgraph=True, ONE tile, production 992x1280 ==="
              set +e
              NEURON_LAUNCH_BLOCKING=1 python -u repro_unrolling_trn2.py \
                  --rs0 rs70.png --rs1 rs71.png --rs2 rs72.png \
                  --gt ref_cuda_fp32_1728x4096.npy --weights pre_net_flow.pth \
                  --height 1728 --width 4096 --tiles 2x4 --halo 128 --bar 3 \
                  --device neuron --cores 1 --only-tile 1 \
                  --warp gather --dtype fp32 --compile whole --iters 0 \
                  2>&1 | tee "$OUT/whole_gather_tile1.log"
              rc=${PIPESTATUS[0]}
              set -e
              echo ""
              echo "################ VERDICT"
              echo "  rc=$rc"
              if grep -q "NCC_EBIR033" "$OUT/whole_gather_tile1.log"; then
                echo "  STILL FAILS on this SDK -- NCC_EBIR033 present."
                grep -oE "got in=[0-9]+ and out=[0-9]+" "$OUT/whole_gather_tile1.log" | head -1 \
                  | sed 's/^/    operands: /'
                grep -oE "I-[0-9]+-[0-9]+_VN_[0-9]+" "$OUT/whole_gather_tile1.log" | head -1 \
                  | sed 's/^/    failing instruction: /'
                echo "    -> the 14-resample fusion limit HOLDS. One graph is not reachable at the"
                echo "       production tile, so the NEFF floor is set by where boundaries must go."
              elif [ "$rc" = "0" ]; then
                echo "  COMPILES on this SDK. The doc's constraint is OBSOLETE."
                echo "    NEFFs cached: $(find /tmp/neff_cache -name '*.neff' 2>/dev/null | wc -l)"
                echo "    -> whole-forward single graph is reachable; the 275-NEFF eager layout is"
                echo "       not a compiler constraint and the layout search space is open."
              else
                echo "  FAILED for a DIFFERENT reason (not NCC_EBIR033). Read the tail:"
                tail -40 "$OUT/whole_gather_tile1.log" | sed 's/^/    /'
              fi
              echo ""
              echo "  graph-structure lines the script printed:"
              grep -hE "distinct graph|graphs to compile|torch.compile\[|padded tile shapes" \
                  "$OUT/whole_gather_tile1.log" | sed 's/^/    /' || true
              echo ""

              ARCHIVE=/tmp/univr_sg_$(date -u +%Y%m%d_%H%M%S).tar.gz
              tar -czf "$ARCHIVE" -C /tmp univr_sg_out
              mkdir -p /var/mdl/univr_neuron
              cp "$ARCHIVE" /var/mdl/univr_neuron/
              echo "Saved: /var/mdl/univr_neuron/$(basename "$ARCHIVE") ($(du -h "$ARCHIVE" | cut -f1))"
              echo "Done."
          resources:
            claims:
              - name: neurons
            requests:
              cpu: 48
              memory: 248Gi
            limits:
              cpu: 84
              memory: 248Gi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: 621547421844-ap-southeast-4-pvc
              mountPath: /var/mdl
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: NEURON_LOGICAL_NC_CONFIG
              value: "1"
            - name: NEURON_RT_NUM_CORES
              value: "8"
            - name: NEURON_RT_VISIBLE_CORES
              value: "0-7"
            - name: NEURON_CC_FLAGS
              value: "--target trn2 --lnc 1 --model-type unet-inference"
            - name: TORCH_NEURONX_NEFF_CACHE_DIR
              value: "/tmp/neff_cache"
            - name: OMP_NUM_THREADS
              value: "8"
            - name: NEURON_RT_LOG_LEVEL
              value: "ERROR"
            - name: NEURON_CC_LOG_LEVEL
              value: "ERROR"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: GITHUB_TOKEN
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        - name: 621547421844-ap-southeast-4-pvc
          persistentVolumeClaim:
            claimName: 621547421844-ap-southeast-4-pvc
