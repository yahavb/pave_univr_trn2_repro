# Decode a preserved trace into a TIME SERIES. No Neuron device -- the profiler only PARSES.
#
# Why this is a separate job and not part of the benchmark: the trace for the heavy graph is
# 1.1 GB, and converting a trace that size to queryable tables takes far longer than the workload
# it recorded. Run inline it times out and silently skips, leaving you with aggregates and no
# ordering. So: benchmark writes the pair, this reads it.
#
# Why it cannot run on a laptop: the profiler CLI ships Linux-only (verified -- the tools package
# has no build for Darwin/arm64), so the decode has to happen where the image is. The QUERY side
# is just duckdb and runs anywhere, which is why the report is text.
apiVersion: batch/v1
kind: Job
metadata:
  name: univr-analyze
  namespace: default
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: univr-analyze
    spec:
      restartPolicy: Never
      nodeSelector:
        node-type: trn3-dev1          # for the IMAGE, not for a device
      # DELIBERATELY no resourceClaims: parsing a trace needs no NeuronCore, so this does not
      # queue behind or steal cores from a benchmark run.
      containers:
        - name: analyze
          image: 421672808698.dkr.ecr.us-east-1.amazonaws.com/concourse-release-0461d3b:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - "-ec"
            - |
              set -uo pipefail

              RUN="${RUN:?set RUN to the run directory name under /var/mdl/univr/runs}"
              SRC="/var/mdl/univr/runs/$RUN"
              W=/tmp/analyze; rm -rf "$W"; mkdir -p "$W"

              cd /tmp
              git clone -q -b "${BRANCH:-main}" \
                https://yahavb:${GITHUB_TOKEN}@github.com/yahavb/pave_univr_trn2_repro.git REPRO
              echo "commit $(cd REPRO && git rev-parse HEAD)"
              S=/tmp/REPRO/scripts/neuron

              # THE src= LINE NUMBERS IN THE REPORT BELONG TO THE COMMIT THAT BUILT THE NEFF, not to
              # whatever main is today. Resolving them against a newer checkout silently points at
              # the wrong lines -- an earlier report named `super().__init__()` and two `deconv(...)`
              # constructor lines as the DMA sites, which is nonsense produced by a 28-line drift.
              # The run's own source.tar.gz records the sha, so use it and say which one won.
              NEFF_SHA=""
              if [ -f "$SRC/source.tar.gz" ]; then
                cp "$SRC/source.tar.gz" /tmp/runsrc.tar.gz \
                  && mkdir -p /tmp/runsrc && tar -xzf /tmp/runsrc.tar.gz -C /tmp/runsrc \
                  && NEFF_SHA=$(sed -n 's/^provenance *: *[^@]*@\([0-9a-f]\{7,40\}\).*/\1/p' \
                       /tmp/runsrc/source/PROVENANCE.txt 2>/dev/null | head -1)
              fi
              if [ -n "${NEFF_SHA:-}" ]; then
                if (cd REPRO && git checkout -q "$NEFF_SHA" 2>/dev/null); then
                  echo "src= lines resolve against $NEFF_SHA (the commit that BUILT these NEFFs)"
                else
                  echo "WARNING: $NEFF_SHA not fetchable; src= lines are resolved against $(cd REPRO && git rev-parse --short HEAD) and MAY BE WRONG"
                fi
                # The ANALYSIS scripts must stay at the version being run, only the SOURCE view moves.
                git clone -q -b "${BRANCH:-main}" \
                  https://yahavb:${GITHUB_TOKEN}@github.com/yahavb/pave_univr_trn2_repro.git TOOLS
                S=/tmp/TOOLS/scripts/neuron
              else
                echo "WARNING: no source.tar.gz/PROVENANCE.txt in the run dir, so the commit that"
                echo "  built these NEFFs is UNKNOWN. Every src=<file>:<line> below is resolved"
                echo "  against $(cd REPRO && git rev-parse --short HEAD) and may name the wrong line."
              fi

              # ONE implementation: the same script you can run directly on any Linux host with the
              # SDK. Duplicating the ingest loop here would let the two drift, and a drifted
              # analysis still looks authoritative.
              chmod +x "$S/analyze_trace.sh"
              T=$(ls "$SRC"/univr_results_*.tar.gz 2>/dev/null | head -1)
              if [ -z "${T:-}" ]; then
                echo "NO results tar in $SRC -- nothing to analyze"; ls -la "$SRC" || true; exit 1
              fi
              # ONE object off the S3-FUSE mount, extracted by the script locally. Never traverse
              # the mount: each open is a separate request and a tree walk stalls with no error.
              echo "restoring $(basename "$T") ($(du -h "$T" | cut -f1))"
              cp "$T" /tmp/res.tar.gz

              MAX_PAIRS="${MAX_PAIRS:-5}" ORDER="${ORDER:-size}" \
                HEAD="${HEAD:-60}" BUCKETS="${BUCKETS:-80}" \
                INGEST_TIMEOUT="${INGEST_TIMEOUT:-5400}" \
                bash "$S/analyze_trace.sh" /tmp/res.tar.gz "$W"
              REPORT="$W/timeline_report.txt"

              echo ""
              echo "################ REPORT ################"
              cat "$REPORT"

              # PUBLISH THE PERFETTO FILES INDIVIDUALLY, not only inside the tar. They are the
              # artifact you actually open, and burying a file you need to drag into a viewer inside
              # a 600 MB archive is useless. Earlier the tar listed only the report and the table
              # dirs, so these were written in the pod and then LOST when it exited.
              mkdir -p "$SRC/perfetto" || true
              for f in "$W"/*_pair.pftrace.gz "$W"/*_pair.json.gz; do
                [ -f "$f" ] || continue
                n=$(wc -c < "$f")
                [ "$n" -gt 0 ] && cp "$f" "$SRC/perfetto/" \
                  && echo "published perfetto/$(basename "$f")  $(( n / 1048576 )) MB" \
                  || echo "publish FAILED: $(basename "$f")"
              done
              ls -la "$SRC/perfetto/" 2>/dev/null | sed 's/^/  /' || true

              # One object back across the mount, verified non-empty. Now INCLUDES the perfetto
              # files as well, so the archive is self-contained even though they are also loose.
              tar -czf /tmp/timeline_$RUN.tar.gz -C "$W" timeline_report.txt \
                  $(cd "$W" && ls -d pq_* 2>/dev/null || true) \
                  $(cd "$W" && ls *_pair.pftrace.gz *_pair.json.gz 2>/dev/null || true) 2>/dev/null || true
              if [ -s /tmp/timeline_$RUN.tar.gz ]; then
                cp /tmp/timeline_$RUN.tar.gz "$SRC"/ \
                  && echo "saved $SRC/timeline_$RUN.tar.gz ($(du -h /tmp/timeline_$RUN.tar.gz | cut -f1))"
              fi
              echo "Done."
          resources:
            requests:
              cpu: 32
              memory: 128Gi
            limits:
              cpu: 48
              # A 1.1 GB trace expands substantially in memory during conversion; this is the
              # single resource that decides whether the ingest finishes.
              memory: 400Gi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: 621547421844-ap-southeast-4-pvc
              mountPath: /var/mdl
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            # WHICH run to analyze -- the directory name under /var/mdl/univr/runs
            - name: RUN
              value: "exp_univr-warpeager_gridsample_288x320_20260818_122633"
            # Cap the work: ingest cost tracks trace size and a big one can take most of an hour,
            # so an uncapped run over many pairs never finishes. 0 = no cap.
            - name: MAX_PAIRS
              value: "5"
            # size = biggest traces first (what is usually wanted, and where the heavy graph is).
            # rank = the order the benchmark measured by TIME. Whatever is skipped is listed, so a
            # capped run cannot be mistaken for full coverage.
            - name: ORDER
              value: "size"
            - name: HEAD
              value: "60"
            - name: BUCKETS
              value: "80"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: GITHUB_TOKEN
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        - name: 621547421844-ap-southeast-4-pvc
          persistentVolumeClaim:
            claimName: 621547421844-ap-southeast-4-pvc
