# Decode a preserved trace into a TIME SERIES. No Neuron device -- the profiler only PARSES.
#
# Why this is a separate job and not part of the benchmark: the trace for the heavy graph is
# 1.1 GB, and converting a trace that size to queryable tables takes far longer than the workload
# it recorded. Run inline it times out and silently skips, leaving you with aggregates and no
# ordering. So: benchmark writes the pair, this reads it.
#
# Why it cannot run on a laptop: the profiler CLI ships Linux-only (verified -- the tools package
# has no build for Darwin/arm64), so the decode has to happen where the image is. The QUERY side
# is just duckdb and runs anywhere, which is why the report is text.
apiVersion: batch/v1
kind: Job
metadata:
  name: univr-analyze
  namespace: default
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: univr-analyze
    spec:
      restartPolicy: Never
      nodeSelector:
        node-type: trn3-dev1          # for the IMAGE, not for a device
      # DELIBERATELY no resourceClaims: parsing a trace needs no NeuronCore, so this does not
      # queue behind or steal cores from a benchmark run.
      containers:
        - name: analyze
          image: 421672808698.dkr.ecr.us-east-1.amazonaws.com/concourse-release-0461d3b:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - "-ec"
            - |
              set -uo pipefail

              RUN="${RUN:?set RUN to the run directory name under /var/mdl/univr/runs}"
              SRC="/var/mdl/univr/runs/$RUN"
              W=/tmp/analyze; rm -rf "$W"; mkdir -p "$W"

              cd /tmp
              git clone -q -b "${BRANCH:-main}" \
                https://yahavb:${GITHUB_TOKEN}@github.com/yahavb/pave_univr_trn2_repro.git REPRO
              echo "commit $(cd REPRO && git rev-parse HEAD)"
              S=/tmp/REPRO/scripts/neuron

              python3 -c "import duckdb" 2>/dev/null || pip install --quiet duckdb
              PROF=neuron-explorer
              command -v "$PROF" >/dev/null 2>&1 || PROF=neuron-profile
              echo "profiler CLI: $PROF   $("$PROF" --version 2>&1 | head -1)"
              echo ""

              # The benchmark leaves the pairs inside its results tar. ONE object off the mount,
              # extracted locally -- never traverse an S3-FUSE directory, where each open is a
              # separate request and a tree walk stalls with no error.
              T=$(ls "$SRC"/univr_results_*.tar.gz 2>/dev/null | head -1)
              if [ -n "${T:-}" ]; then
                echo "restoring pairs from $(basename "$T") ($(du -h "$T" | cut -f1))"
                cp "$T" /tmp/res.tar.gz && tar -xzf /tmp/res.tar.gz -C "$W"
              else
                echo "NO results tar in $SRC -- nothing to analyze"; ls -la "$SRC" || true; exit 1
              fi
              PAIRS=$(find "$W" -type d -name 'rank*' | sort | head -20)
              echo "pairs found:"; for p in $PAIRS; do
                echo "  $(basename "$p")  $(ls "$p" | tr '\n' ' ')"; done
              echo ""

              # Ingest one pair to parquet. The CLI writes the tables then IDLES on a server it
              # never needs, so it must be backgrounded and killed once the output stops growing.
              # Kill on SIZE-STABILISE, not on file existence: the summary table is created early
              # and filled last, so "the file appeared" means nothing.
              ingest() {
                local neff="$1" ntff="$2" out="$3"
                rm -rf "$out"; mkdir -p "$out"
                timeout "${INGEST_TIMEOUT:-5400}" "$PROF" view -n "$neff" -s "$ntff" \
                  --output-format parquet --output-file "$out" \
                  --ignore-instruction-hierarchy --ignore-event-trace >"$out/.ingest.log" 2>&1 &
                local pid=$! prev=-1 cur stable=0 i
                for i in $(seq 1 1080); do          # up to 90 min at 5 s
                  kill -0 "$pid" 2>/dev/null || break
                  cur=$(du -sb "$out" 2>/dev/null | cut -f1)
                  if [ "$cur" = "$prev" ] && [ "$cur" != "0" ]; then
                    stable=$((stable+1)); [ "$stable" -ge 6 ] && break
                  else stable=0; fi
                  prev="$cur"; sleep 5
                done
                kill "$pid" 2>/dev/null; wait "$pid" 2>/dev/null
                local n; n=$(ls "$out"/*.parquet 2>/dev/null | wc -l)
                echo "    parquet tables: $n   dir $(du -sh "$out" | cut -f1)"
                [ "$n" -gt 0 ]
              }

              REPORT="$W/timeline_report.txt"; : > "$REPORT"
              # LARGEST FIRST here, unlike the usual smallest-first: the whole point is the heavy
              # graph -- the one holding most of the capture -- and the small ones add nothing once
              # it is decoded. If the big one cannot be ingested the log says so and the small ones
              # still run.
              for p in $(for d in $PAIRS; do echo "$(du -sb "$d" | cut -f1) $d"; done | sort -rn | cut -d' ' -f2); do
                neff=$(ls "$p"/*.neff 2>/dev/null | head -1)
                ntff=$(ls "$p"/*.ntff 2>/dev/null | head -1)
                [ -n "$neff" ] && [ -n "$ntff" ] || { echo "  $(basename "$p"): incomplete pair, skip" | tee -a "$REPORT"; continue; }
                h=$(basename "$neff" .neff); out="$W/pq_$h"
                echo "" | tee -a "$REPORT"
                echo "########## $(basename "$p") ##########" | tee -a "$REPORT"
                echo "  neff $(du -h "$neff"|cut -f1)   ntff $(du -h "$ntff"|cut -f1)" | tee -a "$REPORT"
                if ingest "$neff" "$ntff" "$out"; then
                  # THE TIME SERIES. Discovers its own schema and prints which columns it read, so
                  # the report cannot silently query the wrong field.
                  python3 "$S/pq_timeline.py" "$out" "$(basename "$p")" \
                      --head "${HEAD:-60}" --buckets "${BUCKETS:-80}" 2>&1 | tee -a "$REPORT"
                  # per-op DMA + the source line, from the same tables
                  [ -f "$S/pq_dma_report.py" ] && python3 "$S/pq_dma_report.py" "$out" "$h" 2>&1 | tee -a "$REPORT" || true
                  [ -f "$S/pq_pad_shapes.py" ] && python3 "$S/pq_pad_shapes.py" "$out" "$h" 2>&1 | tee -a "$REPORT" || true
                else
                  echo "  INGEST PRODUCED NO TABLES -- tail of its log:" | tee -a "$REPORT"
                  tail -12 "$out/.ingest.log" 2>/dev/null | sed 's/^/    /' | tee -a "$REPORT"
                fi
                [ "${ONLY_FIRST:-1}" = "1" ] && { echo "  (ONLY_FIRST=1: stopping after the heaviest pair)" | tee -a "$REPORT"; break; }
              done

              echo ""
              echo "################ REPORT ################"
              cat "$REPORT"

              # One object back across the mount, verified non-empty.
              tar -czf /tmp/timeline_$RUN.tar.gz -C "$W" timeline_report.txt $(cd "$W" && ls -d pq_* 2>/dev/null || true) 2>/dev/null || true
              if [ -s /tmp/timeline_$RUN.tar.gz ]; then
                cp /tmp/timeline_$RUN.tar.gz "$SRC"/ \
                  && echo "saved $SRC/timeline_$RUN.tar.gz ($(du -h /tmp/timeline_$RUN.tar.gz | cut -f1))"
              fi
              echo "Done."
          resources:
            requests:
              cpu: 16
              memory: 64Gi
            limits:
              cpu: 48
              # A 1.1 GB trace expands substantially in memory during conversion; this is the
              # single resource that decides whether the ingest finishes.
              memory: 400Gi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: 621547421844-ap-southeast-4-pvc
              mountPath: /var/mdl
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            # WHICH run to analyze -- the directory name under /var/mdl/univr/runs
            - name: RUN
              value: "exp_univr-288x320-gridsample-fg1_20260817_193145"
            # 1 = only the heaviest pair (the one holding most of the capture). 0 = all of them.
            - name: ONLY_FIRST
              value: "1"
            - name: HEAD
              value: "60"
            - name: BUCKETS
              value: "80"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: GITHUB_TOKEN
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        - name: 621547421844-ap-southeast-4-pvc
          persistentVolumeClaim:
            claimName: 621547421844-ap-southeast-4-pvc
