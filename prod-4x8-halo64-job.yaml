apiVersion: batch/v1
kind: Job
metadata:
  name: univr-prod-4x8-h64
  namespace: default
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: univr-prod-4x8-h64
    spec:
      restartPolicy: Never
      nodeSelector:
        node-type: trn3-dev1
        # Pinned: the S3 add-on backing the /var/mdl PVC only runs on this node. Elsewhere the
        # pod sits Pending on "MountVolume.SetUp failed ... DeadlineExceeded".
        kubernetes.io/hostname: ip-192-168-192-189.us-east-2.compute.internal
      resourceClaims:
        - name: neurons
          resourceClaimTemplateName: s-lnc1
      containers:
        - name: repro
          image: 421672808698.dkr.ecr.us-east-1.amazonaws.com/concourse-release-0461d3b:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - "-exc"
            - |
              set -euo pipefail

              cd /tmp
              git clone -b main https://yahavb:${GITHUB_TOKEN}@github.com/yahavb/pave_univr_trn2_repro.git REPRO
              cd REPRO

              echo "┌── PROVENANCE ──"
              echo "│ commit : $(git rev-parse HEAD)"
              echo "│ subject: $(git log -1 --pretty=%s)"
              echo "└────────────────"
              echo "neuronx-cc: $(neuronx-cc --version 2>&1 | head -1 || true)"
              echo "NEURON_CC_FLAGS: ${NEURON_CC_FLAGS:-<unset>}"
              echo ""

              # ============================================================================
              # THE NUMBER: fused 4x8 halo 64 at full production, timed and scored
              # ============================================================================
              # 4x8 at halo 64 FUSES. Confirmed on tile 9, the LARGEST of its four padded shapes
              # (576x640, operand 5,160,960), which is the binding constraint since both compiler
              # limits scale with padded pixels. That is the only geometry known to fuse.
              #
              # What has never been produced is a latency or accuracy number for it. Every fusion
              # run so far was --iters 0, and the one job that would have timed it was OOM-killed
              # while compiling an unrelated 2x8 arm before it got there. This job does nothing
              # else, so nothing can eat the memory first.
              #
              # WHY IT IS WORTH TIMING: the conv benchmark settled where the frame's time actually
              # goes, and it is not where the kernel work assumed.
              #     warps (14)  614.2 ms per tile-triplet   63.1% of device-active work
              #     convs (54)  359.0 ms                    36.9%
              #     total       973.2 ms device-active
              #     measured wall 4,125 ms  ->  only 23.6% accounted, 76.4% dispatch and idle
              # So the resample is 63% of DEVICE work but only ~15% of WALL clock, which is why the
              # 1.16x op-level win from the NKI kernel vanished end to end. Dispatch is ~3.15 s of
              # the 4.125 s frame, and fusion is the only lever aimed at it: an eager run caches
              # 275 NEFFs, a fused 4x8 needs 4 shapes x 2 triplet timestamps = ~8 graphs.
              #
              # THE COST SIDE IS SMALL, which is what makes this promising. From the real planner,
              # total padded pixels summed over all tiles, relative to the 2x4 halo-128 baseline:
              #     2x4 halo 128   9,650,176 px   1.00x   8 tiles,  2 shapes
              #     4x8 halo 128  15,073,280 px   1.56x  32 tiles,  4 shapes
              #     4x8 halo  64  10,862,592 px   1.13x  32 tiles,  4 shapes
              # Halo IS the overlap, so the smaller halo cuts the work at the same time as it cuts
              # the compile operand. The fused arm has a 13% pixel-work penalty to overcome, not 56%.
              #
              # STAGE 1 compiles one representative tile per DISTINCT SHAPE. Tile 9 (576x640) is
              # proven; the other three are not, and an 8-core run compiles all four. Indices from
              # the planner: 512x576 -> tile 0, 512x640 -> tile 1, 576x576 -> tile 8, 576x640 ->
              # tile 9. A single unfusable shape sinks the whole configuration, so this is checked
              # cheaply before the timed arms.
              #
              # STAGE 2 runs both warps at 8 cores with 3 iters; STAGE 3 does the same for 2x4
              # halo 128 in the SAME pod, so the two geometries are compared on one machine and one
              # cache state.
              #
              # BOTH gather AND nki-dyn, because the 4x8 FUSES verdict was measured with gather and
              # production runs nki. gather is plain torch; nki is the shipping kernel with 2
              # indirect DMA descriptors per pixel, so it is a different graph and the verdict does
              # not automatically transfer. nki-dyn exercises the same NKI indirect-DMA path and
              # compiles in seconds, where the README puts full nki at 80-100 min per distinct tile
              # shape -- four shapes would be hours. If nki-dyn fuses and wins, full nki is the
              # follow-up and its compile cost is a one-off against a cached NEFF.
              #
              # ACCURACY IS NOT OPTIONAL HERE. Halo 64 is a correctness change: the halo exists
              # because convs and the resample read outside the tile, and too little of it fails
              # SILENTLY as edge artefacts that look plausible while disagreeing with the untiled
              # reference. Every arm is scored against ref_cuda_fp32_1728x4096.npy at --bar 3.
              # Note the eager 2x4 baseline itself last measured 81.46 LSB against that bar, on the
              # documented configuration, so it may fail too -- in which case the defect is upstream
              # of both halo and fusion.

              OUT=/tmp/univr_p48_out; mkdir -p "$OUT"
              FRAMES="--rs0 rs70.png --rs1 rs71.png --rs2 rs72.png"
              REF="--gt ref_cuda_fp32_1728x4096.npy --weights pre_net_flow.pth"

              # All four 4x8 halo-64 shapes are ALREADY PROVEN to fuse under NEURON_CC_FLAGS
              # "--lnc 1" -- job univr-bigtile-noflag-lb62x, 4.2 h for the set:
              #   tile 0  512x576  294,912 px  FUSES  117 min
              #   tile 1  512x640  327,680 px  FUSES   27 min
              #   tile 8  576x576  331,776 px  FUSES   85 min
              #   tile 9  576x640  368,640 px  FUSES   24 min
              # So this job does NOT re-compile them one by one. It compiles the largest shape
              # alone as a cheap guard: if the flag regressed or the cache is cold in a way that
              # matters, it fails here in minutes rather than deep inside a timed 8-core arm.
              echo "=== [1/2] GUARD: largest shape (tile 9, 576x640) still fuses ==="
              set +e
              NEURON_LAUNCH_BLOCKING=1 python -u repro_unrolling_trn2.py \
                  $FRAMES $REF \
                  --height 1728 --width 4096 --tiles 4x8 --halo 64 --bar 3 \
                  --device neuron --cores 1 --only-tile 9 \
                  --warp gather --dtype fp32 --iters 0 \
                  2>&1 | tee "$OUT/1_guard.log"
              rc9=${PIPESTATUS[0]}
              set -e
              if [ "$rc9" = "0" ]; then
                echo "  GUARD OK -- 576x640 fuses, proceeding to the timed arms"
              else
                echo "  GUARD FAILED rc=$rc9 -- the timed arms below will not produce a number."
                grep -aoE "got in=[0-9]+ and out=[0-9]+" "$OUT/1_guard.log" | head -1 | sed 's/^/    /'
                echo "  If in=23,040 appears, NEURON_CC_FLAGS picked up --model-type unet-inference again."
              fi
              echo ""
              for i in $(seq 1 60); do pgrep -f repro_unrolling_trn2.py >/dev/null || break; sleep 2; done
              sleep 5

              echo "=== [2/2] FUSED 4x8 halo 64, 8 cores, 3 iters, gather and nki-dyn ==="
              for WP in gather nki-dyn; do
                TAG="fused_4x8_h64_${WP}"
                echo "---- $TAG ----"
                B=$(find /tmp/neff_cache -name '*.neff' 2>/dev/null | wc -l || echo 0)
                set +e
                python -u repro_unrolling_trn2.py $FRAMES $REF \
                    --height 1728 --width 4096 --tiles 4x8 --halo 64 --bar 3 \
                    --device neuron --cores 8 --warp "$WP" --dtype fp32 \
                    --iters 3 \
                    2>&1 | tee "$OUT/t_${TAG}.log"
                rc=${PIPESTATUS[0]}
                set -e
                A=$(find /tmp/neff_cache -name '*.neff' 2>/dev/null | wc -l || echo 0)
                echo "$rc" > "$OUT/rc_${TAG}.txt"; echo "$((A-B))" > "$OUT/nf_${TAG}.txt"
                echo "  rc=$rc  NEFFs +$((A-B))"
                for i in $(seq 1 60); do pgrep -f repro_unrolling_trn2.py >/dev/null || break; sleep 2; done
                sleep 5
              done
              echo ""

              echo "################ FUSED 4x8 halo 64 -- STEADY-STATE LATENCY"
              printf "  %-28s %5s %11s %7s %9s %6s %s\n" arm rc median_ms neffs max_LSB gate graphs
              for f in "$OUT"/t_*.log; do
                [ -f "$f" ] || continue
                TAG=$(basename "$f" .log); TAG=${TAG#t_}
                rc=$(cat "$OUT/rc_${TAG}.txt" 2>/dev/null || echo '?')
                NN=$(cat "$OUT/nf_${TAG}.txt" 2>/dev/null || echo '-')
                MS=$(grep -aoE "steady state: median [0-9.]+ ms" "$f" | head -1 | awk '{print $4}' || true)
                LSB=$(grep -aoE "max_diff +[0-9.]+ LSB" "$f" | head -1 | awk '{print $2}' || true)
                GT=$(grep -aoE "\[(PASS|FAIL) vs the shipped bar" "$f" | head -1 | tr -d '[' | awk '{print $1}' || true)
                GR=$(grep -aoE "up to [0-9]+ graphs to compile" "$f" | head -1 | awk '{print $3}' || true)
                printf "  %-28s %5s %11s %7s %9s %6s %s\n" \
                  "$TAG" "$rc" "${MS:--}" "${NN:--}" "${LSB:--}" "${GT:--}" "${GR:--}"
              done
              echo ""
              echo "  HOW TO READ IT:"
              echo "  * a median_ms with gate PASS -> THE RESULT. First fused steady-state latency"
              echo "    for this model. Compare against 3673.3 ms in the README, and g6e at 351.1 ms"
              echo "    measured torch eager fp32 and 161 ms ONNX+TRT."
              echo "  * gate FAIL -> halo 64 is corrupting tile edges. The production halo is 128 and"
              echo "    halo is a correctness requirement, so this is the expected failure mode of"
              echo "    shrinking it. Next rung is halo 96: largest shape 640x704 = 450,560 px, which"
              echo "    is just above the 442,368 px that is known to fuse, so it may still compile."
              echo "  * nki-dyn slower than gather -> expected, the README puts nki-dyn at ~1.1-1.3x"
              echo "    runtime. It is here because nki is the production resample path and gather is"
              echo "    plain torch; if only gather passes, that is a caveat on the result."
              echo "  * no median at all -> read the guard above and the rc. If in=23,040 appears,"
              echo "    NEURON_CC_FLAGS regressed to include --model-type unet-inference."
              echo ""
              echo "  Compile time in the first-call line is NOT the latency and NOT the critical"
              echo "  path -- it is a one-off the NEFF cache absorbs. Read steady-state median only."
              echo ""
              echo "  No 2x4 comparison arm: 2x4 is 1,069,056 px at halo 64 and 1,269,760 at halo 128,"
              echo "  both above the ~442k-594k px compiler memory ceiling, so it cannot fuse. The"
              echo "  eager 2x4 figures (4125.5 ms / 81.46 LSB FAIL in this image, 3673.3 ms / 0.64 LSB"
              echo "  PASS in the README) are historical and not reproducible -- the eager path has"
              echo "  been removed from the script."
              echo ""

              ARCHIVE=/tmp/univr_p48_$(date -u +%Y%m%d_%H%M%S).tar.gz
              tar -czf "$ARCHIVE" -C /tmp univr_p48_out
              mkdir -p /var/mdl/univr_neuron
              cp "$ARCHIVE" /var/mdl/univr_neuron/
              echo "Saved: /var/mdl/univr_neuron/$(basename "$ARCHIVE") ($(du -h "$ARCHIVE" | cut -f1))"
              echo "Done."
          resources:
            claims:
              - name: neurons
            requests:
              cpu: 48
              memory: 248Gi
            limits:
              cpu: 160
              memory: 1800Gi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: 621547421844-ap-southeast-4-pvc
              mountPath: /var/mdl
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: NEURON_LOGICAL_NC_CONFIG
              value: "1"
            - name: NEURON_RT_NUM_CORES
              value: "8"
            - name: NEURON_RT_VISIBLE_CORES
              value: "0-7"
            # No --target (node is trn3), no -O1 (causes the in=4 / I-3276 rejection), no -O3
            # (measured to change the instruction count by exactly zero on 2x8 and 2x12).
            # MUST NOT contain --model-type unet-inference. That flag is the sole cause of the
            # NCC_EBIR033 DMA rejection: across 8 arms on one fixed shape, every arm carrying it
            # rejected with the identical in=23,040 and every arm without it fused. --lnc is
            # irrelevant to that, and --model-type transformer / generic also fuse, so the VALUE is
            # what matters rather than the flag.
            - name: NEURON_CC_FLAGS
              value: "--lnc 1"
            - name: TORCH_NEURONX_NEFF_CACHE_DIR
              value: "/tmp/neff_cache"
            - name: OMP_NUM_THREADS
              value: "8"
            - name: NEURON_RT_LOG_LEVEL
              value: "ERROR"
            - name: NEURON_CC_LOG_LEVEL
              value: "ERROR"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: GITHUB_TOKEN
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        - name: 621547421844-ap-southeast-4-pvc
          persistentVolumeClaim:
            claimName: 621547421844-ap-southeast-4-pvc
