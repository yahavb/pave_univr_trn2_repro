apiVersion: batch/v1
kind: Job
metadata:
  name: univer-precomputed-index-select-2x4-halo
  namespace: default
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: univer-precomputed-index-select-2x4-halo
    spec:
      restartPolicy: Never
      nodeSelector:
        node-type: trn3-dev1
      resourceClaims:
        - name: neurons
          resourceClaimTemplateName: s-lnc1
      containers:
        - name: bench
          image: 421672808698.dkr.ecr.us-east-1.amazonaws.com/concourse-release-0461d3b:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - "-ec"
            - |
              set -euo pipefail

              cd /tmp
              git clone -b "${BRANCH:-main}" https://yahavb:${GITHUB_TOKEN}@github.com/yahavb/pave_univr_trn2_repro.git REPRO
              cd REPRO

              R=/tmp/out; rm -rf "$R"; mkdir -p "$R"
              TS=$(date -u +%Y%m%d_%H%M%S)
              GRID="${GRID:-2x4}"
              HALOS="${HALOS:-32 128}"
              ITERS="${ITERS:-5}"
              RUN="exp_univer-precomputed-index_select-${GRID}-halosweep_fg0_${TS}"
              RUNDIR="/var/mdl/univr/runs/$RUN"

              finalize() {
                tar -czf "/tmp/univr_results_${TS}.tar.gz" -C /tmp out 2>/dev/null || true
                cp "/tmp/univr_results_${TS}.tar.gz" "$R/" 2>/dev/null || true
                mkdir -p "$RUNDIR"
                cp -r "$R"/. "$RUNDIR"/ 2>/dev/null || true
                ls -la "$RUNDIR"
              }
              trap finalize EXIT

              printf '%s\n' \
                "run       : $RUN" \
                "provenance: $(git rev-parse --abbrev-ref HEAD)@$(git rev-parse HEAD)" \
                "config    : resize=precomputed  warp=index_select  fullgraph=false" \
                "geometry  : FULL 4K frame, grid $GRID, halo sweep [$HALOS], 1 core, fp32" \
                "purpose   : halo 32 is what PAVEUniVRShutterUnrolling ships and its notes say it was never validated on content; this gates it against ref_cuda_fp32_1728x4096.npy" \
                "reference : their production tile 864x1024 halo 32 -> padded 928x1088, halo tax 1.141x; 864x1024 measured at/near optimal, spill LINEAR in area, no SBUF cliff" \
                "cc        : $(neuronx-cc --version 2>&1 | head -1 | awk '{print $NF}')" \
                "ccflags   : ${NEURON_CC_FLAGS:-<unset>}" \
                > "$R/PROVENANCE.txt"

              for H in $HALOS; do
                export TORCH_NEURONX_NEFF_CACHE_DIR="/tmp/neff_cache_h${H}"
                mkdir -p "$TORCH_NEURONX_NEFF_CACHE_DIR"
                CACHE_TGZ="/var/mdl/univr/neff_cache_${GRID}_h${H}_precomputed_idxsel_fg0.tar.gz"
                if [ -f "$CACHE_TGZ" ]; then
                  cp "$CACHE_TGZ" /tmp/restore.tar.gz \
                    && tar -xzf /tmp/restore.tar.gz -C /tmp 2>/dev/null || true
                fi

                BASE="--rs0 rs70.png --rs1 rs71.png --rs2 rs72.png
                      --height 1728 --width 4096 --tiles $GRID --halo $H
                      --gt ref_cuda_fp32_1728x4096.npy --weights pre_net_flow.pth
                      --bar 3 --dtype fp32 --device neuron --cores 1
                      --warp gather --fullgraph 0 --resize precomputed"

                set +e
                python -u repro_unrolling_trn2.py $BASE --iters 0 2>&1 \
                  | tee "$R/halo${H}_compile.log"
                set -e
                for i in $(seq 1 90); do pgrep -f repro_unrolling_trn2.py >/dev/null || break; sleep 2; done
                sleep 5
                B0=$(find "$TORCH_NEURONX_NEFF_CACHE_DIR" -name '*.neff' | wc -l)

                set +e
                python -u repro_unrolling_trn2.py $BASE --iters "$ITERS" \
                    --save-ref "$R/frame_halo${H}.npy" 2>&1 | tee "$R/halo${H}_clean.log"
                set -e
                A0=$(find "$TORCH_NEURONX_NEFF_CACHE_DIR" -name '*.neff' | wc -l)
                printf 'halo %s: NEFFs %d -> %d during timed run (must be +0)\n' "$H" "$B0" "$A0"

                tar -czf "/tmp/nc_h${H}.tar.gz" -C /tmp "neff_cache_h${H}" 2>/dev/null || true
                cp "/tmp/nc_h${H}.tar.gz" "$CACHE_TGZ" 2>/dev/null || true
                for i in $(seq 1 90); do pgrep -f repro_unrolling_trn2.py >/dev/null || break; sleep 2; done
                sleep 5
              done

              for H in $HALOS; do
                printf 'halo %-4s %s | %s | %s\n' "$H" \
                  "$(grep -aoE 'steady state: median [0-9.]+ ms' "$R/halo${H}_clean.log" | tail -1)" \
                  "$(grep -aoE 'max_diff +[0-9.]+ LSB' "$R/halo${H}_clean.log" | tail -1)" \
                  "$(grep -aoE 'padded tile shapes: [0-9x, ]+' "$R/halo${H}_clean.log" | tail -1)"
              done
          resources:
            claims:
              - name: neurons
            requests:
              cpu: 48
              memory: 248Gi
            limits:
              cpu: 150
              memory: 1800Gi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: 621547421844-ap-southeast-4-pvc
              mountPath: /var/mdl
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: BRANCH
              value: "main"
            - name: GRID
              value: "2x4"
            - name: HALOS
              value: "32 128"
            - name: ITERS
              value: "5"
            - name: NEURON_LOGICAL_NC_CONFIG
              value: "1"
            - name: NEURON_RT_NUM_CORES
              value: "8"
            - name: NEURON_RT_VISIBLE_CORES
              value: "0-7"
            - name: NEURON_CC_FLAGS
              value: "--lnc 1"
            - name: XLA_IR_DEBUG
              value: "1"
            - name: XLA_HLO_DEBUG
              value: "1"
            - name: OMP_NUM_THREADS
              value: "8"
            - name: NEURON_RT_LOG_LEVEL
              value: "ERROR"
            - name: NEURON_CC_LOG_LEVEL
              value: "ERROR"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: GITHUB_TOKEN
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        - name: 621547421844-ap-southeast-4-pvc
          persistentVolumeClaim:
            claimName: 621547421844-ap-southeast-4-pvc
