apiVersion: batch/v1
kind: Job
metadata:
  name: univr-microbench
  namespace: default
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: univr-microbench
    spec:
      restartPolicy: Never
      nodeSelector:
        node-type: trn3-dev1
        # Pinned: the S3 add-on backing the /var/mdl PVC only runs on this node. Elsewhere the
        # pod sits Pending on "MountVolume.SetUp failed ... DeadlineExceeded".
        kubernetes.io/hostname: ip-192-168-192-189.us-east-2.compute.internal
      resourceClaims:
        - name: neurons
          resourceClaimTemplateName: s-lnc1
      containers:
        - name: sweep
          image: 421672808698.dkr.ecr.us-east-1.amazonaws.com/concourse-release-0461d3b:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - "-exc"
            - |
              set -euo pipefail

              cd /tmp
              git clone -b main https://yahavb:${GITHUB_TOKEN}@github.com/yahavb/pave_univr_trn2_repro.git REPRO
              cd REPRO
              echo "commit $(git rev-parse HEAD)"

              OUT=/tmp/mb; mkdir -p "$OUT"
              RES="${RES:-256x384}"
              H=${RES%%x*}; W=${RES##*x}

              mkdir -p /tmp/neff_cache
              nefs() { find /tmp/neff_cache -name '*.neff' 2>/dev/null | wc -l || true; }
              PAIRS="$OUT/pairs"; mkdir -p "$PAIRS"
              POUT=/tmp/perneff; mkdir -p "$POUT"

              SET="${SET:-both}"
              # The 4x8 halo-128 shapes -- the config now PROVEN fully fusable (all 8 slots, job
              # k2zwh). The old default was the halo-64 set, which no longer matches anything we run.
              SHAPES="${SHAPES:-576,640 576,768 704,640 704,768}"
              # THE CHANNEL SWEEP IS THE POINT, and it was missing. The resample is applied at
              # C=3 (images) AND at the Contextnet feature widths C=16/32/64/128 (_C=16, so
              # C,2C,4C,8C). Every previous warp arm ran at C=3 ONLY -- the CHEAPEST site -- while
              # the measured descriptor rate for gridsample climbs from 3.0 pkt/px at C=3 to
              # 205 at C=128 against gather's ~2.0 flat. So the arm that mattered was never run,
              # and any judgement about gridsample's cost rests on its best case.
              CHANS="${CHANS:-3 16 32 64 128}"

              SPECS="${SPECS:-}"
              if [ -z "$SPECS" ]; then
                case "$SET" in
                  warps|both)
                    for S in $SHAPES; do
                      for C in $CHANS; do
                        # gather is the compilable substitute, gridsample the REFERENCE every
                        # other warp is scored against (microbench.py scores vs warp_gridsample).
                        # Both at every C so the gap is measured per site, not assumed.
                        SPECS="$SPECS gather:$C,$S"
                        SPECS="$SPECS gridsample:$C,$S"
                        # The NKL kernel from CR-288764575. Third arm at every (C, shape) so the
                        # comparison that matters is direct: it against ATen gridsample, the
                        # reference it is meant to replace, at the C where ATen's descriptor rate
                        # explodes (205 pkt/px at C=128 vs ~2.0 for gather). Set NKL=0 to drop
                        # these arms -- the kernel is UNMERGED and absent from released images, so
                        # it raises SystemExit on import unless the package is on PYTHONPATH.
                        # `if`, not `[ ] &&`: a bare && as the last statement in a loop body
                        # leaves the loop with a non-zero status, which is a set -e hazard.
                        if [ "${NKL:-1}" = "1" ]; then SPECS="$SPECS gridsample-nkl:$C,$S"; fi
                      done
                      SPECS="$SPECS nkishift/3:3,$S"
                    done
                    ;;
                esac
                case "$SET" in
                  convs|both)
                    CS=$(echo $SHAPES | awk '{print $NF}')
                    for OP in $(python3 microbench.py --op x --list-convs --shape "$CS" \
                                | awk '$6 ~ /^-?[0-9]+$/ && $7 ~ /^[0-9.]+$/ {print $1}'); do
                      SPECS="$SPECS $OP:$CS"
                    done
                    ;;
                esac
              fi
              echo "SET=$SET  SHAPES=$SHAPES"
              echo "arms: $(echo $SPECS | wc -w)"
              echo ""

              FLOW="--flow-smooth --flow-mag 2.33"

              for SPEC in $SPECS; do
                OPSPEC=${SPEC%%:*}
                SHP=${SPEC#*:}
                # "op" or "op/R". The radius is part of the TAG so the two nkishift runs
                # land in separate logs and separate summary rows instead of colliding.
                OP=${OPSPEC%%/*}
                if [ "$OPSPEC" != "$OP" ]; then
                  RAD="--radius ${OPSPEC#*/}"
                  TAG="${OP}R${OPSPEC#*/}_$(echo $SHP | tr ',' 'x')"
                else
                  RAD=""
                  TAG="${OP}_$(echo $SHP | tr ',' 'x')"
                fi
                echo "################ $TAG"
                BEFORE=$(find /tmp/neff_cache -name '*.neff' 2>/dev/null | sort || true)
                set +e
                python -u microbench.py --op "$OP" --shape "$SHP" --device neuron \
                    $FLOW $RAD 2>&1 | tee "$OUT/$TAG.log"
                rc=${PIPESTATUS[0]}
                set -e
                if [ "$rc" != "0" ]; then
                  echo "  RUN FAILED rc=$rc"; tail -20 "$OUT/$TAG.log" | sed 's/^/    /'; continue
                fi
                PX=$(grep -oE "^output_px +[0-9]+" "$OUT/$TAG.log" | awk '{print $2}' || true)
                TB=$(grep -oE "^tap_bytes +[0-9]+" "$OUT/$TAG.log" | awk '{print $2}' || true)
                for i in $(seq 1 30); do pgrep -f microbench.py >/dev/null || break; sleep 2; done
                sleep 8
                AFTER=$(find /tmp/neff_cache -name '*.neff' 2>/dev/null | sort || true)
                NEW=$(comm -13 <(echo "$BEFORE") <(echo "$AFTER") || true)
                BIG=$(for f in $NEW; do [ -f "$f" ] && stat -c '%s %n' "$f"; done | sort -rn | head -1 | cut -d' ' -f2 || true)
                if [ -z "$BIG" ]; then echo "  no new NEFF (cache hit)"; continue; fi
                hash=$(basename "$BIG" .neff)
                ntff="$POUT/$hash.ntff"; json="$POUT/$hash.json"
                echo "  neff $hash ($(stat -c%s "$BIG") B)"
                timeout 3600 neuron-profile capture --single-io -n "$BIG" -s "$ntff" \
                    >"$POUT/$hash.cap.log" 2>&1 || true
                [ -s "$ntff" ] || { echo "  CAPTURE FAILED"; tail -6 "$POUT/$hash.cap.log"; continue; }
                timeout 900 neuron-profile view -n "$BIG" -s "$ntff" \
                    --output-format summary-json > "$json" 2>/dev/null || true
                [ -s "$json" ] || { echo "  VIEW FAILED"; continue; }
                python3 profile_roofline.py "$json" "$TAG" "${PX:-0}" "${TB:-0}" \
                    2>&1 | tee "$OUT/roofline_$TAG.txt"
                PD="$PAIRS/$TAG"; mkdir -p "$PD"
                cp "$BIG" "$PD/$hash.neff"; cp "$ntff" "$PD/$hash.ntff"; cp "$json" "$PD/summary.json"
              done

              echo "################ MICROBENCH SUMMARY"
              printf "  %-22s %12s %10s %12s %10s %10s %6s\n" op_shape active_us gpsimd% sw_packets pkt_per_px max_LSB gate
              for f in "$OUT"/roofline_*.txt; do
                [ -f "$f" ] || continue
                T=$(basename "$f" .txt); T=${T#roofline_}
                A=$(grep -oE "total_active_time +[0-9.]+" "$f" | awk '{print $2*1000000}' || true)
                G=$(grep -oE "gpsimd_engine +[0-9.]+ +[0-9.]+" "$f" | awk '{print $3}' || true)
                P=$(grep -oE "sw_dynamic_dma_packets +[0-9]+" "$f" | awk '{print $2}' || true)
                D=$(grep -oE "per output pixel +[0-9.]+" "$f" | awk '{print $4}' || true)
                L=$(grep -oE "max_diff [0-9.]+ LSB" "$OUT/$T.log" 2>/dev/null | awk '{print $2}' | head -1 || true)
                V=$(grep -oE "\[(PASS|FAIL) vs bar 3\]" "$OUT/$T.log" 2>/dev/null | tr -d '[]' | awk '{print $1}' | head -1 || true)
                printf "  %-22s %12s %10s %12s %10s %10s %6s\n" "$T" "${A:--}" "${G:--}" "${P:--}" "${D:--}" "${L:--}" "${V:--}"
              done
              echo ""

              ARCHIVE=/tmp/univr_microbench_$(date -u +%Y%m%d_%H%M%S).tar.gz
              tar -czf "$ARCHIVE" -C /tmp mb
              mkdir -p /var/mdl/univr_neuron
              cp "$ARCHIVE" /var/mdl/univr_neuron/
              echo "saved /var/mdl/univr_neuron/$(basename "$ARCHIVE") ($(du -h "$ARCHIVE" | cut -f1))"
          resources:
            claims:
              - name: neurons
            requests:
              cpu: 48
              memory: 248Gi
            limits:
              cpu: 84
              memory: 500Gi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: 621547421844-ap-southeast-4-pvc
              mountPath: /var/mdl
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: RES
              value: "256x384"
            - name: NEURON_LOGICAL_NC_CONFIG
              value: "1"
            - name: NEURON_RT_NUM_CORES
              value: "1"
            - name: NEURON_RT_VISIBLE_CORES
              value: "0"
            # No --model-type unet-inference: measured as the sole cause of the NCC_EBIR033 DMA
            # rejection. 8 arms on one shape, every arm with it rejected at in=23,040, every arm
            # without it fused. --target dropped too: the node is trn3 and the compiler detects it.
            - name: NEURON_CC_FLAGS
              value: "--lnc 1"
            - name: TORCH_NEURONX_NEFF_CACHE_DIR
              value: "/tmp/neff_cache"
            - name: OMP_NUM_THREADS
              value: "8"
            - name: NEURON_RT_LOG_LEVEL
              value: "ERROR"
            - name: NEURON_CC_LOG_LEVEL
              value: "ERROR"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: GITHUB_TOKEN
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        - name: 621547421844-ap-southeast-4-pvc
          persistentVolumeClaim:
            claimName: 621547421844-ap-southeast-4-pvc
