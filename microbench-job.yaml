apiVersion: batch/v1
kind: Job
metadata:
  name: univr-microbench
  namespace: default
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: univr-microbench
    spec:
      restartPolicy: Never
      nodeSelector:
        node-type: trn3-dev1
      resourceClaims:
        - name: neurons
          resourceClaimTemplateName: s-lnc1
      containers:
        - name: sweep
          image: 421672808698.dkr.ecr.us-east-1.amazonaws.com/concourse-release-0461d3b:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - "-exc"
            - |
              set -euo pipefail

              cd /tmp
              git clone -b main https://yahavb:${GITHUB_TOKEN}@github.com/yahavb/pave_univr_trn2_repro.git REPRO
              cd REPRO
              echo "commit $(git rev-parse HEAD)"

              OUT=/tmp/mb; mkdir -p "$OUT"
              finalize() {
                echo ""
                echo "=== FINALIZE (trap EXIT -- runs even on failure or early exit) ==="
                local A="/tmp/univr_microbench_$(date -u +%Y%m%d_%H%M%S).tar.gz"
                tar -czf "$A" -C /tmp mb 2>/dev/null || true
                if [ -s "$A" ]; then
                  mkdir -p /var/mdl/univr_neuron || true
                  cp "$A" /var/mdl/univr_neuron/ \
                    && echo "  saved /var/mdl/univr_neuron/$(basename "$A") ($(du -h "$A" | cut -f1))" \
                    || echo "  publish FAILED"
                else
                  echo "  nothing to archive"
                fi
              }
              trap finalize EXIT
              RES="${RES:-256x384}"
              H=${RES%%x*}; W=${RES##*x}

              mkdir -p /tmp/neff_cache
              nefs() { find /tmp/neff_cache -name '*.neff' 2>/dev/null | wc -l || true; }
              PAIRS="$OUT/pairs"; mkdir -p "$PAIRS"
              POUT=/tmp/perneff; mkdir -p "$POUT"

              SET="${SET:-both}"
              GRID="${GRID:-4x8}"; HALO="${HALO:-128}"

              NKILIB_TGZ="${NKILIB_TGZ:-/var/mdl/univr/nkilib.tar.gz}"
              if [ -f "$NKILIB_TGZ" ]; then
                cp "$NKILIB_TGZ" /tmp/nkilib.tar.gz && mkdir -p /tmp/nkilib \
                  && tar -xzf /tmp/nkilib.tar.gz -C /tmp/nkilib \
                  && export PYTHONPATH="/tmp/nkilib:${PYTHONPATH:-}" \
                  && echo "nkilib: restored from $NKILIB_TGZ -> PYTHONPATH"
              else
                echo "nkilib: no tar at $NKILIB_TGZ"
              fi
              if python3 -c "import nkilib.experimental.indirect.grid_sample" 2>/dev/null; then
                NKL="${NKL:-1}"; echo "nkilib: IMPORT OK  -> gridsample-nkl arms ENABLED (NKL=$NKL)"
              else
                NKL="${NKL:-0}"; echo "nkilib: IMPORT FAILS -> gridsample-nkl arms SKIPPED (NKL=$NKL)"
                echo "  to enable: tar the package as ONE object and put it on the PVC --"
                echo "    cd ~/KaenaNeuronKernelLibrary && tar -czf /tmp/nkilib.tar.gz -C src/nkilib_src nkilib"
                echo "    aws s3 cp /tmp/nkilib.tar.gz s3://621547421844-ap-southeast-4/univr/nkilib.tar.gz"
              fi
              echo ""

              WARP_IMPLS="${WARP_IMPLS:-gather,nki-dyn}"
              if [ "$NKL" = "1" ]; then WARP_IMPLS="$WARP_IMPLS,gridsample-nkl"; fi
              TOP="${TOP:-0}"

              SPECS="${SPECS:-}"
              if [ -z "$SPECS" ]; then
                python3 microbench.py --op x --grid "$GRID" --halo "$HALO" \
                    --warp-impls "$WARP_IMPLS" --top "$TOP" --list-op-sites | sed 's/^/  /'
                echo ""
                if [ "$SET" = "gsbackends" ]; then
                  GSG="$GRID"; GSH="$HALO"
                  DIMS=$(python3 microbench.py --op x --grid "$GSG" --halo "$GSH" \
                         --warp-impls gather --top 4 --op-site-class warps --op-site-specs \
                         | sed 's/^gather://')
                  echo "gsbackends  grid $GSG halo $GSH   dims: $(echo $DIMS | tr '\n' ' ')"
                  echo ""
                  for D in $DIMS; do
                    for BK in "gridsample:cpu" "gridsample:neuron" "gridsample-nkl:neuron"; do
                      OPN=${BK%%:*}; DEV=${BK##*:}
                      if [ "$OPN" = "gridsample-nkl" ] && [ "$NKL" != "1" ]; then continue; fi
                      TAG="${OPN}-${DEV}_$(echo $D | tr ',' 'x')"
                      echo "################ $TAG"
                      set +e
                      python -u microbench.py --op "$OPN" --shape "$D" --device "$DEV" \
                          --flow-smooth --flow-mag 2.33 2>&1 | tee "$OUT/$TAG.log"
                      rc=${PIPESTATUS[0]}
                      set -e
                      echo "  rc=$rc"
                      for i in $(seq 1 30); do pgrep -f microbench.py >/dev/null || break; sleep 2; done
                      sleep 3
                    done
                  done
                  echo ""
                  echo "################ GRIDSAMPLE ACROSS BACKENDS ($GSG halo $GSH)"
                  printf "  %-22s %-16s %10s %10s %9s\n" dim backend wall_ms max_LSB gate
                  for D in $DIMS; do
                    for BK in "gridsample:cpu" "gridsample:neuron" "gridsample-nkl:neuron"; do
                      OPN=${BK%%:*}; DEV=${BK##*:}
                      f="$OUT/${OPN}-${DEV}_$(echo $D | tr ',' 'x').log"
                      [ -f "$f" ] || continue
                      MS=$(grep -aoE "wall +[0-9.]+ ms" "$f" | head -1 | awk '{print $2}' || true)
                      L=$(grep -aoE "max_diff +[0-9.]+ LSB" "$f" | head -1 | awk '{print $2}' || true)
                      G=$(grep -aoE "\[(PASS|FAIL) vs bar 3\]" "$f" | head -1 | tr -d '[]' | awk '{print $1}' || true)
                      printf "  %-22s %-16s %10s %10s %9s\n" "$D" "${OPN}/${DEV}" "${MS:--}" "${L:--}" "${G:--}"
                    done
                  done
                  echo ""
                  echo "  Same op, same semantics, three lowerings -- the only variable is the"
                  echo "  backend. cpu is the golden (it IS the reference every arm is scored"
                  echo "  against), so its LSB is 0 by construction; its wall time is a sanity"
                  echo "  anchor, not a target. The question is whether NKI beats ATen on neuron."
                  exit 0
                fi

                if [ "$SET" = "nklsweep" ]; then
                  if [ "$NKL" != "1" ]; then echo "nklsweep needs nkilib; aborting"; exit 0; fi
                  SWEEP_SHAPE="${SWEEP_SHAPE:-3,704,768}"
                  CAPS="${CAPS:-none 128 256 512 1024}"
                  echo "nklsweep at $SWEEP_SHAPE   caps: $CAPS   (gather = 21.98 ms @ 40.39 ns/desc)"
                  for CAP in $CAPS; do
                    MI=""; [ "$CAP" = "none" ] || MI="--nkl-max-indices $CAP"
                    echo "################ nklcap${CAP}_$(echo $SWEEP_SHAPE | tr ',' 'x')"
                    set +e
                    python -u microbench.py --op gridsample-nkl --shape "$SWEEP_SHAPE" \
                        --device neuron --flow-smooth --flow-mag 2.33 $MI \
                        2>&1 | tee "$OUT/nklcap$CAP.log"
                    rc=${PIPESTATUS[0]}
                    set -e
                    echo "  rc=$rc"
                    for i in $(seq 1 30); do pgrep -f microbench.py >/dev/null || break; sleep 2; done
                    sleep 5
                  done
                  echo ""
                  echo "################ NKL BATCHING SWEEP ($SWEEP_SHAPE)"
                  printf "  %-10s %5s %10s %9s %8s %9s\n" cap rc active_ms ns_desc hwDMA% max_LSB
                  for CAP in $CAPS; do
                    f="$OUT/nklcap$CAP.log"; [ -f "$f" ] || continue
                    A=$(grep -aoE "total_active_time +[0-9.]+" "$f" | awk '{print $2*1000}' | head -1 || true)
                    N=$(grep -aoE "ns per descriptor +[0-9.]+" "$f" | awk '{print $4}' | head -1 || true)
                    HW=$(grep -aoE "hardware_dynamic_dma +[0-9.]+ +[0-9.]+" "$f" | awk '{print $3}' | head -1 || true)
                    L=$(grep -aoE "max_diff +[0-9.]+ LSB" "$f" | awk '{print $2}' | head -1 || true)
                    printf "  %-10s %5s %10s %9s %8s %9s\n" "$CAP" "-" "${A:--}" "${N:--}" "${HW:--}" "${L:--}"
                  done
                  echo ""
                  echo "  BEAT gather = ns_desc below 40.39. If no cap does, the kernel cannot"
                  echo "  displace gather in this model and the CR is a win only over ATen"
                  echo "  gridsample, which the model does not use."
                  exit 0
                fi

                if [ "$SET" = "sequence" ]; then
                  TILE="${TILE:-9}"; ITERS="${ITERS:-5}"; FULLGRAPH="${FULLGRAPH:-1}"
                  SEQ_WARPS="${SEQ_WARPS:-gather}"
                  if [ "$NKL" = "1" ]; then SEQ_WARPS="$SEQ_WARPS gridsample-nkl"; fi
                  REF=/tmp/ref_seq.npy
                  for W in $SEQ_WARPS; do
                    echo "################ sequence_${W}_t${TILE}"
                    EX=""
                    if [ "$W" = "gather" ]; then EX="--save-out $REF"
                    elif [ -f "$REF" ]; then EX="--cmp $REF"; fi
                    set +e
                    python -u microbench.py --op sequence --grid "$GRID" --halo "$HALO" \
                        --tile "$TILE" --warp "$W" --iters "$ITERS" \
                        --fullgraph "$FULLGRAPH" --device neuron $EX \
                        2>&1 | tee "$OUT/sequence_$W.log"
                    rc=${PIPESTATUS[0]}
                    set -e
                    echo "  rc=$rc"
                    if [ "$rc" != "0" ]; then
                      { grep -aoE "got in=[0-9]+ and out=[0-9]+|kernel_assert|Unsupported|MemoryError|Killed" \
                        "$OUT/sequence_$W.log" || true; } | head -3 | sed 's/^/    /'
                    fi
                    for i in $(seq 1 60); do pgrep -f microbench.py >/dev/null || break; sleep 2; done
                    sleep 5
                  done
                  echo ""
                  echo "################ SEQUENCE A/B (tile $TILE, $GRID halo $HALO)"
                  printf "  %-16s %5s %12s %14s %12s %s\n" warp rc tile_ms frame_8core equiv_LSB verdict
                  for W in $SEQ_WARPS; do
                    f="$OUT/sequence_$W.log"; [ -f "$f" ] || continue
                    MS=$(grep -aoE "TILE MEDIAN +[0-9.]+ ms" "$f" | head -1 | awk '{print $3}' || true)
                    FR=$(grep -aoE "[0-9.]+ ms across 8 cores" "$f" | head -1 | awk '{print $1}' || true)
                    EQ=$(grep -aoE "max_diff +[0-9.]+ LSB" "$f" | head -1 | awk '{print $2}' || true)
                    VD=$(grep -aoE "(AGREE|DISAGREE) vs" "$f" | head -1 | awk '{print $1}' || true)
                    printf "  %-16s %5s %12s %14s %12s %s\n" "$W" "-" "${MS:--}" "${FR:--}" "${EQ:--}" "${VD:-baseline}"
                  done
                  echo ""
                  echo "  tile_ms is the ONLY comparable latency here; per-op single-io us are noise."
                  echo "  frame_8core is a LOWER bound (equal cost per tile, perfect 8-way overlap)."
                  echo "  The bar is GATHER, not ATen gridsample: gather already sits at the"
                  echo "  1 desc/px floor at 40.40 ns, so a kernel wins only by beating ns/desc."
                  echo "  Whole resample is ~510 ms of the 3900 ms frame, so that is the ceiling."
                  exit 0
                fi

                SPECS=$(python3 microbench.py --op x --grid "$GRID" --halo "$HALO" \
                    --warp-impls "$WARP_IMPLS" --top "$TOP" --op-site-specs --op-site-class "$SET" \
                    | tr '\n' ' ')
              fi
              echo "SET=$SET  GRID=$GRID  HALO=$HALO  NKL=$NKL  TOP=$TOP  IMPLS=$WARP_IMPLS"
              echo "arms: $(echo $SPECS | wc -w)"
              echo ""

              FLOW="--flow-smooth --flow-mag 2.33"

              for SPEC in $SPECS; do
                OPSPEC=${SPEC%%:*}
                SHP=${SPEC#*:}
                OP=${OPSPEC%%/*}
                if [ "$OPSPEC" != "$OP" ]; then
                  RAD="--radius ${OPSPEC#*/}"
                  TAG="${OP}R${OPSPEC#*/}_$(echo $SHP | tr ',' 'x')"
                else
                  RAD=""
                  TAG="${OP}_$(echo $SHP | tr ',' 'x')"
                fi
                echo "################ $TAG"
                BEFORE=$(find /tmp/neff_cache -name '*.neff' 2>/dev/null | sort || true)
                set +e
                python -u microbench.py --op "$OP" --shape "$SHP" --device neuron \
                    $FLOW $RAD 2>&1 | tee "$OUT/$TAG.log"
                rc=${PIPESTATUS[0]}
                set -e
                if [ "$rc" != "0" ]; then
                  echo "  RUN FAILED rc=$rc"; tail -20 "$OUT/$TAG.log" | sed 's/^/    /'; continue
                fi
                PX=$(grep -oE "^output_px +[0-9]+" "$OUT/$TAG.log" | awk '{print $2}' || true)
                TB=$(grep -oE "^tap_bytes +[0-9]+" "$OUT/$TAG.log" | awk '{print $2}' || true)
                for i in $(seq 1 30); do pgrep -f microbench.py >/dev/null || break; sleep 2; done
                sleep 8
                AFTER=$(find /tmp/neff_cache -name '*.neff' 2>/dev/null | sort || true)
                NEW=$(comm -13 <(echo "$BEFORE") <(echo "$AFTER") || true)
                BIG=$(for f in $NEW; do [ -f "$f" ] && stat -c '%s %n' "$f"; done | sort -rn | head -1 | cut -d' ' -f2 || true)
                if [ -z "$BIG" ]; then echo "  no new NEFF (cache hit)"; continue; fi
                hash=$(basename "$BIG" .neff)
                ntff="$POUT/$hash.ntff"; json="$POUT/$hash.json"
                echo "  neff $hash ($(stat -c%s "$BIG") B)"
                PROF=neuron-explorer
                command -v "$PROF" >/dev/null 2>&1 || PROF=neuron-profile
                timeout 3600 "$PROF" capture --single-io -n "$BIG" -s "$ntff" \
                    >"$POUT/$hash.cap.log" 2>&1 || true
                if [ ! -s "$ntff" ] && [ "$PROF" != "neuron-profile" ]; then
                  echo "  $PROF capture empty -- retrying with neuron-profile"
                  timeout 3600 neuron-profile capture --single-io -n "$BIG" -s "$ntff" \
                      >>"$POUT/$hash.cap.log" 2>&1 || true
                fi
                [ -s "$ntff" ] || { echo "  CAPTURE FAILED"; tail -6 "$POUT/$hash.cap.log"; continue; }
                timeout 900 "$PROF" view -n "$BIG" -s "$ntff" \
                    --output-format summary-json > "$json" 2>/dev/null || true
                [ -s "$json" ] || { echo "  VIEW FAILED"; continue; }
                python3 profile_roofline.py "$json" "$TAG" "${PX:-0}" "${TB:-0}" \
                    2>&1 | tee "$OUT/roofline_$TAG.txt"
                PD="$PAIRS/$TAG"; mkdir -p "$PD"
                cp "$BIG" "$PD/$hash.neff"; cp "$ntff" "$PD/$hash.ntff"; cp "$json" "$PD/summary.json"
              done

              echo "################ MICROBENCH SUMMARY"
              printf "  %-22s %12s %10s %12s %10s %10s %6s\n" op_shape active_us gpsimd% sw_packets pkt_per_px max_LSB gate
              for f in "$OUT"/roofline_*.txt; do
                [ -f "$f" ] || continue
                T=$(basename "$f" .txt); T=${T#roofline_}
                A=$(grep -oE "total_active_time +[0-9.]+" "$f" | awk '{print $2*1000000}' || true)
                G=$(grep -oE "gpsimd_engine +[0-9.]+ +[0-9.]+" "$f" | awk '{print $3}' || true)
                P=$(grep -oE "sw_dynamic_dma_packets +[0-9]+" "$f" | awk '{print $2}' || true)
                D=$(grep -oE "per output pixel +[0-9.]+" "$f" | awk '{print $4}' || true)
                L=$(grep -oE "max_diff [0-9.]+ LSB" "$OUT/$T.log" 2>/dev/null | awk '{print $2}' | head -1 || true)
                V=$(grep -oE "\[(PASS|FAIL) vs bar 3\]" "$OUT/$T.log" 2>/dev/null | tr -d '[]' | awk '{print $1}' | head -1 || true)
                printf "  %-22s %12s %10s %12s %10s %10s %6s\n" "$T" "${A:--}" "${G:--}" "${P:--}" "${D:--}" "${L:--}" "${V:--}"
              done
              echo ""

          resources:
            claims:
              - name: neurons
            requests:
              cpu: 48
              memory: 248Gi
            limits:
              cpu: 84
              memory: 500Gi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: 621547421844-ap-southeast-4-pvc
              mountPath: /var/mdl
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: RES
              value: "256x384"
            - name: SET
              value: "gsbackends"
            - name: TOP
              value: "4"
            - name: GRID
              value: "4x8"
            - name: HALO
              value: "64"
            - name: TILE
              value: "9"
            - name: ITERS
              value: "5"
            - name: NEURON_LOGICAL_NC_CONFIG
              value: "1"
            - name: NEURON_RT_NUM_CORES
              value: "1"
            - name: NEURON_RT_VISIBLE_CORES
              value: "0"
            - name: NEURON_CC_FLAGS
              value: "--lnc 1"
            - name: TORCH_NEURONX_NEFF_CACHE_DIR
              value: "/tmp/neff_cache"
            - name: OMP_NUM_THREADS
              value: "8"
            - name: NEURON_RT_LOG_LEVEL
              value: "ERROR"
            - name: NEURON_CC_LOG_LEVEL
              value: "ERROR"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: GITHUB_TOKEN
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        - name: 621547421844-ap-southeast-4-pvc
          persistentVolumeClaim:
            claimName: 621547421844-ap-southeast-4-pvc
