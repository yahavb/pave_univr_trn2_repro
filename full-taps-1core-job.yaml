apiVersion: batch/v1
kind: Job
metadata:
  name: univr-full-taps-1core
  namespace: default
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: univr-full-taps-1core
    spec:
      restartPolicy: Never
      nodeSelector:
        node-type: trn3-dev1
      resourceClaims:
        - name: neurons
          resourceClaimTemplateName: s-lnc1
      containers:
        - name: bench
          image: 421672808698.dkr.ecr.us-east-1.amazonaws.com/concourse-release-0461d3b:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - "-ec"
            - |
              set -euo pipefail

              BRANCH="${BRANCH:-main}"
              cd /tmp
              git clone -b "$BRANCH" https://yahavb:${GITHUB_TOKEN}@github.com/yahavb/pave_univr_trn2_repro.git REPRO
              cd REPRO

              GIT_SHA=$(git rev-parse HEAD); GIT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
              echo "commit ${GIT_SHA:0:8} ($GIT_BRANCH) | cc $(neuronx-cc --version 2>&1 | head -1 | awk '{print $NF}') | ccflags ${NEURON_CC_FLAGS:-<unset>}"

              PROBE='import torch,repro_unrolling_trn2; print("cache_size_limit="+str(torch._dynamo.config.cache_size_limit), "accumulated="+str(torch._dynamo.config.accumulated_cache_size_limit))'
              echo "dynamo: $(python3 -c "$PROBE" 2>&1 | tail -1)"

              GRID="${GRID:-4x8}"; HALO="${HALO:-128}"; WARP="${WARP:-gather}"
              CORES="${CORES:-8}"; ITERS="${ITERS:-5}"
              FULLGRAPH="${FULLGRAPH:-1}"
              PREWARM_TILES="${PREWARM_TILES:-9 17 8 16 1 25 0 24}"
              TOPN="${TOPN:-5}"
              REFERENCE="README trn2 eager 3673.3 ms / 0.64 LSB; g6e L40S 351.1 ms (161 ms ONNX+TRT)"

              SR="${STATIC_RESIZE:-0}"
              case "$SR" in
                0) RESIZE_FLAG="--resize interpolate" ;;
                3) RESIZE_FLAG="--resize precomputed" ;;
                *) echo "STATIC_RESIZE=$SR no longer exists; use 0 or 3"; exit 1 ;;
              esac
              CFG="${GRID}_h${HALO}_sr${SR}_fg${FULLGRAPH}"
              TS=$(date -u +%Y%m%d_%H%M%S)
              RUN="exp_univr-${CFG}-${WARP}_${TS}"
              PVC=/var/mdl/univr
              RUNDIR="$PVC/runs/$RUN"
              CACHE_TGZ="$PVC/neff_cache_${CFG}.tar.gz"
              LEGACY_TGZ="$PVC/neff_cache_${GRID}_h${HALO}_sr${SR}.tar.gz"
              if [ ! -f "$CACHE_TGZ" ] && [ "$FULLGRAPH" = "1" ] && [ -f "$LEGACY_TGZ" ]; then
                echo "cache: adopting legacy fullgraph=1 key $(basename "$LEGACY_TGZ")"
                CACHE_TGZ="$LEGACY_TGZ"
                ADOPTED_LEGACY=1
              fi

              R=/tmp/results; rm -rf "$R"; mkdir -p "$R/explorer" "$R/perfetto" "$R/pairs"
              export TORCH_NEURONX_NEFF_CACHE_DIR=/tmp/neff_cache
              mkdir -p /tmp/neff_cache

              echo "config: $GRID h$HALO warp $WARP ${CORES}c ${ITERS}it fp32 static-resize $SR fullgraph $FULLGRAPH"

              mkdir -p "$RUNDIR/explorer" "$RUNDIR/perfetto" || true
              publish() {
                local src="$1" dst="$2"
                [ -f "$src" ] || { echo "  publish SKIP (absent): $(basename "$src")"; return 0; }
                local n; n=$(wc -c < "$src")
                [ "$n" -gt 0 ] || { echo "  publish REFUSED (0 bytes): $(basename "$src")"; return 0; }
                cp "$src" "$dst" || { echo "  publish FAILED: $(basename "$src")"; return 0; }
                local m; m=$(wc -c < "$dst" 2>/dev/null || echo 0)
                if [ "$m" = "$n" ]; then
                  echo "  published $(basename "$dst")  $(( n / 1048576 )) MB  OK"
                else
                  echo "  publish SIZE MISMATCH $(basename "$dst"): $n -> $m"
                fi
              }

              archive_cache() {
                local n; n=$(find /tmp/neff_cache -name '*.neff' 2>/dev/null | wc -l)
                [ "$n" -gt 0 ] || return 0
                tar -czf /tmp/neff_cache.tar.gz -C /tmp neff_cache 2>/dev/null || return 0
                publish /tmp/neff_cache.tar.gz "$CACHE_TGZ"
                echo "  cache archived: $n NEFFs -> $CACHE_TGZ"
              }

              finalize() {
                echo ""
                echo "=== FINALIZE (trap EXIT -- runs even on failure) ==="
                archive_cache
                tar -czf "/tmp/univr_results_${TS}.tar.gz" -C /tmp results 2>/dev/null || true
                publish "/tmp/univr_results_${TS}.tar.gz" "$RUNDIR/univr_results_${TS}.tar.gz"
                echo "  layout: $RUNDIR"
                ls -1 "$RUNDIR" 2>/dev/null | sed 's/^/    /' || true
              }
              trap finalize EXIT

              if [ -f "$CACHE_TGZ" ]; then
                cp "$CACHE_TGZ" /tmp/restore.tar.gz && tar -xzf /tmp/restore.tar.gz -C /tmp \
                  || echo "│ WARNING: restore failed"
                echo "cache[generic]: $(basename "$CACHE_TGZ") $(du -h "$CACHE_TGZ" | cut -f1)"
              else
                echo "cache[generic]: none"
              fi
              CACHE_BEFORE=$(find /tmp/neff_cache -name '*.neff' 2>/dev/null | wc -l)
              echo "cache[generic]: $CACHE_BEFORE NEFFs"
              if [ "${ADOPTED_LEGACY:-0}" = "1" ]; then
                CACHE_TGZ="$PVC/neff_cache_${CFG}.tar.gz"
                echo "cache: further archives go to $(basename "$CACHE_TGZ")"
              fi

              PROF=neuron-explorer
              command -v "$PROF" >/dev/null 2>&1 || PROF=neuron-profile
              echo "profiler CLI: $PROF"

              FRAMES="--rs0 rs70.png --rs1 rs71.png --rs2 rs72.png"
              REF="--gt ref_cuda_fp32_1728x4096.npy --weights pre_net_flow.pth"
              BASE="--height 1728 --width 4096 --tiles $GRID --halo $HALO --bar 3 --device neuron --dtype fp32 --fullgraph $FULLGRAPH $RESIZE_FLAG"

              RES="${RES:-}"
              SKIP_PROBE=0
              if [ -n "$RES" ]; then
                RH=${RES%%x*}; RW=${RES##*x}
                REF="--random-weights"
                BASE="--height $RH --width $RW --tiles 1x1 --bar 3 --device neuron --dtype fp32 --fullgraph $FULLGRAPH $RESIZE_FLAG"
                CORES=1
                SKIP_PROBE=1
                CFG="${RES}_sr${SR}"
                RUN="exp_univr-${RES}-${WARP}-fg${FULLGRAPH}-sr${SR}_${TS}"
                RUNDIR="$PVC/runs/$RUN"
                CACHE_TGZ="$PVC/neff_cache_${RES}_fg${FULLGRAPH}_sr${SR}.tar.gz"
                mkdir -p "$RUNDIR/explorer" "$RUNDIR/perfetto" || true
                echo "── REDUCED: ${RH}x${RW} = $((RH*RW)) px, 1x1, 1 core, random weights"
              fi
              echo "  run dir   : $RUNDIR"
              echo ""

              NKILIB_TGZ="${NKILIB_TGZ:-$PVC/nkilib.tar.gz}"
              case "${WARP:-}:${WARPEAGER_WARP:-}:${WARPCMP_ARMS:-}" in
                *gridsample-nkl*)
                  if [ -f "$NKILIB_TGZ" ]; then
                    cp "$NKILIB_TGZ" /tmp/nkilib.tar.gz && mkdir -p /tmp/nkilib \
                      && tar -xzf /tmp/nkilib.tar.gz -C /tmp/nkilib \
                      && export PYTHONPATH="/tmp/nkilib:${PYTHONPATH:-}" \
                      && echo "nkilib: restored from $NKILIB_TGZ"
                  else
                    echo "nkilib: no tar at $NKILIB_TGZ"
                  fi
                  if python3 -c "import nkilib.experimental.indirect.grid_sample" 2>/dev/null; then
                    echo "nkilib: IMPORT OK -- gridsample-nkl available"
                  else
                    echo "nkilib: IMPORT FAILS -- gridsample-nkl arms will be SKIPPED"
                  fi
                  echo ""
                  ;;
                *) echo "nkilib: NOT restored -- no arm requests gridsample-nkl"; echo "" ;;
              esac

              if [ "${MODE:-full}" = "warpeager" ]; then
                WE_RES="${WARPEAGER_RES-288x320}"
                WE_WARP="${WARPEAGER_WARP:-gridsample}"
                WE_ITERS="${WARPEAGER_ITERS:-3}"
                WE_TILE="${WARPEAGER_TILE:-9}"
                if [ -n "$WE_RES" ]; then
                  WH=${WE_RES%%x*}; WW=${WE_RES##*x}
                  GEOM="--height $WH --width $WW --tiles 1x1 --random-weights"
                  LBL="warpeager_${WE_WARP}_${WE_RES}_sr${SR}"
                else
                  GEOM="--height 1728 --width 4096 --tiles $GRID --halo $HALO $REF --only-tile $WE_TILE"
                  LBL="warpeager_${WE_WARP}_t${WE_TILE}_h${HALO}_sr${SR}"
                fi
                RUN="exp_univr-${LBL}_${TS}"
                RUNDIR="$PVC/runs/$RUN"
                CACHE_TGZ="$PVC/neff_cache_${LBL}.tar.gz"
                mkdir -p "$RUNDIR/perfetto" "$RUNDIR/pairs" "$RUNDIR/explorer" || true
                rm -rf /tmp/neff_cache; mkdir -p /tmp/neff_cache
                if [ -f "$CACHE_TGZ" ]; then
                  cp "$CACHE_TGZ" /tmp/we_restore.tar.gz \
                    && tar -xzf /tmp/we_restore.tar.gz -C /tmp \
                    && echo "cache: restored $(find /tmp/neff_cache -name '*.neff' | wc -l) NEFFs from $CACHE_TGZ"
                else
                  echo "cache: none at $CACHE_TGZ -- cold compile expected"
                fi
                echo "MODE=warpeager ${WE_RES:-$GRID h$HALO tile$WE_TILE} warp=$WE_WARP sr=$SR iters=$WE_ITERS"
                [ -n "$WE_RES" ] && echo "geometry: REDUCED $WE_RES 1x1 random-weights" \
                                  || echo "geometry: REAL TILE $GRID h$HALO only-tile $WE_TILE golden"
                [ -n "$RES" ] && echo "NOTE RES=$RES unused here (forced --random-weights; clear it for a scored run)"
                echo "run dir: $RUNDIR"

                WE_CLEAN_ITERS="${WARPEAGER_CLEAN_ITERS:-5}"
                find /tmp/neff_cache -name '*.neff' -printf '%f\n' 2>/dev/null | sort > /tmp/neff_before.txt
                echo "[W] compile (not timed)"
                set +e
                python -u repro_unrolling_trn2.py $FRAMES $GEOM --bar 3 \
                    --dtype fp32 --device neuron --cores 1 \
                    --warp "$WE_WARP" --warp-region eager $RESIZE_FLAG --iters 0 \
                    2>&1 | tee "$R/${LBL}_warm.log" \
                  | grep -aiE "only-tile|first call|Killed|Error|MemoryError" || true
                wrc=${PIPESTATUS[0]}
                set -e
                echo "  rc=$wrc  NEFFs now $(find /tmp/neff_cache -name '*.neff' | wc -l)"
                find /tmp/neff_cache -name '*.neff' -printf '%f\n' 2>/dev/null | sort > /tmp/neff_after.txt
                if [ -s /tmp/neff_before.txt ]; then
                  NEW=$(comm -13 /tmp/neff_before.txt /tmp/neff_after.txt | wc -l)
                  echo "  NEW graphs compiled by [W]: $NEW"
                  comm -13 /tmp/neff_before.txt /tmp/neff_after.txt | head -20 | sed 's/^/    + /'
                fi
                archive_cache
                for i in $(seq 1 90); do pgrep -f repro_unrolling_trn2.py >/dev/null || break; sleep 2; done
                sleep 5

                echo "[L] clean latency (no profiler)"
                B0=$(find /tmp/neff_cache -name '*.neff' | wc -l)
                set +e
                python -u repro_unrolling_trn2.py $FRAMES $GEOM --bar 3 \
                    --dtype fp32 --device neuron --cores 1 \
                    --warp "$WE_WARP" --warp-region eager $RESIZE_FLAG --iters "$WE_CLEAN_ITERS" \
                    --save-ref "$R/frame_${LBL}.npy" \
                    2>&1 | tee "$R/${LBL}_clean.log" \
                  | grep -aE "steady state|max_diff|PSNR|only-tile|Killed|Error|Traceback" || true
                lrc=${PIPESTATUS[0]}
                set -e
                A0=$(find /tmp/neff_cache -name '*.neff' | wc -l)
                T_CLEAN=$(grep -aoE "steady state: median [0-9.]+ ms" "$R/${LBL}_clean.log" | head -1 | awk '{print $4}' || true)
                T_FIRST=$(grep -aoE "first call [0-9.]+ ms" "$R/${LBL}_clean.log" | head -1 | awk '{print $3}' || true)
                LSB=$(grep -aoE "max_diff +[0-9.]+ LSB" "$R/${LBL}_clean.log" | tail -1 | awk '{print $2}' || true)
                PSNR=$(grep -aoE "PSNR +[0-9.]+ dB" "$R/${LBL}_clean.log" | tail -1 | awk '{print $2}' || true)
                echo "  rc=$lrc  CLEAN median=${T_CLEAN:--} ms over $WE_CLEAN_ITERS iters"
                echo "  max_diff=${LSB:--} LSB  PSNR=${PSNR:--} dB  first call=${T_FIRST:--} ms"
                echo "  NEFFs +$((A0-B0)) (must be +0, else the median contains a compile)"
                publish "$R/frame_${LBL}.png" "$RUNDIR/frame_${LBL}.png"
                publish "$R/frame_${LBL}.json" "$RUNDIR/frame_${LBL}.json"
                archive_cache
                for i in $(seq 1 90); do pgrep -f repro_unrolling_trn2.py >/dev/null || break; sleep 2; done
                sleep 5

                echo "[A] host trace (torch.profiler)"
                set +e
                python -u repro_unrolling_trn2.py $FRAMES $GEOM --bar 3 \
                    --dtype fp32 --device neuron --cores 1 \
                    --warp "$WE_WARP" --warp-region eager $RESIZE_FLAG --iters "$WE_ITERS" \
                    --perfetto "$R/perfetto/trace_${LBL}.json" \
                    2>&1 | tee "$R/$LBL.log"
                arc=${PIPESTATUS[0]}
                set -e
                echo "  rc=$arc  NEFFs now $(find /tmp/neff_cache -name '*.neff' | wc -l)"
                if [ "$arc" != "0" ]; then
                  { grep -aoE "got in=[0-9]+ and out=[0-9]+|MemoryError|Killed|Unsupported|FailOnRecompileLimitHit" \
                    "$R/$LBL.log" || true; } | head -3 | sed 's/^/    /'
                fi
                archive_cache
                publish "$R/perfetto/trace_${LBL}.json.gz" "$RUNDIR/perfetto/trace_${LBL}.json.gz"
                for i in $(seq 1 90); do pgrep -f repro_unrolling_trn2.py >/dev/null || break; sleep 2; done
                sleep 5

                echo ""
                echo "[B] op table"
                python3 scripts/neuron/pf_op_summary.py "$R/perfetto/trace_${LBL}.json.gz" --top 10 \
                    > "$R/optable_${LBL}.txt" 2>&1 || true
                sed -n '/MODEL THREAD/,$p' "$R/optable_${LBL}.txt" || true
                publish "$R/optable_${LBL}.txt" "$RUNDIR/optable_${LBL}.txt"

                echo ""
                echo "[C] runtime systrace -> device pftrace"
                SYSTRACE=/tmp/systrace_we; rm -rf "$SYSTRACE"; mkdir -p "$SYSTRACE"
                set +e
                NEURON_RT_INSPECT_ENABLE=1 \
                NEURON_RT_INSPECT_SYSTEM_PROFILE=1 \
                NEURON_RT_INSPECT_DEVICE_PROFILE=1 \
                NEURON_RT_INSPECT_OUTPUT_DIR="$SYSTRACE" \
                python -u repro_unrolling_trn2.py $FRAMES $GEOM --bar 3 \
                    --dtype fp32 --device neuron --cores 1 \
                    --warp "$WE_WARP" --warp-region eager $RESIZE_FLAG --iters 1 \
                    2>&1 | tee "$R/${LBL}_inspect.log" | grep -aiE "median|warp region|Killed|Error" || true
                set -e
                echo "  trace_info.pb count: $(find "$SYSTRACE" -name 'trace_info.pb' | wc -l)"
                set +e
                timeout 900 "$PROF" view -d "$SYSTRACE" --output-format perfetto \
                    > "$R/perfetto/view_${LBL}.log" 2>&1
                vrc=$?
                set -e
                PFT=$(find "$SYSTRACE" "$R" /tmp -maxdepth 3 -name '*.pftrace' -newer "$R/${LBL}_inspect.log" 2>/dev/null | head -1)
                if [ -n "${PFT:-}" ] && [ -s "$PFT" ]; then
                  gzip -c "$PFT" > "$R/perfetto/device_${LBL}.pftrace.gz"
                  publish "$R/perfetto/device_${LBL}.pftrace.gz" "$RUNDIR/perfetto/device_${LBL}.pftrace.gz"
                else
                  echo "  no .pftrace produced (rc=$vrc); tail of the view log:"
                  tail -6 "$R/perfetto/view_${LBL}.log" 2>/dev/null | sed 's/^/    /' || true
                fi

                echo ""
                echo "[D] per-NEFF engine breakdown"
                POUT=/tmp/perneff_we; rm -rf "$POUT"; mkdir -p "$POUT"
                mapfile -t NEFFS < <(find /tmp/neff_cache -name '*.neff' | sort)
                echo "  NEFFs in cache: ${#NEFFS[@]}"
                OK=0; N=0; T0=$SECONDS
                for neff in "${NEFFS[@]}"; do
                  N=$((N+1))
                  hash=$(basename "$neff" .neff)
                  if NEURON_RT_ENABLE_DGE_NOTIFICATIONS=1 timeout 900 \
                       "$PROF" capture --single-io -n "$neff" -s "$POUT/${hash}.ntff" >/dev/null 2>&1 \
                     && [ -f "$POUT/${hash}.ntff" ]; then
                    timeout 300 "$PROF" view -n "$neff" -s "$POUT/${hash}.ntff" \
                      --output-format summary-json > "$POUT/${hash}.json" 2>/dev/null || true
                    [ -s "$POUT/${hash}.json" ] && OK=$((OK+1))
                  else
                    echo "    $N/${#NEFFS[@]} ${hash:0:8} capture FAILED"
                  fi
                  if [ $((N % 10)) = 0 ] || [ "$N" = "${#NEFFS[@]}" ]; then
                    echo "    $N/${#NEFFS[@]} ok=$OK  $(( (SECONDS-T0) / 60 ))m"
                  fi
                done
                echo "  captured+viewed OK: $OK / ${#NEFFS[@]}"
                python3 scripts/neuron/profile_all_neffs.py "$POUT" > "$R/perneff_${LBL}.txt" 2>&1 || true
                sed -n '/MODEL-LEVEL/,$p' "$R/perneff_${LBL}.txt" || true
                python3 scripts/neuron/rank_neffs.py "$POUT" > "$R/ranking_${LBL}.txt" 2>&1 || true
                head -16 "$R/ranking_${LBL}.txt" || true
                sed -n '/TOP FIXABLE/,$p' "$R/ranking_${LBL}.txt" | head -8 || true
                publish "$R/perneff_${LBL}.txt" "$RUNDIR/perneff_${LBL}.txt"
                publish "$R/ranking_${LBL}.txt" "$RUNDIR/ranking_${LBL}.txt"
                i=0
                for hash in $(python3 scripts/neuron/top_neffs.py "$POUT" "${TOPN:-5}" 2>/dev/null || true); do
                  i=$((i+1))
                  src_neff=$(find /tmp/neff_cache -name "${hash}.neff" | head -1)
                  [ -n "$src_neff" ] && [ -f "$POUT/${hash}.ntff" ] || continue
                  MB=$(( $(wc -c < "$src_neff") / 1048576 ))
                  d="$R/pairs/$(printf 'rank%02d' $i)_${hash:0:8}__${MB}MB"
                  mkdir -p "$d"; cp "$src_neff" "$d/" && cp "$POUT/${hash}.ntff" "$d/"
                  [ -f "$POUT/${hash}.json" ] && cp "$POUT/${hash}.json" "$d/summary.json"
                  echo "  $(basename "$d"): $(ls "$d" | tr '\n' ' ')"
                done
                [ "$i" = "0" ] && echo "  pairs/ EMPTY -- expected if the capture sweep returned 0/N"

                echo ""
                echo "[E] pair -> graph pftrace"
                j=0; NPFT=0
                for pd in "$R"/pairs/rank*/; do
                  [ -d "$pd" ] || continue
                  nf=$(find "$pd" -maxdepth 1 -name '*.neff' | head -1)
                  nt=$(find "$pd" -maxdepth 1 -name '*.ntff' | head -1)
                  [ -n "$nf" ] && [ -n "$nt" ] || continue
                  h=$(basename "$nf" .neff); j=$((j+1))
                  G="$R/perfetto/graph_$(printf 'rank%02d' $j)_${h:0:8}.pftrace"
                  set +e
                  timeout 1800 "$PROF" view -n "$nf" -s "$nt" --output-format perfetto \
                      --output-file "$G" > "$R/perfetto/pft_${h}.log" 2>&1
                  prc=$?
                  set -e
                  if [ ! -s "$G" ]; then
                    alt=$(find "$pd" "$R/perfetto" "$(dirname "$nf")" -maxdepth 1 -name '*.pftrace' 2>/dev/null | head -1)
                    if [ -n "${alt:-}" ] && [ -s "$alt" ] && [ "$alt" != "$G" ]; then mv "$alt" "$G"; fi
                  fi
                  if [ -s "$G" ]; then
                    gzip -f "$G"
                    echo "  $(basename "$G").gz  $(du -h "${G}.gz" | cut -f1)  -- ui.perfetto.dev"
                    publish "${G}.gz" "$RUNDIR/perfetto/$(basename "${G}.gz")"
                    NPFT=$((NPFT+1))
                  else
                    echo "  NO pftrace for ${h:0:8} (rc=$prc); tail of the view log:"
                    tail -4 "$R/perfetto/pft_${h}.log" 2>/dev/null | sed 's/^/    /' || true
                  fi
                  publish "$R/perfetto/pft_${h}.log" "$RUNDIR/perfetto/pft_${h}.log"
                done
                [ "$j" = "0" ] && echo "  nothing to convert: [D] preserved no pairs"

                echo ""
                echo "[F] explorer bundle"
                BEST=$(find "$SYSTRACE" -name 'trace_info.pb' -printf '%s %h\n' 2>/dev/null | sort -rn | head -1 | awk '{print $2}' || true)
                if [ -n "${BEST:-}" ]; then
                  UP=/tmp/upload_bundle_we; rm -rf "$UP"; mkdir -p "$UP"
                  cp "$BEST"/* "$UP/" 2>/dev/null || true
                  for pd in "$R"/pairs/rank*/; do
                    [ -d "$pd" ] || continue
                    for f in "$pd"*.neff "$pd"*.ntff; do
                      [ -f "$f" ] && cp "$f" "$UP/" 2>/dev/null || true
                    done
                  done
                  for nt in "$UP"/*.ntff; do
                    [ -f "$nt" ] || continue
                    h=$(basename "$nt" .ntff); h=${h%%_rank_*}
                    f=$(find /tmp/neff_cache -name "${h}.neff" | head -1)
                    [ -n "$f" ] && cp "$f" "$UP/" 2>/dev/null || true
                  done
                  mkdir -p "$UP/source"
                  { echo "run       : $RUN"; echo "provenance: $GIT_BRANCH@$GIT_SHA";
                    echo "config    : ${WE_RES:-tile $WE_TILE} warp $WE_WARP --warp-region eager (fullgraph 0)";
                    echo "cc        : $(neuronx-cc --version 2>&1 | head -1)";
                    echo "ccflags   : ${NEURON_CC_FLAGS:-<unset>}";
                    echo "cmd [A]   : python repro_unrolling_trn2.py $FRAMES $GEOM --bar 3 --dtype fp32 --device neuron --cores 1 --warp $WE_WARP --warp-region eager --iters $WE_ITERS --perfetto ...";
                    echo "cmd [C]   : NEURON_RT_INSPECT_ENABLE=1 SYSTEM_PROFILE=1 DEVICE_PROFILE=1 (same args, --iters 1, no --perfetto)";
                  } > "$UP/source/PROVENANCE.txt"
                  cp repro_unrolling_trn2.py nki_shift_warp.py microbench.py profile_roofline.py \
                     univr-bench-job.yaml "$UP/source/" 2>/dev/null || true
                  cp -r scripts "$UP/source/" 2>/dev/null || true
                  ( cd "$UP/source" && find . -type f ! -name SHA256SUMS -exec sha256sum {} + \
                      > SHA256SUMS 2>/dev/null ) || true
                  echo "  source/: $(find "$UP/source" -type f | wc -l) files (subdir; not read by Directory Upload)"
                  tar -czf /tmp/source_we.tar.gz -C "$UP" source 2>/dev/null || true
                  publish /tmp/source_we.tar.gz "$RUNDIR/source.tar.gz"
                  echo "  top level: $(ls "$UP"/*.neff 2>/dev/null | wc -l) neff, $(ls "$UP"/*.ntff 2>/dev/null | wc -l) ntff, $(ls "$UP"/*.pb 2>/dev/null | wc -l) pb, trace_info.pb $(wc -c < "$UP/trace_info.pb" 2>/dev/null || echo MISSING) B"
                  tar -czf /tmp/upload_bundle_we.tar.gz -C "$UP" . 2>/dev/null || true
                  publish /tmp/upload_bundle_we.tar.gz "$RUNDIR/explorer/upload_bundle.tar.gz"
                else
                  echo "  MISSING trace_info.pb -- Directory Upload would be REJECTED (see ${LBL}_inspect.log)"
                fi
                tar -czf /tmp/systrace_bundle_we.tar.gz -C "$SYSTRACE" . 2>/dev/null || true
                publish /tmp/systrace_bundle_we.tar.gz "$RUNDIR/explorer/systrace_bundle.tar.gz"

                echo ""
                echo "################ WARPEAGER SUMMARY ################"
                T_A=$(grep -aoE "steady state: median [0-9.]+ ms" "$R/$LBL.log" 2>/dev/null | head -1 | awk '{print $4}' || true)
                printf "  %-38s %s\n" "CLEAN median (THE latency, no profiler)" "${T_CLEAN:--} ms"
                printf "  %-38s %s\n" "[A] median (torch.profiler ON)" "${T_A:--} ms"
                printf "  %-38s %s\n" "max_diff / bar 3" "${LSB:--} LSB"
                printf "  %-38s %s\n" "PSNR" "${PSNR:--} dB"
                printf "  %-38s %s\n" "first call (compile+warmup, [L])" "${T_FIRST:--} ms"
                grep -aE "RESAMPLE spans|TRACED WALL|VERDICT INPUT|MODEL THREAD" \
                  "$R/optable_${LBL}.txt" 2>/dev/null | sed 's/^/  /' || true
                echo "  artifacts: $RUNDIR"
                echo "  NOTE fullgraph=0 + eager region: not the fused config; MODE=full for a frame number"
                exit 0
              fi

              if [ "${MODE:-full}" = "warpcmp" ]; then
                WT="${WARPCMP_TILE:-9}"; WI="${WARPCMP_ITERS:-3}"
                WRES_LIST="${WARPCMP_RES-128x128 192x224 288x320}"
                WARPCMP_ARMS="${WARPCMP_ARMS:-aten:gridsample:neuron cpu:gridsample:cpu}"
                echo "=== MODE=warpcmp  ${WRES:-$GRID halo $HALO tile $WT}  iters $WI ==="
                echo "  model on neuron in every arm; only the resample region differs"
                for WRES in $WRES_LIST; do
                for CFG in $WARPCMP_ARMS; do
                  LB=${CFG%%:*}; Z=${CFG#*:}; WP=${Z%%:*}; RG=${Z##*:}
                  if [ "$WP" = "gridsample-nkl" ] && ! python3 -c "import nkilib.experimental.indirect.grid_sample" 2>/dev/null; then
                    echo "SKIP $LB: nkilib not importable (CR-288764575 unmerged; tar must CONTAIN grid_sample.py)"
                    continue
                  fi
                  if [ -n "$WRES" ]; then
                    WH=${WRES%%x*}; WW=${WRES##*x}
                    GEOM="--height $WH --width $WW --tiles 1x1 --random-weights"
                    LBL="warpcmp_${LB}_${WRES}"
                  else
                    GEOM="--height 1728 --width 4096 --tiles $GRID --halo $HALO $REF --only-tile $WT"
                    LBL="warpcmp_${LB}_t${WT}"
                  fi
                  echo "################ $LBL"
                  B=$(find /tmp/neff_cache -name '*.neff' 2>/dev/null | wc -l)
                  set +e
                  python -u repro_unrolling_trn2.py $FRAMES $GEOM --bar 3 \
                      --dtype fp32 --device neuron --cores 1 \
                      --warp "$WP" --warp-region "$RG" --iters "$WI" \
                      2>&1 | tee "$R/$LBL.log"
                  rc=${PIPESTATUS[0]}
                  set -e
                  A=$(find /tmp/neff_cache -name '*.neff' 2>/dev/null | wc -l)
                  echo "$rc" > "$R/rc_$LBL.txt"
                  echo "  rc=$rc  NEFFs +$((A-B))"
                  if [ "$rc" != "0" ]; then
                    { grep -aoE "got in=[0-9]+ and out=[0-9]+|MemoryError|Killed|Unsupported|kernel_assert" \
                      "$R/$LBL.log" || true; } | head -3 | sed 's/^/    /'
                  fi
                  archive_cache
                  for i in $(seq 1 90); do pgrep -f repro_unrolling_trn2.py >/dev/null || break; sleep 2; done
                  sleep 5
                done
                done
                echo ""
                echo "################ GRIDSAMPLE IN THE MODEL -- ${WRES:-$GRID halo $HALO tile $WT} fullgraph $WFG"
                printf "  %-10s %-8s %-14s %5s %12s %12s %10s\n" size cfg warp_region rc median_ms vs_aten first_ms
                for WRES in $WRES_LIST; do
                A_MS=$(grep -aoE "steady state: median [0-9.]+ ms" "$R/warpcmp_aten_${WRES}.log" 2>/dev/null | head -1 | awk '{print $4}' || true)
                for CFG in $WARPCMP_ARMS; do
                  LB=${CFG%%:*}; Z=${CFG#*:}; WP=${Z%%:*}; RG=${Z##*:}
                  f="$R/warpcmp_${LB}_${WRES}.log"; [ -f "$f" ] || continue
                  rc=$(cat "$R/rc_warpcmp_${LB}_${WRES}.txt" 2>/dev/null || echo '?')
                  MS=$(grep -aoE "steady state: median [0-9.]+ ms" "$f" | head -1 | awk '{print $4}' || true)
                  FI=$(grep -aoE "first call [0-9.]+ ms" "$f" | head -1 | awk '{print $3}' || true)
                  L=$(grep -aoE "max_diff +[0-9.]+ LSB" "$f" | tail -1 | awk '{print $2}' || true)
                  RGL="$RG"; if [ "$RG" = "cpu" ]; then RGL="cpu/inductor"; fi
                  VS="-"
                  if [ -n "${MS:-}" ] && [ -n "${A_MS:-}" ]; then
                    VS=$(awk -v m="$MS" -v a="$A_MS" 'BEGIN{if(a>0) printf "%.3fx", m/a; else print "-"}')
                  fi
                  printf "  %-10s %-8s %-14s %5s %12s %12s %10s\n" \
                    "$WRES" "$LB" "$RGL" "$rc" "${MS:--}" "$VS" "${FI:--}"
                done
                done
                exit 0
              fi

              echo "=== [1/3] BUILD/LOAD -- serial compile probe, ONE graph at a time (not timed) ==="
              if [ "$SKIP_PROBE" = "1" ]; then
                echo "  SKIPPED: reduced geometry has a single shape; the clean run compiles it"
                PW_ALL=1
              else
              echo "tiles (largest shape first): $PREWARM_TILES"
              PW_ALL=1
              for T in $PREWARM_TILES; do
                TAG="pw_${CFG}_t${T}"
                B=$(find /tmp/neff_cache -name '*.neff' 2>/dev/null | wc -l)
                S=$(date -u +%s)
                set +e
                NEURON_LAUNCH_BLOCKING=1 \
                python -u repro_unrolling_trn2.py $FRAMES $REF $BASE \
                    --cores 1 --only-tile "$T" --warp "$WARP" --iters 0 \
                    2>&1 | tee "$R/${TAG}.log"
                rc=${PIPESTATUS[0]}
                set -e
                MIN=$(( ($(date -u +%s) - S) / 60 ))
                A2=$(find /tmp/neff_cache -name '*.neff' 2>/dev/null | wc -l)
                SH=$(grep -aoE "padded [0-9]+x[0-9]+" "$R/${TAG}.log" | head -1 | awk '{print $2}' || true)
                printf "%s %s %s %s\n" "$T" "${SH:--}" "$rc" "$MIN" >> "$R/probe_table.txt"
                if [ "$rc" = "0" ]; then
                  echo "  tile $T  ${SH:--}  FUSES  ${MIN} min  NEFFs +$((A2-B))  cache=$A2"
                  archive_cache
                else
                  PW_ALL=0
                  echo "  tile $T  ${SH:--}  FAILED rc=$rc  ${MIN} min  cache=$A2"
                  { grep -aoE "got in=[0-9]+ and out=[0-9]+|Instructions generated by compiler [0-9]+ exceeds the typical limit of [0-9]+|MemoryError|Killed" \
                    "$R/${TAG}.log" || true; } | head -2 | sed 's/^/      /'
                  echo "  ==> a required graph is missing; abandoning the remaining probe tiles"
                  break
                fi
                for i in $(seq 1 90); do pgrep -f repro_unrolling_trn2.py >/dev/null || break; sleep 2; done
                sleep 5
              done
              echo "  ==> ALL 8 GRAPHS COMPILE = $PW_ALL  (cache holds $(find /tmp/neff_cache -name '*.neff' | wc -l) NEFFs)"

              if [ "$PW_ALL" = "1" ] && [ "$CORES" = "1" ]; then
                echo ""
                echo "=== [1b] SKIPPED: CORES=1, so [2/3] IS the serial full-frame pass ==="
              elif [ "$PW_ALL" = "1" ]; then
                echo ""
                echo "=== [1b] SERIAL FULL-FRAME WARM-UP (--cores 1, all tiles, not timed) ==="
                WB=$(find /tmp/neff_cache -name '*.neff' | wc -l)
                S=$(date -u +%s)
                set +e
                NEURON_LAUNCH_BLOCKING=1 \
                python -u repro_unrolling_trn2.py $FRAMES $REF $BASE \
                    --cores 1 --warp "$WARP" --iters 0 \
                    2>&1 | tee "$R/warm_full.log" \
                  | grep -aiE "replica|forward complete|Killed|Error|MemoryError" || true
                wrc=${PIPESTATUS[0]}
                set -e
                WA=$(find /tmp/neff_cache -name '*.neff' | wc -l)
                echo "  rc=$wrc  $(( ($(date -u +%s) - S) / 60 )) min  NEFFs $WB -> $WA (+$((WA-WB)))"
                if [ "$wrc" != "0" ]; then
                  PW_ALL=0
                  echo "  ==> the full frame does NOT run on one core; the 8-core arm cannot work either"
                  { grep -aoE "RuntimeError: [^\"]{0,120}|MemoryError|Killed" "$R/warm_full.log" || true; } \
                    | head -2 | sed 's/^/      /'
                else
                  echo "  ==> full frame RUNS serially; cache is now complete for --cores $CORES"
                  archive_cache
                fi
              fi
              fi
              echo ""

              T_CLEAN=""; LSB=""; PSNR=""; GATE=""
              if [ "$PW_ALL" != "1" ]; then
                echo "  "
              else

              echo "=== [2/3] CLEAN RUN (NO profiler) -- median of $ITERS = THE REAL LATENCY ==="
              set +e
              python -u repro_unrolling_trn2.py $FRAMES $REF $BASE \
                  --cores "$CORES" --warp "$WARP" --iters "$ITERS" \
                  --save-ref "$R/frame_${CFG}_${WARP}.npy" \
                  2>&1 | tee "$R/clean.log"
              crc=${PIPESTATUS[0]}
              set -e
              T_CLEAN=$(grep -aoE "steady state: median [0-9.]+ ms" "$R/clean.log" | head -1 | awk '{print $4}' || true)
              LSB=$(grep -aoE "max_diff +[0-9.]+ LSB" "$R/clean.log" | tail -1 | awk '{print $2}' || true)
              PSNR=$(grep -aoE "PSNR +[0-9.]+ dB" "$R/clean.log" | tail -1 | awk '{print $2}' || true)
              GATE=$(grep -aoE "(PASS|FAIL) vs the shipped bar" "$R/clean.log" | tail -1 | awk '{print $1}' || true)
              NEW=$(find /tmp/neff_cache -name '*.neff' | wc -l)
              echo "  rc=$crc  median=${T_CLEAN:--} ms  max_diff=${LSB:--} LSB  PSNR=${PSNR:--} dB  gate=${GATE:--}"
              echo "  NEFFs now $NEW (was $CACHE_BEFORE at entry, expected +0 after the probe --"
              echo "  any increase means the probe missed a slot and compiles ran CONCURRENTLY here)"
              archive_cache
              publish "$R/frame_${CFG}_${WARP}.png" "$RUNDIR/frame_${CFG}_${WARP}.png"
              publish "$R/frame_${CFG}_${WARP}.json" "$RUNDIR/frame_${CFG}_${WARP}.json"

              echo "=== [3/3a] PROFILED RUN -- runtime system trace (trace_info.pb) ==="
              SYSTRACE=/tmp/systrace; rm -rf "$SYSTRACE"; mkdir -p "$SYSTRACE"
              set +e
              NEURON_RT_INSPECT_ENABLE=1 \
              NEURON_RT_INSPECT_SYSTEM_PROFILE=1 \
              NEURON_RT_INSPECT_DEVICE_PROFILE=1 \
              NEURON_RT_INSPECT_OUTPUT_DIR="$SYSTRACE" \
              python -u repro_unrolling_trn2.py $FRAMES $REF $BASE \
                  --cores "$CORES" --warp "$WARP" --iters 1 \
                  2>&1 | tee "$R/profiled.log"
              set -e
              T_PROF=$(grep -aoE "steady state: median [0-9.]+ ms" "$R/profiled.log" | head -1 | awk '{print $4}' || true)
              echo "  trace_info.pb count: $(find "$SYSTRACE" -name 'trace_info.pb' | wc -l)"
              echo "  rank subdirs       : $(find "$SYSTRACE" -maxdepth 1 -type d -name 'i-*' | wc -l)"
              echo ""

              echo "=== [3/3b] PROFILED RUN -- torch.profiler (host view only) ==="
              set +e
              python -u repro_unrolling_trn2.py $FRAMES $REF $BASE \
                  --cores "$CORES" --warp "$WARP" --iters 1 \
                  --perfetto "$R/perfetto/trace_rank0.json" \
                  2>&1 | tee "$R/perfetto.log" | grep -aiE "perfetto|median|FAILED" || true
              set -e
              publish "$R/perfetto/trace_rank0.json.gz" "$RUNDIR/perfetto/trace_rank0.json.gz"

              echo "--- [3/3c] systrace -> perfetto (device timeline, via $PROF view -d) ---"
              set +e
              timeout 900 "$PROF" view -d "$SYSTRACE" --output-format perfetto \
                  > "$R/perfetto/view_perfetto.log" 2>&1
              vrc=$?
              set -e
              PFT=$(find "$SYSTRACE" "$R" /tmp -maxdepth 3 -name '*.pftrace' -newer "$R/perfetto" 2>/dev/null | head -1)
              if [ -n "${PFT:-}" ] && [ -s "$PFT" ]; then
                gzip -c "$PFT" > "$R/perfetto/system_profile.pftrace.gz"
                publish "$R/perfetto/system_profile.pftrace.gz" "$RUNDIR/perfetto/system_profile.pftrace.gz"
              else
                echo "  no .pftrace produced (rc=$vrc); tail of the view log:"
                tail -6 "$R/perfetto/view_perfetto.log" 2>/dev/null | sed 's/^/    /' || true
              fi
              echo ""

              echo "=== [4] per-NEFF engine breakdown + fixability ranking ==="
              POUT=/tmp/perneff; rm -rf "$POUT"; mkdir -p "$POUT"

              mapfile -t NEFFS < <(find /tmp/neff_cache -name '*.neff' | sort)
              echo "  NEFFs in cache: ${#NEFFS[@]}"
              OK=0
              for neff in "${NEFFS[@]}"; do
                hash=$(basename "$neff" .neff)
                NEURON_RT_ENABLE_DGE_NOTIFICATIONS=1 timeout 900 \
                  "$PROF" capture --single-io -n "$neff" -s "$POUT/${hash}.ntff" >/dev/null 2>&1 || continue
                [ -f "$POUT/${hash}.ntff" ] || continue
                timeout 300 "$PROF" view -n "$neff" -s "$POUT/${hash}.ntff" \
                  --output-format summary-json > "$POUT/${hash}.json" 2>/dev/null || true
                [ -s "$POUT/${hash}.json" ] && OK=$((OK+1))
              done
              echo "  captured+viewed OK: $OK / ${#NEFFS[@]}"
              python3 scripts/neuron/profile_all_neffs.py "$POUT" 2>&1 | tee "$R/perneff_breakdown.txt" || true
              python3 scripts/neuron/rank_neffs.py "$POUT" 2>&1 | tee "$R/neff_ranking.txt" || true
              publish "$R/neff_ranking.txt" "$RUNDIR/neff_ranking.txt"

              echo ""
              echo "=== [4b] dominant-NEFF metric dump (summary-text) ==="
              BIGHASH=$(python3 scripts/neuron/pick_neffs.py "$POUT" /tmp/neff_cache 2>/dev/null | head -1 || true)
              if [ -n "${BIGHASH:-}" ] && [ -f "$POUT/${BIGHASH}.ntff" ]; then
                BIGNEFF=$(find /tmp/neff_cache -name "${BIGHASH}.neff" | head -1)
                timeout 300 "$PROF" view -n "$BIGNEFF" -s "$POUT/${BIGHASH}.ntff" \
                  --output-format summary-text 2>/dev/null | tee "$R/hotspots_${BIGHASH}.txt" || true
              else
                echo "  no dominant NEFF (capture sweep returned nothing) -- skip"
              fi

              echo ""
              echo "=== [5] preserve top-$TOPN heavy NEFF+NTFF pairs, PRE-JOINED ==="
              i=0
              for hash in $(python3 scripts/neuron/top_neffs.py "$POUT" "$TOPN" 2>/dev/null || true); do
                i=$((i+1))
                src_neff=$(find /tmp/neff_cache -name "${hash}.neff" | head -1)
                [ -n "$src_neff" ] && [ -f "$POUT/${hash}.ntff" ] || continue
                MB=$(( $(wc -c < "$src_neff") / 1048576 ))
                d="$R/pairs/$(printf 'rank%02d' $i)_${hash:0:8}__${MB}MB"
                mkdir -p "$d"
                cp "$src_neff" "$d/" && cp "$POUT/${hash}.ntff" "$d/"
                [ -f "$POUT/${hash}.json" ] && cp "$POUT/${hash}.json" "$d/summary.json"
                echo "  $(basename "$d"): $(ls "$d" | tr '\n' ' ')"
              done
              [ "$i" = "0" ] && echo "  pairs/ EMPTY -- expected if the capture sweep returned 0/N"

              echo ""
              echo "=== [6] explorer bundles ==="
              BEST=$(find "$SYSTRACE" -name 'trace_info.pb' -printf '%s %h\n' 2>/dev/null | sort -rn | head -1 | awk '{print $2}' || true)
              if [ -n "${BEST:-}" ]; then
                UP=/tmp/upload_bundle; rm -rf "$UP"; mkdir -p "$UP"
                cp "$BEST"/* "$UP/" 2>/dev/null || true
                for pd in "$R"/pairs/rank*/; do
                  [ -d "$pd" ] || continue
                  for f in "$pd"*.neff "$pd"*.ntff; do
                    [ -f "$f" ] && cp "$f" "$UP/" 2>/dev/null || true
                  done
                done
                for nt in "$UP"/*.ntff; do
                  [ -f "$nt" ] || continue
                  h=$(basename "$nt" .ntff); h=${h%%_rank_*}
                  f=$(find /tmp/neff_cache -name "${h}.neff" | head -1)
                  [ -n "$f" ] && cp "$f" "$UP/" 2>/dev/null || true
                done
                echo "  bundle NEFF/NTFF inventory:"
                for f in "$UP"/*.neff "$UP"/*.ntff "$UP"/*.pb; do
                  [ -f "$f" ] && printf "    %-52s %s bytes\n" "$(basename "$f")" "$(wc -c < "$f")"
                done
                echo "  upload_bundle: $(ls "$UP" | wc -l) files, trace_info.pb $(ls -la "$UP/trace_info.pb" 2>/dev/null | awk '{print $5}' || echo MISSING) bytes"
                tar -czf /tmp/upload_bundle.tar.gz -C "$UP" . 2>/dev/null || true
                publish /tmp/upload_bundle.tar.gz "$RUNDIR/explorer/upload_bundle.tar.gz"
              else
                echo "  MISSING trace_info.pb -- the Directory Upload will be REJECTED."
                echo "  Check profiled.log: a failed run has no trace to write; a successful one"
                echo "  means NEURON_RT_INSPECT_ENABLE did not take effect."
              fi
              tar -czf /tmp/systrace_bundle.tar.gz -C "$SYSTRACE" . 2>/dev/null || true
              publish /tmp/systrace_bundle.tar.gz "$RUNDIR/explorer/systrace_bundle.tar.gz"

              fi

              echo ""
              echo "################ UNIVR BENCH -- $RUN"
              echo "  provenance   : $GIT_BRANCH@${GIT_SHA:0:8}   cc $(neuronx-cc --version 2>&1 | head -1 | awk '{print $NF}')"
              echo "  config       : $GRID halo $HALO warp $WARP ${CORES} cores fp32 fullgraph"
              echo ""
              printf "  %-34s %s\n" "CLEAN median (THE latency)" "${T_CLEAN:--} ms"
              printf "  %-34s %s\n" "profiled median (overhead)" "${T_PROF:--} ms"
              printf "  %-34s %s\n" "max_diff / bar 3" "${LSB:--} LSB  ${GATE:--}"
              printf "  %-34s %s\n" "PSNR" "${PSNR:--} dB"
              printf "  %-34s %s\n" "reference" "$REFERENCE"
              echo ""
              echo "  probe (serial, one graph at a time):"
              printf "    %-6s %-10s %9s %5s %6s\n" tile padded px rc min
              if [ -f "$R/probe_table.txt" ]; then
                while read -r t sh rc mn; do
                  px=$(echo "$sh" | awk -Fx 'NF==2{print $1*$2}')
                  printf "    %-6s %-10s %9s %5s %6s\n" "$t" "$sh" "${px:--}" "$rc" "$mn"
                done < "$R/probe_table.txt"
              else
                echo "    (no probe rows)"
              fi
          resources:
            claims:
              - name: neurons
            requests:
              cpu: 48
              memory: 248Gi
            limits:
              cpu: 150
              memory: 1800Gi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: 621547421844-ap-southeast-4-pvc
              mountPath: /var/mdl
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: BRANCH
              value: "main"
            - name: MODE
              value: "full"
            - name: HALO
              value: "128"
            - name: GRID
              value: "4x8"
            - name: RES
              value: ""
            - name: WARP
              value: "gather"
            - name: CORES
              value: "1"
            - name: ITERS
              value: "1"
            - name: FULLGRAPH
              value: "1"
            - name: WARPCMP_TILE
              value: "9"
            - name: WARPCMP_RES
              value: "128x128 192x224 288x320"
            - name: WARPEAGER_RES
              value: ""
            - name: WARPEAGER_WARP
              value: "gridsample"
            - name: WARPEAGER_ITERS
              value: "3"
            - name: WARPEAGER_CLEAN_ITERS
              value: "5"
            - name: STATIC_RESIZE
              value: "3"
            - name: WARPEAGER_TILE
              value: "9"
            - name: NEURON_LOGICAL_NC_CONFIG
              value: "1"
            - name: NEURON_RT_NUM_CORES
              value: "8"
            - name: NEURON_RT_VISIBLE_CORES
              value: "0-7"
            - name: NEURON_CC_FLAGS
              value: "--lnc 1"
            - name: XLA_IR_DEBUG
              value: "1"
            - name: XLA_HLO_DEBUG
              value: "1"
            - name: NEURON_FRAMEWORK_DEBUG
              value: "1"
            - name: TORCH_NEURONX_NEFF_CACHE_DIR
              value: "/tmp/neff_cache"
            - name: OMP_NUM_THREADS
              value: "8"
            - name: NEURON_RT_LOG_LEVEL
              value: "ERROR"
            - name: NEURON_CC_LOG_LEVEL
              value: "ERROR"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: GITHUB_TOKEN
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        - name: 621547421844-ap-southeast-4-pvc
          persistentVolumeClaim:
            claimName: 621547421844-ap-southeast-4-pvc
