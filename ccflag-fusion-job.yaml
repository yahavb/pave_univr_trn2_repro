apiVersion: batch/v1
kind: Job
metadata:
  name: univr-ccflag-fusion
  namespace: default
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: univr-ccflag-fusion
    spec:
      restartPolicy: Never
      nodeSelector:
        node-type: trn3-dev1
        # NOT pinned to a host (retired 2026-08-19). The PVC mounts on any trn3-dev1 now. If a
        # pod ever sits Pending on "MountVolume.SetUp failed ... DeadlineExceeded" again,
        # s3-mount-test-pod.yaml checks one node in 85 s.
      resourceClaims:
        - name: neurons
          resourceClaimTemplateName: s-lnc1
      containers:
        - name: repro
          image: 421672808698.dkr.ecr.us-east-1.amazonaws.com/concourse-release-0461d3b:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - "-exc"
            - |
              set -euo pipefail

              cd /tmp
              git clone -b main https://yahavb:${GITHUB_TOKEN}@github.com/yahavb/pave_univr_trn2_repro.git REPRO
              cd REPRO

              echo "┌── PROVENANCE ──"
              echo "│ commit : $(git rev-parse HEAD)"
              echo "│ subject: $(git log -1 --pretty=%s)"
              echo "└────────────────"
              echo "neuronx-cc: $(neuronx-cc --version 2>&1 | head -1 || true)"
              echo ""

              # ============================================================================
              # MAKE WHOLE-FORWARD FUSION COMPILE, BY CHANGING THE COMPILER NOT THE GEOMETRY
              # ============================================================================
              # Geometry is exhausted. Every grid and halo reachable has been tried:
              #   2x4 any halo   in=17,776,640   tile too large, valid extent alone is 884,736 px
              #   2x8            OOM at 600Gi, 1000Gi and 1500Gi
              #   4x8 halo 128   3 of 4 shapes fuse, largest rejects
              #   4x8 halo 64    3 of 4 fuse, 512x576 rejects with in=23,040
              #   4x8 halo 48    0 of 3 fuse
              # Two independent pods reproduced the halo-48 result byte for byte, so these are
              # deterministic compiler verdicts, not flaky runs.
              #
              # WHAT THE ERROR ACTUALLY SAYS, corrected. Earlier I called this a divisibility
              # problem; it is not. 7 of the 8 rejecting operands divide 128 exactly. The text is
              #   "Number of elements in dimension 0 of InstDMACopy's input and dimension 0 of
              #    output AccessPatterns must MATCH, but got in=17776640 and out=128"
              # Match means EQUAL. The backend built a FLAT input access pattern of 17,776,640
              # elements against an output pattern of 128. out=128 is the SBUF partition count and
              # is constant across every single rejection -- 8 shapes, 3 different operand forms.
              # So the fault is that the input side was never tiled to partitions, and no choice of
              # tile shape changes that: it is how the backend lowered the fused DMA.
              #
              # The three operand forms are worth keeping in view, because they show the backend
              # fusing DIFFERENT numbers of resamples depending on shape:
              #   op = 14 * px   992x1280, 704x1280, 832x736, 992x512, 704x768   all 14 resamples
              #   op =  4 * px   480x608                                          4 resamples
              #   op = 45 * h    480x576 (21,600), 512x576 (23,040)   no width term at all, exact
              # 45 = 5 * 9 and the IFBlock lastconv emits exactly 5 channels via
              # ConvTranspose2d(c, 5, 4, 2, 1), so that form is plausibly the flow+mask tensor.
              #
              # THIS JOB IS THE ONE AXIS NEVER TOUCHED: compiler flags. Everything so far has run
              # with a single string, "--model-type unet-inference", inherited from the origin repo
              # and never varied there either -- grep across ~/pave-unrolling finds only that value.
              # The only flags ever swept are -O1 and -O3, and both are dead ends already measured:
              # -O1 causes the in=4 / I-3276 rejection, -O3 changed the instruction count by exactly
              # zero on 2x8 and 2x12.
              #
              # STAGE 0 discovers what is actually available rather than guessing flag names, and
              # dumps the full help text into the archive so the next iteration can read it.
              #
              # STAGE 1 sweeps flag sets on ONE fixed shape: 4x8 halo 64 tile 0, padded 512x576,
              # which rejects with in=23,040. Chosen deliberately -- it is the SMALLEST rejecting
              # shape and the other three shapes at that halo already fuse, so a flag that fixes
              # this one shape completes the set and makes 4x8 halo 64 a runnable configuration
              # immediately. Fixing the 14*px giants would be a bigger win but is a bigger ask.
              #
              # backoffLimit 1 so a failure is retried once and a transient cannot be mistaken for
              # a verdict.

              OUT=/tmp/univr_cf_out; mkdir -p "$OUT"
              FRAMES="--rs0 rs70.png --rs1 rs71.png --rs2 rs72.png"
              REF="--gt ref_cuda_fp32_1728x4096.npy --weights pre_net_flow.pth"

              echo "=== [0/2] WHAT FLAGS EXIST (dumped to the archive in full) ==="
              neuronx-cc compile --help > "$OUT/0_help_compile.txt" 2>&1 || true
              neuronx-cc --help > "$OUT/0_help_top.txt" 2>&1 || true
              echo "  help text: $(wc -l < "$OUT/0_help_compile.txt") lines (compile), $(wc -l < "$OUT/0_help_top.txt") lines (top)"
              echo "  --model-type choices:"
              grep -aoE "\-\-model-type[= ]?\{[^}]*\}|model-type.*choices[^)]*" "$OUT/0_help_compile.txt" | head -3 | sed 's/^/    /' || true
              grep -aiE "model.type" "$OUT/0_help_compile.txt" | head -6 | sed 's/^/    /' || true
              echo "  flags mentioning dma / access pattern / fuse / partition:"
              grep -aiE "^\s+--[a-z0-9-]+" "$OUT/0_help_compile.txt" \
                | grep -aiE "dma|access|fus|partition|tile|split|vectoriz|sb|sbuf" \
                | head -20 | sed 's/^/    /' || echo "    (none matched)"
              echo ""

              # Flag sets. BASE is what every run so far used, as the control.
              # Each entry is name|flags. Unknown flags make neuronx-cc exit non-zero, which shows
              # up as OTHER rather than a fusion verdict -- that is a useful signal, not a problem,
              # so speculative names are included on purpose and labelled.
              BASE="--lnc 1 --model-type unet-inference"
              FLAGSETS="${FLAGSETS:-control|$BASE
              no_model_type|--lnc 1
              mt_transformer|--lnc 1 --model-type transformer
              mt_generic|--lnc 1 --model-type generic
              autocast_none|$BASE --auto-cast=none
              O2_explicit|$BASE -O2
              enable_saturate|$BASE --enable-saturate-infinity
              no_lnc|--model-type unet-inference}"

              echo "=== [1/2] SWEEP FLAG SETS on 4x8 halo 64 tile 0 (512x576, rejects in=23040) ==="
              echo "$FLAGSETS" | while IFS='|' read -r FN FF; do
                FN=$(echo "$FN" | xargs); FF=$(echo "$FF" | xargs)
                [ -z "$FN" ] && continue
                echo "---- $FN : [$FF] ----"
                rm -rf /tmp/neff_cache; mkdir -p /tmp/neff_cache
                set +e
                NEURON_CC_FLAGS="$FF" NEURON_LAUNCH_BLOCKING=1 \
                python -u repro_unrolling_trn2.py \
                    $FRAMES $REF \
                    --height 1728 --width 4096 --tiles 4x8 --halo 64 --bar 3 \
                    --device neuron --cores 1 --only-tile 0 \
                    --warp gather --dtype fp32 --iters 0 \
                    2>&1 | tee "$OUT/f_${FN}.log"
                rc=${PIPESTATUS[0]}
                set -e
                echo "$rc" > "$OUT/rc_${FN}.txt"; echo "$FF" > "$OUT/ff_${FN}.txt"
                if [ "$rc" = "0" ]; then
                  echo "  FUSES  <-- this flag set makes 512x576 compile"
                elif grep -aq "NCC_EBIR033" "$OUT/f_${FN}.log"; then
                  echo "  REJECTED(dma) $(grep -aoE 'got in=[0-9]+ and out=[0-9]+' "$OUT/f_${FN}.log" | head -1)"
                elif grep -aq "Unrecognized\|unrecognized\|invalid choice\|no such option" "$OUT/f_${FN}.log"; then
                  echo "  BAD FLAG (not a fusion verdict)"
                  grep -aoE "Unrecognized[^\"]{0,90}|invalid choice[^\"]{0,90}|no such option[^\"]{0,60}" \
                    "$OUT/f_${FN}.log" | head -1 | sed 's/^/    /'
                else
                  echo "  OTHER rc=$rc"; tail -12 "$OUT/f_${FN}.log" | sed 's/^/    /'
                fi
                echo ""
                for i in $(seq 1 40); do pgrep -f repro_unrolling_trn2.py >/dev/null || break; sleep 2; done
                sleep 5
              done

              echo "################ FLAG SWEEP RESULT (target shape 512x576, in=23040)"
              printf "  %-16s %5s %-12s %s\n" flagset rc verdict flags
              for f in "$OUT"/f_*.log; do
                [ -f "$f" ] || continue
                FN=$(basename "$f" .log); FN=${FN#f_}
                rc=$(cat "$OUT/rc_${FN}.txt" 2>/dev/null || echo '?')
                FF=$(cat "$OUT/ff_${FN}.txt" 2>/dev/null || echo '-')
                IN=$(grep -aoE "got in=[0-9]+" "$f" | head -1 | cut -d= -f2 || true)
                if [ "$rc" = "0" ]; then V=FUSES
                elif grep -aq "NCC_EBIR033" "$f"; then V="REJ(in=${IN:-?})"
                elif grep -aqiE "unrecognized|invalid choice|no such option" "$f"; then V=BAD_FLAG
                else V="OTHER"; fi
                printf "  %-16s %5s %-12s %s\n" "$FN" "$rc" "$V" "$FF"
              done
              echo ""
              echo "  HOW TO READ IT:"
              echo "  * any FUSES -> that flag set completes 4x8 halo 64, whose other three shapes"
              echo "    already fuse. Re-run all four tiles with it to confirm, then time the frame."
              echo "  * control REJ(in=23040) -> the control reproduced, so the sweep is valid."
              echo "  * a flag changes in= to a DIFFERENT value -> it is reaching the DMA lowering."
              echo "    That is the thread to pull even if it still rejects."
              echo "  * BAD_FLAG -> the name does not exist on this compiler. Read 0_help_compile.txt"
              echo "    in the archive and pick real ones; the guesses here are deliberate probes."
              echo "  * everything REJ with in=23040 unchanged -> flags are not a lever either, and"
              echo "    the remaining options are a graph boundary at the resamples, or one NKI"
              echo "    kernel subsuming them so there are not 14 separate resamples to fuse."
              echo ""

              ARCHIVE=/tmp/univr_cf_$(date -u +%Y%m%d_%H%M%S).tar.gz
              tar -czf "$ARCHIVE" -C /tmp univr_cf_out
              mkdir -p /var/mdl/univr_neuron
              cp "$ARCHIVE" /var/mdl/univr_neuron/
              echo "Saved: /var/mdl/univr_neuron/$(basename "$ARCHIVE") ($(du -h "$ARCHIVE" | cut -f1))"
              echo "Done."
          resources:
            claims:
              - name: neurons
            requests:
              cpu: 48
              memory: 248Gi
            limits:
              cpu: 150
              memory: 1500Gi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: 621547421844-ap-southeast-4-pvc
              mountPath: /var/mdl
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: NEURON_LOGICAL_NC_CONFIG
              value: "1"
            - name: NEURON_RT_NUM_CORES
              value: "8"
            - name: NEURON_RT_VISIBLE_CORES
              value: "0-7"
            # Deliberately NOT set here: each arm exports its own NEURON_CC_FLAGS, so a value in
            # this block would be overridden and only cause confusion about what actually ran.
            - name: TORCH_NEURONX_NEFF_CACHE_DIR
              value: "/tmp/neff_cache"
            - name: OMP_NUM_THREADS
              value: "8"
            - name: NEURON_RT_LOG_LEVEL
              value: "ERROR"
            - name: NEURON_CC_LOG_LEVEL
              value: "ERROR"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: GITHUB_TOKEN
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        - name: 621547421844-ap-southeast-4-pvc
          persistentVolumeClaim:
            claimName: 621547421844-ap-southeast-4-pvc
