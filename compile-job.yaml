apiVersion: batch/v1
kind: Job
metadata:
  name: univr-trn-compile
  namespace: default
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: univr-trn-compile
    spec:
      restartPolicy: Never
      nodeSelector:
        node-type: trn3-dev1
      resourceClaims:
        - name: neurons
          resourceClaimTemplateName: s-lnc1
      containers:
        - name: compile
          image: 621547421844.dkr.ecr.us-west-2.amazonaws.com/native-pytorch:2.11.0-neuronx-py312-sdk2.31.0-ubuntu24.04-neurondlcbuilder-development-6486001458-0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - "-exc"
            - |
              set -euo pipefail

              cd /tmp
              git clone -b main https://yahavb:${GITHUB_TOKEN}@github.com/yahavb/pave_univr_trn2_repro.git REPRO
              cd REPRO

              echo "┌── PROVENANCE ──"
              echo "│ commit : $(git rev-parse HEAD)"
              echo "│ subject: $(git log -1 --pretty=%s)"
              echo "└────────────────"

              echo "neuronx-cc : $(neuronx-cc --version 2>&1 | head -1)"
              python -c 'import torch, torch_neuronx, nki; print("torch", torch.__version__, "| torch-neuronx", torch_neuronx.__version__, "| nki", getattr(nki,"__version__","?"))' 2>&1 | tail -1
              echo ""

              OUT=/tmp/prof_out; mkdir -p "$OUT"
              FRAMES="--rs0 rs70.png --rs1 rs71.png --rs2 rs72.png"
              # Minimal shape: 32 is TILE_ALIGN, the floor. 1024 padded px against 1,269,760 at
              # the production tile, so compile is ~1240x less work. No --gt: the reference is 4K
              # and scoring a 32x32 output against it would resize and print a meaningless PSNR.
              REF="--weights pre_net_flow.pth"
              GEOM="--height 32 --width 32 --tiles 1x1 --halo 0"

              echo "Does --compile whole (ONE graph, fullgraph=True) work, and up to what shape?"
              echo "Every module compiled individually at 32x32, and whole failed at 992x1280 with"
              echo "NCC_EBIR033. So the variable is SHAPE, not structure. Bisect it."
              echo ""

              nefs() { find /tmp/neff_cache/ -name '*.neff' 2>/dev/null | wc -l; }

              # HxW:halo, smallest first. 32 is TILE_ALIGN. The last entry is the production tile.
              for SHAPE in 32x32:0 64x96:0 128x192:0 256x384:32 512x768:32 992x1280:32; do
                HW=${SHAPE%%:*}; HALO=${SHAPE##*:}
                H=${HW%%x*}; W=${HW##*x}
                PX=$(( H * W ))
                echo "=== --compile whole at ${H}x${W} halo $HALO (${PX} px) ==="
                PREV=$(nefs)
                NEURON_LAUNCH_BLOCKING=1 python -u repro_unrolling_trn2.py $FRAMES $REF \
                    --height $H --width $W --tiles 1x1 --halo $HALO \
                    --device neuron --cores 1 \
                    --warp nki-dyn --dtype fp32 \
                    --compile whole --iters 0 \
                    > "$OUT/whole_${H}x${W}.log" 2>&1 && rc=0 || rc=$?
                if grep -q "forward complete" "$OUT/whole_${H}x${W}.log"; then
                  echo "  OK  $(grep -oE 'first call [0-9]+ ms' "$OUT/whole_${H}x${W}.log" | head -1)  NEFFs +$(( $(nefs) - PREV ))"
                else
                  code=$(grep -oE "NCC_E[A-Z0-9]+" "$OUT/whole_${H}x${W}.log" | head -1)
                  ops=$(grep -oE "in=[0-9]+ and out=[0-9]+" "$OUT/whole_${H}x${W}.log" | head -1)
                  other=$(grep -oE "torch._dynamo.exc.[A-Za-z]+|KeyError: '[^']*'" "$OUT/whole_${H}x${W}.log" | head -1)
                  echo "  FAILED (exit $rc)  ${code:-${other:-unknown}}  ${ops:-}"
                fi
                echo ""
              done

              echo "=== SINGLE GRAPH vs SHAPE ==="
              LAST_OK=""
              for SHAPE in 32x32 64x96 128x192 256x384 512x768 992x1280; do
                f="$OUT/whole_${SHAPE}.log"
                [ -f "$f" ] || continue
                if grep -q "forward complete" "$f"; then
                  echo "  ${SHAPE}: OK"; LAST_OK=$SHAPE
                else
                  echo "  ${SHAPE}: FAILED  $(grep -oE 'NCC_E[A-Z0-9]+' "$f" | head -1)  $(grep -oE 'in=[0-9]+ and out=[0-9]+' "$f" | head -1)"
                fi
              done
              echo ""
              if [ -n "$LAST_OK" ]; then
                echo "  ONE graph with fullgraph=True works up to $LAST_OK."
              else
                echo "  ONE graph failed at every shape tried, including the smallest."
              fi
              echo ""
              echo "  total NEFFs: $(nefs) in /tmp/neff_cache"
              echo ""

              ARCHIVE=/tmp/univr_compile_$(date -u +%Y%m%d_%H%M%S).tar.gz
              tar -czf "$ARCHIVE" -C /tmp prof_out
              mkdir -p /var/mdl/univr_neuron
              cp "$ARCHIVE" /var/mdl/univr_neuron/
              echo "Saved: /var/mdl/univr_neuron/$(basename "$ARCHIVE") ($(du -h "$ARCHIVE" | cut -f1))"
              echo "Done."
          resources:
            claims:
              - name: neurons
            requests:
              cpu: 48
              memory: 248Gi
            limits:
              cpu: 84
              memory: 248Gi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: 621547421844-ap-southeast-4-pvc
              mountPath: /var/mdl
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: NEURON_LOGICAL_NC_CONFIG
              value: "1"
            - name: NEURON_RT_NUM_CORES
              value: "1"
            - name: NEURON_RT_VISIBLE_CORES
              value: "0"
            - name: NEURON_CC_FLAGS
              value: "--target trn2 --lnc 1 --model-type unet-inference"
            - name: TORCH_NEURONX_NEFF_CACHE_DIR
              value: "/tmp/neff_cache"
            - name: OMP_NUM_THREADS
              value: "8"
            - name: NEURON_RT_LOG_LEVEL
              value: "ERROR"
            - name: NEURON_CC_LOG_LEVEL
              value: "ERROR"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: GITHUB_TOKEN
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        - name: 621547421844-ap-southeast-4-pvc
          persistentVolumeClaim:
            claimName: 621547421844-ap-southeast-4-pvc
