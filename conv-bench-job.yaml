apiVersion: batch/v1
kind: Job
metadata:
  name: univr-conv-bench
  namespace: default
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: univr-conv-bench
    spec:
      restartPolicy: Never
      nodeSelector:
        node-type: trn3-dev1
        # Pinned: the S3 add-on backing the /var/mdl PVC only runs on this node. Elsewhere the
        # pod sits Pending on "MountVolume.SetUp failed ... DeadlineExceeded".
        kubernetes.io/hostname: ip-192-168-192-189.us-east-2.compute.internal
      resourceClaims:
        - name: neurons
          resourceClaimTemplateName: s-lnc1
      containers:
        - name: repro
          image: 421672808698.dkr.ecr.us-east-1.amazonaws.com/concourse-release-0461d3b:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - "-exc"
            - |
              set -euo pipefail

              cd /tmp
              git clone -b main https://yahavb:${GITHUB_TOKEN}@github.com/yahavb/pave_univr_trn2_repro.git REPRO
              cd REPRO

              echo "┌── PROVENANCE ──"
              echo "│ commit : $(git rev-parse HEAD)"
              echo "│ subject: $(git log -1 --pretty=%s)"
              echo "└────────────────"
              echo "neuronx-cc: $(neuronx-cc --version 2>&1 | head -1 || true)"
              echo ""

              # One script, warp_op_bench.py, covers both halves of the model: the 14 resamples and
              # the 54 convs. Every conv is scored against the same module on CPU, which the old
              # standalone conv bench never did.
              #
              # TILE defaults to 576,640 -- the largest padded shape of 4x8 halo 64, the only
              # geometry whose whole forward compiles fused. Every earlier number used 992x1280,
              # the 2x4 halo-128 tile the fused path does not use.
              #
              # NEURON_CC_FLAGS must not carry --model-type unet-inference: it is the sole cause of
              # the NCC_EBIR033 DMA rejection.

              OUT=/tmp/univr_cb_out; mkdir -p "$OUT"
              POUT="$OUT/perneff"; mkdir -p "$POUT"
              TILE="${TILE:-576,640}"

              echo "=== INVENTORY at tile $TILE ==="
              python3 warp_op_bench.py --op x --list-convs --shape "$TILE" 2>&1 | tee "$OUT/0_inventory.txt"
              echo ""

              # One op per invocation, each in its own process, so the new NEFF is unambiguous and
              # the profile belongs to exactly that conv. Same before/after cache diff the warp
              # sweep uses.
              # Field 6 must be an integer stride and field 7 a numeric MMAC. Matching on the SHAPE
              # of the row rather than on keywords keeps the trailing prose in --list out: a line
              # like "that is where the unexplained 4.2x ... lives" otherwise parses as an op named
              # "that", which is how a 55th op appeared in a 54-op inventory.
              OPS=$(python3 warp_op_bench.py --op x --list-convs --shape "$TILE" \
                    | awk '$6 ~ /^-?[0-9]+$/ && $7 ~ /^[0-9.]+$/ {print $1"|"$7}' || true)
              N=$(echo "$OPS" | grep -c . || echo 0)
              echo "=== PROFILING $N conv ops, one NEFF each ==="

              echo "$OPS" | while IFS='|' read -r OP MMAC; do
                [ -z "$OP" ] && continue
                MACS=$(python3 -c "print(int(float('$MMAC')*1e6))")
                echo "---- $OP  ($MMAC MMAC) ----"
                BEFORE=$(find /tmp/neff_cache -name '*.neff' 2>/dev/null | sort || true)
                set +e
                python -u warp_op_bench.py --op "$OP" --shape "$TILE" --device neuron \
                    --dtype fp32 2>&1 | tee "$OUT/$OP.log"
                rc=${PIPESTATUS[0]}
                set -e
                if [ "$rc" != "0" ]; then
                  echo "  RUN FAILED rc=$rc"; tail -12 "$OUT/$OP.log" | sed 's/^/    /'; continue
                fi
                for i in $(seq 1 30); do pgrep -f warp_op_bench.py >/dev/null || break; sleep 2; done
                sleep 5
                AFTER=$(find /tmp/neff_cache -name '*.neff' 2>/dev/null | sort || true)
                NEW=$(comm -13 <(echo "$BEFORE") <(echo "$AFTER") || true)
                BIG=$(for f in $NEW; do [ -f "$f" ] && stat -c '%s %n' "$f"; done \
                      | sort -rn | head -1 | cut -d' ' -f2 || true)
                if [ -z "$BIG" ]; then echo "  no new NEFF (cache hit)"; continue; fi
                hash=$(basename "$BIG" .neff)
                ntff="$POUT/$hash.ntff"; json="$POUT/$hash.json"
                timeout 3600 neuron-profile capture --single-io -n "$BIG" -s "$ntff" \
                    >"$POUT/$hash.cap.log" 2>&1 || true
                [ -s "$ntff" ] || { echo "  CAPTURE FAILED"; tail -5 "$POUT/$hash.cap.log" | sed 's/^/    /'; continue; }
                timeout 900 neuron-profile view -n "$BIG" -s "$ntff" \
                    --output-format summary-json > "$json" 2>/dev/null || true
                [ -s "$json" ] || { echo "  VIEW FAILED"; continue; }
                # arg3 is "expected pixels" in the warp bench; here it carries MACs so the roofline
                # prints a per-MAC figure. arg4 unused for convs.
                python3 profile_roofline.py "$json" "$OP" "$MACS" 0 \
                    2>&1 | tee "$OUT/roofline_$OP.txt" | grep -E \
                    "total_active_time|tensor_engine|vector_engine|gpsimd_engine|mfu_max|static_dma" \
                    | sed 's/^/    /'
                rm -f "$ntff"     # NTFFs are hundreds of MB; the JSON carries the numbers
              done
              echo ""

              echo "################ CONV COST TABLE (tile $TILE)"
              printf "  %-16s %10s %10s %9s %9s %9s %8s\n" \
                op active_us MMAC tensor% vector% gpsimd% mfu%
              TOTUS=0
              for f in "$OUT"/roofline_*.txt; do
                [ -f "$f" ] || continue
                OP=$(basename "$f" .txt); OP=${OP#roofline_}
                US=$(grep -oE "total_active_time +[0-9.]+" "$f" | awk '{print $2*1000000}' || true)
                TE=$(grep -oE "tensor_engine +[0-9.]+ +[0-9.]+" "$f" | awk '{print $3}' || true)
                VE=$(grep -oE "vector_engine +[0-9.]+ +[0-9.]+" "$f" | awk '{print $3}' || true)
                GE=$(grep -oE "gpsimd_engine +[0-9.]+ +[0-9.]+" "$f" | awk '{print $3}' || true)
                MF=$(grep -oE "mfu_max_achievable +[0-9.]+" "$f" | awk '{print $2}' || true)
                MM=$(grep -aoE "^MMAC +[0-9.]+" "$OUT/$OP.log" | awk '{print $2}' || true)
                printf "  %-16s %10s %10s %9s %9s %9s %8s\n" \
                  "$OP" "${US:--}" "${MM:--}" "${TE:--}" "${VE:--}" "${GE:--}" "${MF:--}"
              done
              echo ""
              echo "  Sum the active_us column and compare against these two figures:"
              echo "    the 14 warps at this tile   ~307,000 us per forward (measured)"
              echo "    the measured frame wall     4,125 ms for 8 tiles on 8 cores"
              echo "  If convs + warps still fall far short of the wall, the remainder is dispatch"
              echo "  and idle, which is what ~/pave-unrolling/RESULTS.md claimed at 95%. If convs"
              echo "  are large, the 62.1%% resample share in the README is wrong and the kernel work"
              echo "  in this repo was aimed at the smaller half of the problem."
              echo ""

              ARCHIVE=/tmp/univr_cb_$(date -u +%Y%m%d_%H%M%S).tar.gz
              tar -czf "$ARCHIVE" -C /tmp univr_cb_out
              mkdir -p /var/mdl/univr_neuron
              cp "$ARCHIVE" /var/mdl/univr_neuron/
              echo "Saved: /var/mdl/univr_neuron/$(basename "$ARCHIVE") ($(du -h "$ARCHIVE" | cut -f1))"
              echo "Done."
          resources:
            claims:
              - name: neurons
            requests:
              cpu: 48
              memory: 248Gi
            limits:
              cpu: 150
              memory: 1000Gi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: 621547421844-ap-southeast-4-pvc
              mountPath: /var/mdl
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: NEURON_LOGICAL_NC_CONFIG
              value: "1"
            - name: NEURON_RT_NUM_CORES
              value: "8"
            - name: NEURON_RT_VISIBLE_CORES
              value: "0-7"
            - name: NEURON_CC_FLAGS
              value: "--lnc 1"
            - name: TORCH_NEURONX_NEFF_CACHE_DIR
              value: "/tmp/neff_cache"
            - name: OMP_NUM_THREADS
              value: "8"
            - name: NEURON_RT_LOG_LEVEL
              value: "ERROR"
            - name: NEURON_CC_LOG_LEVEL
              value: "ERROR"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: GITHUB_TOKEN
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        - name: 621547421844-ap-southeast-4-pvc
          persistentVolumeClaim:
            claimName: 621547421844-ap-southeast-4-pvc
