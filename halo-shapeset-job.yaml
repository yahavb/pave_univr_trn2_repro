apiVersion: batch/v1
kind: Job
metadata:
  name: univr-halo-shapeset
  namespace: default
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: univr-halo-shapeset
    spec:
      restartPolicy: Never
      nodeSelector:
        node-type: trn3-dev1
      resourceClaims:
        - name: neurons
          resourceClaimTemplateName: s-lnc1
      containers:
        - name: repro
          image: 421672808698.dkr.ecr.us-east-1.amazonaws.com/concourse-release-0461d3b:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - "-exc"
            - |
              set -euo pipefail

              cd /tmp
              git clone -b main https://yahavb:${GITHUB_TOKEN}@github.com/yahavb/pave_univr_trn2_repro.git REPRO
              cd REPRO

              echo "┌── PROVENANCE ──"
              echo "│ commit : $(git rev-parse HEAD)"
              echo "│ subject: $(git log -1 --pretty=%s)"
              echo "└────────────────"
              echo "neuronx-cc: $(neuronx-cc --version 2>&1 | head -1 || true)"
              echo "NEURON_CC_FLAGS: ${NEURON_CC_FLAGS:-<unset>}"
              echo ""

              # ============================================================================
              # FIND A HALO WHOSE ENTIRE SHAPE SET FUSES
              # ============================================================================
              # A frame is 32 tiles at 4x8, and border tiles get their halo clipped, so the grid
              # produces FOUR distinct padded shapes. Every shape is a separate graph the compiler
              # must accept. Three of four is worth nothing: tiles of the rejected shape have no
              # graph, their pixels are never written, and the run dies (observed: rc=139).
              #
              # 4x8 halo 64, measured:
              #     512x576  tile 0  REJECTED   NCC_EBIR033 in=23040
              #     512x640  tile 1  FUSES
              #     576x576  tile 8  FUSES
              #     576x640  tile 9  FUSES
              #
              # The rejection is odd, which is what makes this worth another run rather than a
              # dead end. in=23040 is 180*128, matching out=128 exactly. It is NOT the px*14 wall
              # that rejects the large tiles -- 512x576x14 would be 4,128,768. It is on a different
              # failing instruction (I-18501 / I-21046, not the I-21405/21406 family). And it is the
              # SMALLEST of the four shapes. So this is not a size limit; it looks like a compiler
              # edge case tied to that specific shape.
              #
              # If so, the fix is to not produce that shape. Halo determines which shapes exist, so
              # a different halo gives a different shape set. Enumerated from the real planner --
              # halos 64, 56, 40 and 32 all contain 512x576 and are excluded. These two do not:
              #
              #   halo 48 -> 480x576, 480x608, 544x576, 544x608   max 330,752 px   1.02x total px
              #   halo 72 -> 512x608, 512x672, 576x608, 576x672   max 387,072 px   1.18x total px
              #
              # halo 48 is the strongest on cost: every shape is SMALLER than the three that
              # already fused, and total pixel work is 1.02x the 2x4 halo-128 baseline, so fusion
              # would be nearly free on the work side.
              # halo 72 is the safer bet on correctness and on shape similarity: it keeps the 512
              # and 576 heights that are known to fuse and changes only the widths, and 72 px of
              # halo carries more context margin than 48.
              #
              # HONEST CAVEAT: 512x576 rejecting at only 294,912 px proves small size is no
              # guarantee, so these are candidates and not predictions. If both halos still reject
              # one shape, the shape-avoidance theory is wrong and the next move is diagnosing
              # in=23040 rather than sweeping more halos.
              #
              # Compile-only, one representative tile per shape, both warps. Tile indices 0/1/8/9
              # cover all four shapes at BOTH halos -- verified against the planner. gather and
              # nki-dyn because every fusion verdict so far used gather while production runs nki,
              # and a different resample is a different graph, so success does not transfer for free.

              OUT=/tmp/univr_hs_out; mkdir -p "$OUT"
              FRAMES="--rs0 rs70.png --rs1 rs71.png --rs2 rs72.png"
              REF="--gt ref_cuda_fp32_1728x4096.npy --weights pre_net_flow.pth"

              HALOS="${HALOS:-48 72}"
              WARPS="${WARPS:-gather nki-dyn}"
              echo "halos: $HALOS   warps: $WARPS   tiles: 0 1 8 9 (one per distinct shape)"
              echo ""

              for HL in $HALOS; do
                for WP in $WARPS; do
                  ALL=1
                  for T in 0 1 8 9; do
                    TAG="h${HL}_${WP}_t${T}"
                    echo "---- 4x8 halo $HL warp $WP tile $T ----"
                    rm -rf /tmp/neff_cache; mkdir -p /tmp/neff_cache
                    set +e
                    NEURON_LAUNCH_BLOCKING=1 python -u repro_unrolling_trn2.py \
                        $FRAMES $REF \
                        --height 1728 --width 4096 --tiles 4x8 --halo "$HL" --bar 3 \
                        --device neuron --cores 1 --only-tile "$T" \
                        --warp "$WP" --dtype fp32 --compile whole --iters 0 \
                        2>&1 | tee "$OUT/${TAG}.log"
                    rc=${PIPESTATUS[0]}
                    set -e
                    echo "$rc" > "$OUT/rc_${TAG}.txt"
                    SH=$(grep -aoE "padded [0-9]+x[0-9]+" "$OUT/${TAG}.log" | head -1 | awk '{print $2}' || true)
                    echo "$SH" > "$OUT/sh_${TAG}.txt"
                    if [ "$rc" = "0" ]; then
                      echo "  FUSES  ($SH)"
                    else
                      ALL=0
                      echo "  REJECTED  ($SH)"
                      grep -aoE "got in=[0-9]+ and out=[0-9]+|Instructions generated by compiler [0-9]+ exceeds the typical limit of [0-9]+|\(DMACopy: I-[0-9]+-[0-9]+_VN_[0-9]+\)" \
                        "$OUT/${TAG}.log" | head -3 | sed 's/^/    /'
                    fi
                    for i in $(seq 1 40); do pgrep -f repro_unrolling_trn2.py >/dev/null || break; sleep 2; done
                    sleep 5
                  done
                  echo "$ALL" > "$OUT/all_h${HL}_${WP}.txt"
                  echo "  ==> halo $HL / $WP : COMPLETE SHAPE SET FUSES = $ALL"
                  echo ""
                done
              done

              echo "################ SHAPE-SET RESULT"
              printf "  %-22s %-10s %11s %5s %s\n" arm padded dma_in rc verdict
              for f in "$OUT"/h*_t*.log; do
                [ -f "$f" ] || continue
                TAG=$(basename "$f" .log)
                rc=$(cat "$OUT/rc_${TAG}.txt" 2>/dev/null || echo '?')
                SH=$(cat "$OUT/sh_${TAG}.txt" 2>/dev/null || echo '-')
                IN=$(grep -aoE "got in=[0-9]+" "$f" | head -1 | cut -d= -f2 || true)
                V=$([ "$rc" = "0" ] && echo FUSES || echo REJECTED)
                printf "  %-22s %-10s %11s %5s %s\n" "$TAG" "${SH:--}" "${IN:--}" "$rc" "$V"
              done
              echo ""
              echo "  COMPLETE SHAPE SETS (1 = every shape fused, and only this matters):"
              for f in "$OUT"/all_*.txt; do
                [ -f "$f" ] || continue
                B=$(basename "$f" .txt); B=${B#all_}
                echo "    $B = $(cat "$f")"
              done
              echo ""
              echo "  HOW TO READ IT:"
              echo "  * any arm with COMPLETE = 1 -> the FIRST fusable frame configuration. Time it"
              echo "    against eager 2x4 halo 128 next, with accuracy scored, and prefer the nki-dyn"
              echo "    arm since that is the production resample path."
              echo "  * both halos still reject a shape -> shape-avoidance is the wrong theory. Stop"
              echo "    sweeping halos and diagnose in=23040 (180*128) directly; it is not the px*14"
              echo "    wall and not size-driven, so it is a compiler edge case that needs naming."
              echo "  * gather fuses but nki-dyn rejects -> fusion is unavailable on the production"
              echo "    resample path, which would matter more than any halo result here."
              echo ""
              echo "  reference points: known-FUSING shapes 512x640, 576x576, 576x640 (up to 368,640"
              echo "  px). Known-REJECTING 512x576 (in=23040) and 704x768 (in=7,569,408)."
              echo ""

              ARCHIVE=/tmp/univr_hs_$(date -u +%Y%m%d_%H%M%S).tar.gz
              tar -czf "$ARCHIVE" -C /tmp univr_hs_out
              mkdir -p /var/mdl/univr_neuron
              cp "$ARCHIVE" /var/mdl/univr_neuron/
              echo "Saved: /var/mdl/univr_neuron/$(basename "$ARCHIVE") ($(du -h "$ARCHIVE" | cut -f1))"
              echo "Done."
          resources:
            claims:
              - name: neurons
            requests:
              cpu: 48
              memory: 248Gi
            limits:
              cpu: 150
              memory: 1500Gi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: 621547421844-ap-southeast-4-pvc
              mountPath: /var/mdl
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: NEURON_LOGICAL_NC_CONFIG
              value: "1"
            - name: NEURON_RT_NUM_CORES
              value: "8"
            - name: NEURON_RT_VISIBLE_CORES
              value: "0-7"
            # No --target (node is trn3), no -O1 (causes the in=4 / I-3276 rejection), no -O3
            # (measured to change the instruction count by exactly zero on 2x8 and 2x12).
            - name: NEURON_CC_FLAGS
              value: "--lnc 1 --model-type unet-inference"
            - name: TORCH_NEURONX_NEFF_CACHE_DIR
              value: "/tmp/neff_cache"
            - name: OMP_NUM_THREADS
              value: "8"
            - name: NEURON_RT_LOG_LEVEL
              value: "ERROR"
            - name: NEURON_CC_LOG_LEVEL
              value: "ERROR"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: GITHUB_TOKEN
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        - name: 621547421844-ap-southeast-4-pvc
          persistentVolumeClaim:
            claimName: 621547421844-ap-southeast-4-pvc
