# The model's op SEQUENCE for one tile, compiled and timed, once per resample implementation.
#
# This is the experiment that assesses the NKI kernel. microbench.py answered the per-op question
# (gather 1.006 desc/px at 40.40 ns, gridsample 3.004 at 39.81 -- descriptor-bound, gather already
# AT the 1/px floor the profiler prints). What it cannot answer is what swapping the resample does
# to the MODEL, because an isolated op has no pipelining, no layout reuse, and no overlap with the
# convs around it -- and because the NKL kernel needs NHWC while the model is NCHW, so it adds two
# permutes per call that no per-op arm measures.
#
# So: real sequence, real tile shape, one compiled graph, median over iters, per warp. Plus an
# equivalence check between warps, which is a real correctness signal even with random weights.
apiVersion: batch/v1
kind: Job
metadata:
  name: univr-distill
  namespace: default
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: univr-distill
    spec:
      restartPolicy: Never
      nodeSelector:
        node-type: trn3-dev1
      resourceClaims:
        - name: neurons
          resourceClaimTemplateName: s-lnc1
      containers:
        - name: distill
          image: 421672808698.dkr.ecr.us-east-1.amazonaws.com/concourse-release-0461d3b:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - "-ec"
            - |
              set -euo pipefail

              cd /tmp
              git clone -b "${BRANCH:-main}" https://yahavb:${GITHUB_TOKEN}@github.com/yahavb/pave_univr_trn2_repro.git REPRO
              cd REPRO
              echo "┌── PROVENANCE ──"
              echo "│ branch : $(git rev-parse --abbrev-ref HEAD)"
              echo "│ commit : $(git rev-parse HEAD)"
              echo "│ subject: $(git log -1 --pretty=%s)"
              echo "│ cc     : $(neuronx-cc --version 2>&1 | head -1 || true)"
              echo "│ ccflags: ${NEURON_CC_FLAGS:-<unset>}"
              echo "└────────────────"

              OUT=/tmp/distill; mkdir -p "$OUT"
              GRID="${GRID:-4x8}"; HALO="${HALO:-128}"; TILE="${TILE:-9}"
              ITERS="${ITERS:-5}"; FULLGRAPH="${FULLGRAPH:-1}"
              export TORCH_NEURONX_NEFF_CACHE_DIR=/tmp/neff_cache
              mkdir -p /tmp/neff_cache

              PVC=/var/mdl/univr
              CACHE_TGZ="$PVC/neff_cache_distill_${GRID}_h${HALO}_t${TILE}.tar.gz"
              mkdir -p "$PVC" || true

              # Single tar object off the S3-FUSE mount, extracted LOCALLY. Never traverse the
              # mount file-by-file: each open is a separate S3 GET and a directory copy stalls for
              # minutes to hours with no error.
              publish() {
                local src="$1" dst="$2"
                [ -f "$src" ] || { echo "  publish SKIP (absent): $(basename "$src")"; return 0; }
                local n; n=$(wc -c < "$src")
                [ "$n" -gt 0 ] || { echo "  publish REFUSED (0 bytes)"; return 0; }
                cp "$src" "$dst" || { echo "  publish FAILED"; return 0; }
                echo "  published $(basename "$dst") $(( n / 1048576 )) MB"
              }
              archive_cache() {
                local n; n=$(find /tmp/neff_cache -name '*.neff' 2>/dev/null | wc -l)
                [ "$n" -gt 0 ] || return 0
                tar -czf /tmp/nc.tar.gz -C /tmp neff_cache 2>/dev/null || return 0
                publish /tmp/nc.tar.gz "$CACHE_TGZ"
                echo "  cache archived: $n NEFFs"
              }
              # trap, not a trailing block: under set -euo pipefail any earlier failure would skip
              # a final archive and throw away every compile the run paid for.
              finalize() {
                echo ""
                echo "=== FINALIZE (trap EXIT) ==="
                archive_cache
                tar -czf /tmp/distill_results.tar.gz -C /tmp distill 2>/dev/null || true
                publish /tmp/distill_results.tar.gz "$PVC/distill_${GRID}_h${HALO}_t${TILE}.tar.gz"
              }
              trap finalize EXIT

              echo "┌────────────── NEFF CACHE ──────────────"
              if [ -f "$CACHE_TGZ" ]; then
                cp "$CACHE_TGZ" /tmp/r.tar.gz && tar -xzf /tmp/r.tar.gz -C /tmp || echo "│ restore failed"
                echo "│ from $CACHE_TGZ ($(du -h "$CACHE_TGZ" | cut -f1))"
              else
                echo "│ none -- cold compile expected (~73 min at 704x768 in the model run)"
              fi
              echo "│ loaded $(find /tmp/neff_cache -name '*.neff' | wc -l) NEFFs"
              echo "└─────────────────────────────────────────"

              # nkilib preflight: restore from ONE tar object, TEST the import, let the answer
              # decide. The kernel is unmerged (CR-288764575 OPEN at rev 3) so it is in no image.
              NKILIB_TGZ="${NKILIB_TGZ:-/var/mdl/univr/nkilib.tar.gz}"
              if [ -f "$NKILIB_TGZ" ]; then
                cp "$NKILIB_TGZ" /tmp/nkilib.tar.gz && mkdir -p /tmp/nkilib \
                  && tar -xzf /tmp/nkilib.tar.gz -C /tmp/nkilib \
                  && export PYTHONPATH="/tmp/nkilib:${PYTHONPATH:-}" \
                  && echo "nkilib: restored from $NKILIB_TGZ"
              fi
              if python3 -c "import nkilib.experimental.indirect.grid_sample" 2>/dev/null; then
                echo "nkilib: IMPORT OK -> gridsample-nkl included"
                WARPS="${WARPS:-gather gridsample-nkl}"
              else
                echo "nkilib: IMPORT FAILS -> gridsample-nkl EXCLUDED. Upload a tar containing"
                echo "  nkilib/experimental/indirect/grid_sample.py to $NKILIB_TGZ."
                echo "  A tar built from a branch WITHOUT the CR will import fine and still lack"
                echo "  the kernel -- that is exactly what happened once; check with:"
                echo "    tar -tzf <tar> | grep grid_sample"
                WARPS="${WARPS:-gather}"
              fi
              echo ""

              echo "=== THE SEQUENCE UNDER TEST ==="
              python3 distill_tile.py --grid "$GRID" --halo "$HALO" --tile "$TILE" --print-ops
              echo ""

              # gather runs FIRST and saves its output; every later warp is compared against it.
              # gather is the implementation the model actually uses today, so it is the baseline
              # both for latency and for equivalence.
              REF=/tmp/ref_gather.npy
              for W in $WARPS; do
                echo "================================================================"
                echo "=== warp $W   $GRID halo $HALO tile $TILE   iters $ITERS"
                echo "================================================================"
                EXTRA=""
                if [ "$W" = "gather" ]; then EXTRA="--save-out $REF"
                elif [ -f "$REF" ]; then EXTRA="--cmp $REF"; fi
                B=$(find /tmp/neff_cache -name '*.neff' | wc -l)
                set +e
                python -u distill_tile.py \
                    --grid "$GRID" --halo "$HALO" --tile "$TILE" \
                    --warp "$W" --iters "$ITERS" --fullgraph "$FULLGRAPH" \
                    ${NKL_MAX_INDICES:+--nkl-max-indices $NKL_MAX_INDICES} \
                    $EXTRA 2>&1 | tee "$OUT/$W.log"
                rc=${PIPESTATUS[0]}
                set -e
                A=$(find /tmp/neff_cache -name '*.neff' | wc -l)
                echo "$rc" > "$OUT/rc_$W.txt"
                echo "  rc=$rc   NEFFs +$((A-B))"
                if [ "$rc" != "0" ]; then
                  { grep -aoE "got in=[0-9]+ and out=[0-9]+|kernel_assert|Unsupported|MemoryError|Killed|Error" \
                    "$OUT/$W.log" || true; } | head -3 | sed 's/^/    /'
                fi
                archive_cache
                for i in $(seq 1 60); do pgrep -f distill_tile.py >/dev/null || break; sleep 2; done
                sleep 5
              done

              echo ""
              echo "################ DISTILLED SEQUENCE: WARP A/B"
              printf "  %-16s %5s %12s %12s %12s %s\n" warp rc tile_ms frame_8core equiv_LSB verdict
              for W in $WARPS; do
                f="$OUT/$W.log"; [ -f "$f" ] || continue
                rc=$(cat "$OUT/rc_$W.txt" 2>/dev/null || echo '?')
                MS=$(grep -aoE "TILE MEDIAN +[0-9.]+ ms" "$f" | head -1 | awk '{print $3}' || true)
                FR=$(grep -aoE "[0-9.]+ ms across 8 cores" "$f" | head -1 | awk '{print $1}' || true)
                EQ=$(grep -aoE "max_diff +[0-9.]+ LSB" "$f" | head -1 | awk '{print $2}' || true)
                VD=$(grep -aoE "\[(AGREE|DISAGREE)\]" "$f" | head -1 | tr -d '[]' || true)
                printf "  %-16s %5s %12s %12s %12s %s\n" "$W" "$rc" "${MS:--}" "${FR:--}" "${EQ:--}" "${VD:-baseline}"
              done
              echo ""
              echo "  HOW TO READ IT:"
              echo "  * tile_ms is the ONLY comparable latency number here. Per-op single-io"
              echo "    microseconds are noise across runs; this is a warm median of the sequence."
              echo "  * frame_8core is a LOWER bound: it assumes equal cost per tile of this shape"
              echo "    and perfect 8-way overlap. Do not quote it as a frame latency."
              echo "  * equiv_LSB compares warps at the SAME seed, so it isolates the resample."
              echo "    It is NOT accuracy vs the golden -- random weights make that meaningless."
              echo "  * The bar for the NKI kernel is GATHER, not ATen gridsample. gather already"
              echo "    sits at the 1 descriptor/px floor at 40.40 ns, so the kernel only wins by"
              echo "    beating ns/descriptor, i.e. by leaving the software DGE path."
              echo "  * Whole resample is ~510 ms of the 3900 ms frame (~13%), so that is the"
              echo "    ceiling on any resample change even if it became free."
              echo "Done."
          resources:
            claims:
              - name: neurons
            requests:
              cpu: 48
              memory: 248Gi
            limits:
              cpu: 150
              memory: 1800Gi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: 621547421844-ap-southeast-4-pvc
              mountPath: /var/mdl
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: NEURON_RT_NUM_CORES
              value: "1"
            - name: NEURON_RT_VISIBLE_CORES
              value: "0"
            - name: NEURON_LOGICAL_NC_CONFIG
              value: "1"
            # MUST NOT contain --model-type unet-inference: it is the single cause of the
            # NCC_EBIR033 DMA rejection -- 8 arms on one shape, every arm with it rejected at the
            # identical in=23,040 and every arm without it fused.
            - name: NEURON_CC_FLAGS
              value: "--lnc 1"
            - name: XLA_IR_DEBUG
              value: "1"
            - name: XLA_HLO_DEBUG
              value: "1"
            - name: NEURON_FRAMEWORK_DEBUG
              value: "1"
            - name: TORCH_NEURONX_NEFF_CACHE_DIR
              value: "/tmp/neff_cache"
            - name: NEURON_RT_LOG_LEVEL
              value: "ERROR"
            - name: NEURON_CC_LOG_LEVEL
              value: "ERROR"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: GITHUB_TOKEN
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        - name: 621547421844-ap-southeast-4-pvc
          persistentVolumeClaim:
            claimName: 621547421844-ap-southeast-4-pvc
