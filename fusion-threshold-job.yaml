apiVersion: batch/v1
kind: Job
metadata:
  name: univr-fusion-threshold
  namespace: default
spec:
  template:
    metadata:
      labels:
        app: univr-fusion-threshold
    spec:
      restartPolicy: Never
      nodeSelector:
        node-type: trn3-dev1
      resourceClaims:
        - name: neurons
          resourceClaimTemplateName: s-lnc1
      containers:
        - name: repro
          #image: 621547421844.dkr.ecr.us-west-2.amazonaws.com/native-pytorch:2.11.0-neuronx-py312-sdk2.31.0-ubuntu24.04-neurondlcbuilder-development-6486001458-0
          image: 421672808698.dkr.ecr.us-east-1.amazonaws.com/concourse-release-0461d3b:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - "-exc"
            - |
              set -euo pipefail

              cd /tmp
              git clone -b main https://yahavb:${GITHUB_TOKEN}@github.com/yahavb/pave_univr_trn2_repro.git REPRO
              cd REPRO

              echo "┌── PROVENANCE ──"
              echo "│ commit : $(git rev-parse HEAD)"
              echo "│ subject: $(git log -1 --pretty=%s)"
              echo "└────────────────"
              echo "neuronx-cc: $(neuronx-cc --version 2>&1 | head -1 || true)"
              echo ""

              # GOAL: the LARGEST tile whose whole forward compiles as ONE graph.
              #
              # Whole-graph fullgraph=True is rejected by the backend with
              #   [NCC_EBIR033] ... in=17776640 out=128
              # and 17,776,640 = 1,269,760 px (992x1280) x 14 resamples per forward. Retested on
              # this exact image (neuronx-cc 2.26.6360.0, same version the original doc recorded):
              # identical operands, identical failing instruction I-21406-0_VN_0. The limit is real
              # and deterministic, and no newer compiler is available.
              #
              # But STATE.md records single-graph WORKING at 512x768 = 393,216 px = 5,505,024.
              # So the threshold lies in (5.5M .. 17.7M] and the failing operand scales with
              # px x 14. Every legal geometry maps onto that axis:
              #
              #   grid  padded      px x 14      total px vs 2x4   status
              #   2x4   992x1280    17,776,640   1.00x             FAILS (measured)
              #   3x4   704x1280    12,615,680   1.06x             unknown
              #   2x8   992x768     10,665,984   1.20x             unknown
              #   4x4   576x1280    10,321,920   1.16x             unknown
              #   4x8   576x768      6,193,152   1.39x             unknown
              #   6x8   416x768      4,472,832   1.51x             WORKS (below 5.5M)
              #
              # WHY IT MATTERS: a tile that fuses gives ~4 NEFFs instead of the 275 an eager run
              # caches, which is the dispatch overhead ~/pave-unrolling/RESULTS.md identified as
              # dominant ("95% dispatch-idle ... the real lever is batching the dispatches").
              # The cost is halo re-read: smaller tiles do MORE total pixel work, and measured
              # gather cost is flat at ~38.8 ns/px across a 10x tile range, so that cost is real.
              # 3x4 is the standout -- only 6% more pixel work, largest untested geometry below
              # the failure point.
              #
              # COMPILE ONLY: --iters 0, one tile, one core. No timing here; this establishes
              # WHICH geometries fuse. Timing the winner is a separate run, because a benchmark
              # of a geometry that cannot compile is wasted device time.
              #
              # gather only: needs no NKI toolchain, and the doc established the failure is
              # independent of the resample implementation (gather / gridsample / nki-dyn all
              # produced the identical error and operands).
              #
              # Ordered LARGEST-FIRST so the first PASS is the answer; later arms still run so the
              # full boundary is mapped rather than inferred from one point.

              # RESULTS SO FAR, so this run does not re-spend hours on settled arms.
              # Every previous pod OOM-killed at the 4x4 arm, but two verdicts landed first:
              #   3x4  576x1280  px*14=12,615,680  NCC_EBIR033 in=12615680  -- DMA limit, REJECTED
              #   2x8  992x768   px*14=10,665,984  NCC_EBVF030              -- DIFFERENT limit
              # NCC_EBVF030 is "Instructions generated by compiler 6013317 exceeds the typical
              # limit of 5000000". That is a SECOND, independent wall: 2x8 got PAST the DMA
              # access-pattern limit and hit an instruction-count ceiling instead. Shrinking the
              # tile lowers px*14 but the fused graph still holds the entire forward, so
              # instruction count does not fall with it -- the two limits move in opposite
              # directions and there may be no tile satisfying both.
              #
              # 4x4 (10.3M) and 4x8 (6.2M) are the remaining unknowns and the only ones worth
              # host memory. 4x8 is the decisive one: at 6.2M it is just above the 5.5M
              # known-DMA-working point, so if it ALSO reports NCC_EBVF030 the instruction ceiling
              # is tile-independent and whole-forward fusion is closed for this compiler.
              # Override with ARMS to re-test anything.
              ARMS="${ARMS:-4x8}"
              echo "arms this run: $ARMS"
              echo "NEURON_CC_FLAGS from env: ${NEURON_CC_FLAGS:-<unset>}"

              # FLAG SWEEP on a FIXED geometry, because the last 4x8 run changed TWO things at
              # once (dropped --target trn2, added -O1) and produced a failure unlike any other:
              #
              #   2x4  992x1280  EBIR033  in=17,776,640   I-21406   <- px*14
              #   3x4  576x1280  EBIR033  in=12,615,680   I-21405   <- px*14
              #   2x8  992x768   EBVF030  6,013,317 instr           <- cleared DMA entirely
              #   4x8  576x768   EBIR033  in=4            I-3276    <- fits NOTHING
              #
              # in=4 against out=128, on a different failing instruction, is not the px*14 wall
              # at a smaller size -- it is a distinct defect, and it is uninterpretable while two
              # variables moved together. This sweep pins it: same tile, one flag combination per
              # arm, so the cause is attributable.
              #
              # -O1 is the substantive lever. The 2x8 wall is an instruction COUNT (6,013,317 vs a
              # 5,000,000 cap, a 17% gap) and the origin repo's scripts/neuron/run_unet_optlevel.sh
              # records "the backend runs at --optlevel 2 by default". Optlevel governs unrolling
              # and fusion, hence instruction count and compiler memory. -O3 is included because
              # more aggressive fusion can REDUCE instruction count as easily as inflate it, and
              # that is cheaper to measure than to argue about.
              BASE="--lnc 1 --model-type unet-inference"
              FLAGSETS="${FLAGSETS:-baseline|$BASE
              O1|$BASE -O1
              O3|$BASE -O3
              trn2_O1|--target trn2 $BASE -O1}"

              OUT_ROOT=/tmp/univr_ft_out; mkdir -p "$OUT_ROOT"

              OUT="$OUT_ROOT"
              FRAMES="--rs0 rs70.png --rs1 rs71.png --rs2 rs72.png"
              REF="--gt ref_cuda_fp32_1728x4096.npy --weights pre_net_flow.pth"

              # Each iteration is (geometry x flagset). The NEFF cache is wiped between arms so a
              # cached graph from a previous flagset cannot mask a compile failure in this one --
              # the whole point is which flags compile.
              for G in $ARMS; do
               echo "$FLAGSETS" | while IFS='|' read -r FSNAME FSFLAGS; do
                FSNAME=$(echo "$FSNAME" | xargs); FSFLAGS=$(echo "$FSFLAGS" | xargs)
                [ -z "$FSNAME" ] && continue
                TAG="${G}_${FSNAME}"
                echo "================================================================"
                echo "=== --tiles $G   flags: $FSFLAGS"
                echo "================================================================"
                rm -rf /tmp/neff_cache; mkdir -p /tmp/neff_cache
                set +e
                NEURON_CC_FLAGS="$FSFLAGS" NEURON_LAUNCH_BLOCKING=1 \
                python -u repro_unrolling_trn2.py \
                    $FRAMES $REF \
                    --height 1728 --width 4096 --tiles "$G" --halo 128 --bar 3 \
                    --device neuron --cores 1 --only-tile 1 \
                    --warp gather --dtype fp32 --compile whole --iters 0 \
                    2>&1 | tee "$OUT/whole_${TAG}.log"
                rc=${PIPESTATUS[0]}
                set -e
                echo "$rc" > "$OUT/rc_${TAG}.txt"
                echo "$FSFLAGS" > "$OUT/flags_${TAG}.txt"
                if grep -q "NCC_EBIR033" "$OUT/whole_${TAG}.log"; then
                  echo "  RESULT: REJECTED -- DMA access-pattern limit (NCC_EBIR033)"
                  grep -oE "got in=[0-9]+ and out=[0-9]+" "$OUT/whole_${TAG}.log" | head -1 \
                    | sed 's/^/    /'
                  grep -oE "\(DMACopy: I-[0-9]+-[0-9]+_VN_[0-9]+\)" "$OUT/whole_${TAG}.log" \
                    | head -1 | sed 's/^/    /'
                elif grep -q "NCC_EBVF030" "$OUT/whole_${TAG}.log"; then
                  echo "  RESULT: REJECTED -- instruction-count limit (NCC_EBVF030)"
                  grep -oE "Instructions generated by compiler [0-9]+ exceeds the typical limit of [0-9]+" \
                    "$OUT/whole_${TAG}.log" | head -1 | sed 's/^/    /'
                elif [ "$rc" = "0" ]; then
                  echo "  RESULT: COMPILES AS ONE GRAPH -- this flagset FUSES"
                else
                  echo "  RESULT: failed for a THIRD reason (neither EBIR033 nor EBVF030)"
                  tail -25 "$OUT/whole_${TAG}.log" | sed 's/^/    /'
                fi
                echo ""
                for i in $(seq 1 30); do pgrep -f repro_unrolling_trn2.py >/dev/null || break; sleep 2; done
                sleep 5
               done
              done

              echo "################ FLAG SWEEP RESULT"
              echo "  reference points from earlier runs, all with '--target trn2 --lnc 1' default optlevel:"
              echo "    2x4 992x1280 EBIR033 in=17,776,640 (I-21406)  <- px*14"
              echo "    3x4 576x1280 EBIR033 in=12,615,680 (I-21405)  <- px*14"
              echo "    2x8 992x768  EBVF030 6,013,317 instr vs 5,000,000 cap  <- cleared DMA"
              echo "    4x8 576x768  EBIR033 in=4 (I-3276)            <- fits no pattern"
              echo ""
              printf "  %-16s %-12s %11s %11s %5s %s\n" arm padded dma_in instr rc verdict
              for f in "$OUT"/whole_*.log; do
                [ -f "$f" ] || continue
                TAG=$(basename "$f" .log); TAG=${TAG#whole_}
                rc=$(cat "$OUT/rc_${TAG}.txt" 2>/dev/null || echo '?')
                PAD=$(grep -oE "padded [0-9]+x[0-9]+" "$f" | head -1 | awk '{print $2}' || true)
                IN=$(grep -oE "got in=[0-9]+" "$f" | head -1 | cut -d= -f2 || true)
                NI=$(grep -oE "Instructions generated by compiler [0-9]+" "$f" | head -1 \
                     | awk '{print $5}' || true)
                if grep -q "NCC_EBIR033" "$f"; then V="REJECTED(dma)"
                elif grep -q "NCC_EBVF030" "$f"; then V="REJECTED(instr)"
                elif [ "$rc" = "0" ]; then V=FUSES
                else V=OTHER_FAILURE; fi
                printf "  %-16s %-12s %11s %11s %5s %s\n" \
                  "$TAG" "${PAD:--}" "${IN:--}" "${NI:--}" "$rc" "$V"
              done
              echo ""
              echo "  HOW TO READ IT:"
              echo "  * any row FUSES        -> that flagset is the answer; time it next."
              echo "  * O1/O3 rows show a LOWER instr count than 6,013,317 -> optlevel is a real"
              echo "    lever and a tile between 2x8 and this one may clear the 5,000,000 cap."
              echo "  * baseline reproduces in=4 but trn2_O1 does not (or vice versa) -> the in=4"
              echo "    defect is caused by the FLAG, not by the 4x8 geometry, and 4x8 is still live."
              echo "  * every row REJECTED with instr stuck near 6M -> optlevel does not move the"
              echo "    count, and whole-forward fusion is closed for this compiler at any geometry."
              echo ""

              ARCHIVE=/tmp/univr_ft_$(date -u +%Y%m%d_%H%M%S).tar.gz
              tar -czf "$ARCHIVE" -C /tmp univr_ft_out
              mkdir -p /var/mdl/univr_neuron
              cp "$ARCHIVE" /var/mdl/univr_neuron/
              echo "Saved: /var/mdl/univr_neuron/$(basename "$ARCHIVE") ($(du -h "$ARCHIVE" | cut -f1))"
              echo "Done."
          resources:
            claims:
              - name: neurons
            requests:
              cpu: 48
              memory: 248Gi
            limits:
              cpu: 150
              memory: 1000Gi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: 621547421844-ap-southeast-4-pvc
              mountPath: /var/mdl
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: NEURON_LOGICAL_NC_CONFIG
              value: "1"
            - name: NEURON_RT_NUM_CORES
              value: "8"
            - name: NEURON_RT_VISIBLE_CORES
              value: "0-7"
            # No --target: the node is trn3-dev1, and the previous value was "--target trn2".
            # The origin repo compiles on this same node with just --model-type=unet-inference.
            # -O1 to attack NCC_EBVF030 (6,013,317 instructions vs a 5,000,000 cap); the backend
            # default is optlevel 2. See the rationale block in the script above.
            - name: NEURON_CC_FLAGS
              value: "--lnc 1 --model-type unet-inference -O1"
            - name: TORCH_NEURONX_NEFF_CACHE_DIR
              value: "/tmp/neff_cache"
            - name: OMP_NUM_THREADS
              value: "8"
            - name: NEURON_RT_LOG_LEVEL
              value: "ERROR"
            - name: NEURON_CC_LOG_LEVEL
              value: "ERROR"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: GITHUB_TOKEN
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        - name: 621547421844-ap-southeast-4-pvc
          persistentVolumeClaim:
            claimName: 621547421844-ap-southeast-4-pvc
