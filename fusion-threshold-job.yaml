apiVersion: batch/v1
kind: Job
metadata:
  name: univr-fusion-threshold
  namespace: default
spec:
  template:
    metadata:
      labels:
        app: univr-fusion-threshold
    spec:
      restartPolicy: Never
      nodeSelector:
        node-type: trn3-dev1
      resourceClaims:
        - name: neurons
          resourceClaimTemplateName: s-lnc1
      containers:
        - name: repro
          #image: 621547421844.dkr.ecr.us-west-2.amazonaws.com/native-pytorch:2.11.0-neuronx-py312-sdk2.31.0-ubuntu24.04-neurondlcbuilder-development-6486001458-0
          image: 421672808698.dkr.ecr.us-east-1.amazonaws.com/concourse-release-0461d3b:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - "-exc"
            - |
              set -euo pipefail

              cd /tmp
              git clone -b main https://yahavb:${GITHUB_TOKEN}@github.com/yahavb/pave_univr_trn2_repro.git REPRO
              cd REPRO

              echo "┌── PROVENANCE ──"
              echo "│ commit : $(git rev-parse HEAD)"
              echo "│ subject: $(git log -1 --pretty=%s)"
              echo "└────────────────"
              echo "neuronx-cc: $(neuronx-cc --version 2>&1 | head -1 || true)"
              echo ""

              # GOAL: the LARGEST tile whose whole forward compiles as ONE graph.
              #
              # Whole-graph fullgraph=True is rejected by the backend with
              #   [NCC_EBIR033] ... in=17776640 out=128
              # and 17,776,640 = 1,269,760 px (992x1280) x 14 resamples per forward. Retested on
              # this exact image (neuronx-cc 2.26.6360.0, same version the original doc recorded):
              # identical operands, identical failing instruction I-21406-0_VN_0. The limit is real
              # and deterministic, and no newer compiler is available.
              #
              # But STATE.md records single-graph WORKING at 512x768 = 393,216 px = 5,505,024.
              # So the threshold lies in (5.5M .. 17.7M] and the failing operand scales with
              # px x 14. Every legal geometry maps onto that axis:
              #
              #   grid  padded      px x 14      total px vs 2x4   status
              #   2x4   992x1280    17,776,640   1.00x             FAILS (measured)
              #   3x4   704x1280    12,615,680   1.06x             unknown
              #   2x8   992x768     10,665,984   1.20x             unknown
              #   4x4   576x1280    10,321,920   1.16x             unknown
              #   4x8   576x768      6,193,152   1.39x             unknown
              #   6x8   416x768      4,472,832   1.51x             WORKS (below 5.5M)
              #
              # WHY IT MATTERS: a tile that fuses gives ~4 NEFFs instead of the 275 an eager run
              # caches, which is the dispatch overhead ~/pave-unrolling/RESULTS.md identified as
              # dominant ("95% dispatch-idle ... the real lever is batching the dispatches").
              # The cost is halo re-read: smaller tiles do MORE total pixel work, and measured
              # gather cost is flat at ~38.8 ns/px across a 10x tile range, so that cost is real.
              # 3x4 is the standout -- only 6% more pixel work, largest untested geometry below
              # the failure point.
              #
              # COMPILE ONLY: --iters 0, one tile, one core. No timing here; this establishes
              # WHICH geometries fuse. Timing the winner is a separate run, because a benchmark
              # of a geometry that cannot compile is wasted device time.
              #
              # gather only: needs no NKI toolchain, and the doc established the failure is
              # independent of the resample implementation (gather / gridsample / nki-dyn all
              # produced the identical error and operands).
              #
              # Ordered LARGEST-FIRST so the first PASS is the answer; later arms still run so the
              # full boundary is mapped rather than inferred from one point.

              # RESULTS SO FAR, so this run does not re-spend hours on settled arms.
              # Every previous pod OOM-killed at the 4x4 arm, but two verdicts landed first:
              #   3x4  576x1280  px*14=12,615,680  NCC_EBIR033 in=12615680  -- DMA limit, REJECTED
              #   2x8  992x768   px*14=10,665,984  NCC_EBVF030              -- DIFFERENT limit
              # NCC_EBVF030 is "Instructions generated by compiler 6013317 exceeds the typical
              # limit of 5000000". That is a SECOND, independent wall: 2x8 got PAST the DMA
              # access-pattern limit and hit an instruction-count ceiling instead. Shrinking the
              # tile lowers px*14 but the fused graph still holds the entire forward, so
              # instruction count does not fall with it -- the two limits move in opposite
              # directions and there may be no tile satisfying both.
              #
              # 4x4 (10.3M) and 4x8 (6.2M) are the remaining unknowns and the only ones worth
              # host memory. 4x8 is the decisive one: at 6.2M it is just above the 5.5M
              # known-DMA-working point, so if it ALSO reports NCC_EBVF030 the instruction ceiling
              # is tile-independent and whole-forward fusion is closed for this compiler.
              # Override with ARMS to re-test anything.
              # 4x8 FUSES. The flag sweep settled which flags matter, so this run sweeps
              # GEOMETRY instead, largest tile first -- a larger tile means less halo re-read,
              # less total pixel work, and fewer distinct padded shapes.
              #
              #   arm  padded    tile px   tiles  total px  shapes  earlier result
              #   2x4  992x1280  1,269,760    8    1.00x      2     EBIR033 in=17,776,640
              #   3x4  576x1280    737,280   12    1.06x      4     EBIR033 in=12,615,680
              #   2x8  992x768     761,856   16    1.20x      2     EBVF030 6,013,317 instr
              #   4x8  576x768     442,368   32    1.39x      4     FUSES  <- confirmed
              #
              # Every one of those failures was measured WITH "--target trn2" on a trn3-dev1 node.
              # Dropping --target is what made 4x8 compile, so those results are all suspect and
              # worth one retest each under the flagset that works.
              #
              # 2x8 is the priority: it is a LARGER tile than 4x8 (992x768 vs 576x768), does
              # 1.20x the pixel work instead of 1.39x, and keeps only 2 distinct padded shapes
              # instead of 4 -- so it is strictly better than 4x8 on every axis if it fuses.
              # 3x4 and 2x4 are larger still; 2x4 is the production 8-tile geometry at 1.00x, and
              # fusing that would be the ideal outcome.
              #
              # ============================================================================
              # THIS RUN: can 2x8 be rescued, and is there a geometry better than 4x8?
              # ============================================================================
              # 2x8 missed by 19.8%: 5,988,611 instructions against a 5,000,000 cap. Two
              # measured points give instructions/pixel of the MAX padded shape:
              #     2x8  992x768 = 761,856 px -> 5,988,611 instr = 7.861 instr/px
              #     4x8  576x768 = 442,368 px -> FUSES, so < 5,000,000
              # 7.861 instr/px predicts 4x8's largest shape (704x768) at 4.25M, consistent with
              # fusing. Pixel budget for the cap is therefore ~636,000 px. That is a RANKING
              # model fitted to one point, not a prediction -- the graph also holds fixed
              # conv/U-Net work, so treat the estimates as ordering only.
              #
              # THREE PROBES, in the order requested:
              #
              # (1) -O3 on 2x8. Untested. -O1 is excluded for good reason -- it produced the
              #     in=4 / I-3276 rejection, confirmed because in=4 appeared in BOTH -O1 arms
              #     and NEITHER non-O1 arm including trn2_O1, so -O1 caused it and --target did
              #     not. -O3 fuses more aggressively, which can cut instruction count as easily
              #     as inflate it. If it cuts 20%, 2x8 fuses and is the answer.
              #
              # (2) Geometries between 4x8 and the budget. Padded shapes here are computed with
              #     the script's OWN tiling math (vh=ceil(H/ny), halo 128, TILE_ALIGN 32), not
              #     guessed, and ranked by TOTAL pixel work -- what actually costs time -- rather
              #     than by tile size. Total pixel work relative to the 2x4 production geometry:
              #       3x9  27 tiles  max 832x736  est 4.81M  6 shapes  1.47x
              #       2x12 24 tiles  max 992x640  est 4.99M  3 shapes  1.49x
              #       3x10 30 tiles  max 832x704  est 4.60M  6 shapes  1.55x
              #       4x8  32 tiles  max 704x768  est 4.25M  4 shapes  1.56x  <- current best
              #       2x16 32 tiles  max 992x512  est 3.99M  2 shapes  1.63x
              #     3x9 and 2x12 beat 4x8 on total pixel work. 2x16 keeps only 2 distinct
              #     shapes, the fewest of any candidate, which matters because the NEFF count
              #     scales with distinct SHAPES, not tile count.
              #
              # (3) bf16 on 2x8, LAST and conditional. Halving element size may cut generated
              #     instructions. It fails the quality gate at 23.31 dB per STATE.md, so it is
              #     run here purely as a compile-feasibility probe: if bf16 2x8 fuses and fp32
              #     does not, the limit is size-driven and that is worth knowing even though
              #     bf16 is not shippable at this accuracy.
              #
              # CORRECTION carried forward: earlier comments in this file quoted 4x8 as 1.39x
              # pixel work and 2x8 as 1.20x. Those came from a wrong padded-shape table. Recomputed
              # from the real tiling code, 4x8 is 1.56x. The 4x8 shape list is also
              # 576x640/576x768/704x640/704x768 -- FOUR shapes, and --only-tile 1 compiled only
              # 576x768, so "4x8 FUSES" is established for one shape of four. A full 8-core run
              # must compile all four, the largest being 704x768 at an estimated 4.25M.
              ARMS="${ARMS:-2x8 3x9 2x12 2x16}"
              echo "arms this run: $ARMS"
              echo "NEURON_CC_FLAGS from env: ${NEURON_CC_FLAGS:-<unset>}"

              BASE="--lnc 1 --model-type unet-inference"
              # dtype is per-flagset so probe (3) rides the same loop. Field 3 is the --dtype value.
              FLAGSETS="${FLAGSETS:-baseline|$BASE|fp32
              O3|$BASE -O3|fp32
              bf16|$BASE|bf16}"

              OUT_ROOT=/tmp/univr_ft_out; mkdir -p "$OUT_ROOT"

              OUT="$OUT_ROOT"
              FRAMES="--rs0 rs70.png --rs1 rs71.png --rs2 rs72.png"
              REF="--gt ref_cuda_fp32_1728x4096.npy --weights pre_net_flow.pth"

              # Each iteration is (geometry x flagset). The NEFF cache is wiped between arms so a
              # cached graph from a previous flagset cannot mask a compile failure in this one --
              # the whole point is which flags compile.
              for G in $ARMS; do
               echo "$FLAGSETS" | while IFS='|' read -r FSNAME FSFLAGS FSDTYPE; do
                FSNAME=$(echo "$FSNAME" | xargs); FSFLAGS=$(echo "$FSFLAGS" | xargs)
                FSDTYPE=$(echo "${FSDTYPE:-fp32}" | xargs)
                [ -z "$FSNAME" ] && continue
                # bf16 is probe (3) and only earns device time where fp32 has already failed:
                # its purpose is to show whether the limit is size-driven, which is only a
                # question for a geometry that did not fuse in fp32. Skip it elsewhere.
                if [ "$FSNAME" = "bf16" ] && [ "$G" != "2x8" ]; then
                  echo "  (skip bf16 on $G -- only probed on 2x8, the near-miss)"; continue
                fi
                TAG="${G}_${FSNAME}"
                # --only-tile must hit the LARGEST padded shape, because that is the binding
                # constraint -- instruction count and the DMA operand both scale with tile pixels,
                # so a smaller shape can fuse while the largest still fails. Tile 1 is NOT always
                # the largest: verified against the tiling code (which reproduces every logged
                # shape exactly), tile 1 is largest for 2x8 / 2x12 / 2x16 but tile 10 is largest
                # for 3x9 and tile 9 for 4x8. This is why "4x8 FUSES" is only established for
                # 576x768 -- its largest shape, 704x768, was never compiled.
                case "$G" in
                  3x9)  T=10 ;;
                  4x8)  T=9  ;;
                  *)    T=1  ;;
                esac
                echo "================================================================"
                echo "=== --tiles $G  tile $T (largest shape)  dtype: $FSDTYPE  flags: $FSFLAGS"
                echo "================================================================"
                rm -rf /tmp/neff_cache; mkdir -p /tmp/neff_cache
                set +e
                NEURON_CC_FLAGS="$FSFLAGS" NEURON_LAUNCH_BLOCKING=1 \
                python -u repro_unrolling_trn2.py \
                    $FRAMES $REF \
                    --height 1728 --width 4096 --tiles "$G" --halo 128 --bar 3 \
                    --device neuron --cores 1 --only-tile "$T" \
                    --warp gather --dtype "$FSDTYPE" --compile whole --iters 0 \
                    2>&1 | tee "$OUT/whole_${TAG}.log"
                rc=${PIPESTATUS[0]}
                set -e
                echo "$rc" > "$OUT/rc_${TAG}.txt"
                echo "$FSFLAGS" > "$OUT/flags_${TAG}.txt"
                if grep -q "NCC_EBIR033" "$OUT/whole_${TAG}.log"; then
                  echo "  RESULT: REJECTED -- DMA access-pattern limit (NCC_EBIR033)"
                  grep -oE "got in=[0-9]+ and out=[0-9]+" "$OUT/whole_${TAG}.log" | head -1 \
                    | sed 's/^/    /'
                  grep -oE "\(DMACopy: I-[0-9]+-[0-9]+_VN_[0-9]+\)" "$OUT/whole_${TAG}.log" \
                    | head -1 | sed 's/^/    /'
                elif grep -q "NCC_EBVF030" "$OUT/whole_${TAG}.log"; then
                  echo "  RESULT: REJECTED -- instruction-count limit (NCC_EBVF030)"
                  grep -oE "Instructions generated by compiler [0-9]+ exceeds the typical limit of [0-9]+" \
                    "$OUT/whole_${TAG}.log" | head -1 | sed 's/^/    /'
                elif [ "$rc" = "0" ]; then
                  echo "  RESULT: COMPILES AS ONE GRAPH -- this flagset FUSES"
                else
                  echo "  RESULT: failed for a THIRD reason (neither EBIR033 nor EBVF030)"
                  tail -25 "$OUT/whole_${TAG}.log" | sed 's/^/    /'
                fi
                echo ""
                for i in $(seq 1 30); do pgrep -f repro_unrolling_trn2.py >/dev/null || break; sleep 2; done
                sleep 5
               done
              done

              echo "################ RESULT: can 2x8 be rescued, and is anything better than 4x8?"
              echo "  BASELINE OF RECORD, all fp32 default optlevel:"
              echo "    4x8  max 704x768  1.56x total px  4 shapes -- FUSES (576x768 shape tested)"
              echo "    2x8  max 992x768  1.28x total px  2 shapes -- 5,988,611 instr vs 5,000,000"
              echo "    3x4  704x1280                             -- EBIR033 in=12,615,680"
              echo "    2x4  992x1280     1.00x            2 shapes -- EBIR033 in=17,776,640"
              echo "  Estimates below use 7.861 instr/px fitted to the 2x8 point; ranking only."
              echo ""
              printf "  %-16s %-12s %11s %11s %5s %s\n" arm padded dma_in instr rc verdict
              for f in "$OUT"/whole_*.log; do
                [ -f "$f" ] || continue
                TAG=$(basename "$f" .log); TAG=${TAG#whole_}
                rc=$(cat "$OUT/rc_${TAG}.txt" 2>/dev/null || echo '?')
                PAD=$(grep -oE "padded [0-9]+x[0-9]+" "$f" | head -1 | awk '{print $2}' || true)
                IN=$(grep -oE "got in=[0-9]+" "$f" | head -1 | cut -d= -f2 || true)
                NI=$(grep -oE "Instructions generated by compiler [0-9]+" "$f" | head -1 \
                     | awk '{print $5}' || true)
                if grep -q "NCC_EBIR033" "$f"; then V="REJECTED(dma)"
                elif grep -q "NCC_EBVF030" "$f"; then V="REJECTED(instr)"
                elif [ "$rc" = "0" ]; then V=FUSES
                else V=OTHER_FAILURE; fi
                printf "  %-16s %-12s %11s %11s %5s %s\n" \
                  "$TAG" "${PAD:--}" "${IN:--}" "${NI:--}" "$rc" "$V"
              done
              echo ""
              echo "  HOW TO READ IT: pick the FUSING row with the LOWEST total pixel work, since"
              echo "  that is what costs time. Tile size alone is not the criterion -- 4x8 is 1.56x"
              echo "  and 3x9 is 1.47x despite 3x9 having smaller tiles, because halo re-read"
              echo "  depends on the whole grid. Total px vs the 2x4 production geometry:"
              echo "    3x9 1.47x | 2x12 1.49x | 3x10 1.55x | 4x8 1.56x | 2x16 1.63x | 2x8 1.28x"
              echo ""
              echo "  * 2x8_O3 FUSES     -> best outcome. 1.28x px and only 2 distinct shapes,"
              echo "                        the fewest of any candidate. Adopt -O3 and use 2x8."
              echo "  * 2x8_O3 instr FALLS but still >5M -> optlevel is a real lever; the gap is"
              echo "                        19.8%, so report the number, it decides whether any"
              echo "                        further optlevel or graph-splitting work is worthwhile."
              echo "  * 3x9 or 2x12 FUSES -> beats 4x8 on total pixel work. Use the lower one."
              echo "  * 2x16 FUSES        -> 1.63x px but only 2 shapes, so the fewest NEFFs of any"
              echo "                        fusing option. Worth timing against 4x8 despite more px."
              echo "  * only bf16 FUSES   -> the limit is SIZE-driven, not structural. Not shippable"
              echo "                        at 23.31 dB, but it says a narrower fp32 path could work."
              echo "  * all reject        -> 4x8 stands, and it is the geometry to time."
              echo ""
              echo "  NOTHING HERE IS A LATENCY RESULT. --iters 0 and --only-tile 1: this compiles"
              echo "  one tile on one core and stops. Whether a fused tile actually beats the eager"
              echo "  8-tile run needs a timed 8-core run WITH an accuracy score -- a fused graph"
              echo "  that is fast and wrong is worth nothing."
              echo ""

              ARCHIVE=/tmp/univr_ft_$(date -u +%Y%m%d_%H%M%S).tar.gz
              tar -czf "$ARCHIVE" -C /tmp univr_ft_out
              mkdir -p /var/mdl/univr_neuron
              cp "$ARCHIVE" /var/mdl/univr_neuron/
              echo "Saved: /var/mdl/univr_neuron/$(basename "$ARCHIVE") ($(du -h "$ARCHIVE" | cut -f1))"
              echo "Done."
          resources:
            claims:
              - name: neurons
            requests:
              cpu: 48
              memory: 248Gi
            limits:
              cpu: 150
              memory: 1000Gi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: 621547421844-ap-southeast-4-pvc
              mountPath: /var/mdl
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: NEURON_LOGICAL_NC_CONFIG
              value: "1"
            - name: NEURON_RT_NUM_CORES
              value: "8"
            - name: NEURON_RT_VISIBLE_CORES
              value: "0-7"
            # No --target: the node is trn3-dev1, and the previous value was "--target trn2".
            # The origin repo compiles on this same node with just --model-type=unet-inference.
            # -O1 to attack NCC_EBVF030 (6,013,317 instructions vs a 5,000,000 cap); the backend
            # default is optlevel 2. See the rationale block in the script above.
            - name: NEURON_CC_FLAGS
              value: "--lnc 1 --model-type unet-inference -O1"
            - name: TORCH_NEURONX_NEFF_CACHE_DIR
              value: "/tmp/neff_cache"
            - name: OMP_NUM_THREADS
              value: "8"
            - name: NEURON_RT_LOG_LEVEL
              value: "ERROR"
            - name: NEURON_CC_LOG_LEVEL
              value: "ERROR"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: GITHUB_TOKEN
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        - name: 621547421844-ap-southeast-4-pvc
          persistentVolumeClaim:
            claimName: 621547421844-ap-southeast-4-pvc
