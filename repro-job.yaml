apiVersion: batch/v1
kind: Job
metadata:
  name: univr-trn-repro
  namespace: default
spec:
  template:
    metadata:
      labels:
        app: univr-trn-repro
    spec:
      restartPolicy: Never
      nodeSelector:
        node-type: trn3-dev1
        # Pinned: the S3 add-on backing the /var/mdl PVC only runs on this node. Elsewhere the
        # pod sits Pending on "MountVolume.SetUp failed ... DeadlineExceeded".
        kubernetes.io/hostname: ip-192-168-192-189.us-east-2.compute.internal
      resourceClaims:
        - name: neurons
          resourceClaimTemplateName: s-lnc1
      containers:
        - name: repro
          #image: 421672808698.dkr.ecr.us-east-1.amazonaws.com/concourse-release-0461d3b:latest
          image: 421672808698.dkr.ecr.us-east-1.amazonaws.com/concourse-release-0461d3b:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - "-exc"
            - |
              set -euo pipefail

              cd /tmp
              git clone -b main https://yahavb:${GITHUB_TOKEN}@github.com/yahavb/pave_univr_trn2_repro.git REPRO
              cd REPRO

              echo "┌── PROVENANCE ──"
              echo "│ commit : $(git rev-parse HEAD)"
              echo "│ subject: $(git log -1 --pretty=%s)"
              echo "└────────────────"

              echo "════════════════════ ENVIRONMENT ════════════════════"
              uname -a
              echo "nproc            : $(nproc)"
              echo "neuronx-cc       : $(neuronx-cc --version 2>&1 | tr '\n' ' ' || echo 'NOT ON PATH')"
              python -c 'import sys, torch; print("python           :", sys.version.split()[0]); print("torch            :", torch.__version__)'
              python -c 'import torch_neuronx as t; print("torch-neuronx    :", t.__version__)' 2>&1 || echo "torch-neuronx    : IMPORT FAILED"
              python -c 'import nki; print("nki              :", getattr(nki, "__version__", "import OK"))' 2>&1 || echo "nki              : IMPORT FAILED"
              python -c 'import numpy, PIL; print("numpy / pillow   :", numpy.__version__, "/", PIL.__version__)'
              echo "NEURON_RT_VISIBLE_CORES: '${NEURON_RT_VISIBLE_CORES:-}'"
              echo "═════════════════════════════════════════════════════"
              echo ""

              OUT=/tmp/univr_repro_out; mkdir -p "$OUT"
              FRAMES="--rs0 rs70.png --rs1 rs71.png --rs2 rs72.png"
              REF="--gt ref_cuda_fp32_1728x4096.npy --weights pre_net_flow.pth"
              GEOM="--height 1728 --width 4096 --tiles 2x4 --halo 128 --bar 3"

              for WARP in nki-dyn nki; do
                for T in 0 1; do
                  echo "=== [1/3] SERIAL WARMUP — tile $T, 1 core, warp=$WARP ==="
                  python -u repro_unrolling_trn2.py $FRAMES $REF $GEOM \
                      --device neuron --cores 1 --only-tile $T --warp $WARP --dtype fp32 --iters 1 \
                      2>&1 | tee "$OUT/0_warmup_${WARP}_tile${T}.log" \
                      | grep -iE "padded|first call|steady state|PSNR|max_diff|PASS|FAIL" || true
                  echo "  NEFFs cached: $(find /tmp/neff_cache/ -name '*.neff' 2>/dev/null | wc -l)"
                  echo ""
                done
              done

              echo "=== [2/3] FUNCTIONAL CHECK — 8 tiles / 8 cores, warp=nki-dyn ==="
              python -u repro_unrolling_trn2.py $FRAMES $REF $GEOM \
                  --device neuron --cores 8 --warp nki-dyn --dtype fp32 --iters 1 \
                  2>&1 | tee "$OUT/1_functional_nki_dyn.log"
              echo ""

              echo "=== [3/3] MEASUREMENT — 8 tiles / 8 cores, warp=nki, 3 iters ==="
              echo "    bundle reference: 3673.3 ms median, 98.68 dB, 0.64 LSB PASS"
              echo "    CUDA L40S for the same frame: eager 351.1 ms, inductor 237.9 ms, TRT 161 ms"
              python -u repro_unrolling_trn2.py $FRAMES $REF $GEOM \
                  --device neuron --cores 8 --warp nki --dtype fp32 --iters 3 \
                  2>&1 | tee "$OUT/2_measurement_nki.log"
              echo ""

              echo "=== SUMMARY (grep of both arms) ==="
              grep -hiE "steady state|median|PSNR|max_diff|PASS|FAIL|per-core|sum/wall" \
                  "$OUT"/*.log || echo "  no summary lines matched — read the logs above"
              echo ""

              ARCHIVE=/tmp/univr_repro_$(date -u +%Y%m%d_%H%M%S).tar.gz
              tar -czf "$ARCHIVE" -C /tmp univr_repro_out
              mkdir -p /var/mdl/univr_neuron
              cp "$ARCHIVE" /var/mdl/univr_neuron/
              echo "Saved: /var/mdl/univr_neuron/$(basename "$ARCHIVE") ($(du -h "$ARCHIVE" | cut -f1))"
              echo "Done."
          resources:
            claims:
              - name: neurons
            requests:
              cpu: 48
              memory: 248Gi
            limits:
              cpu: 84
              memory: 248Gi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: 621547421844-ap-southeast-4-pvc
              mountPath: /var/mdl
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: NEURON_LOGICAL_NC_CONFIG
              value: "1"
            - name: NEURON_RT_NUM_CORES
              value: "8"
            - name: NEURON_RT_VISIBLE_CORES
              value: "0-7"
            # No --model-type unet-inference: measured as the sole cause of the NCC_EBIR033 DMA
            # rejection. 8 arms on one shape, every arm with it rejected at in=23,040, every arm
            # without it fused. --target dropped too: the node is trn3 and the compiler detects it.
            - name: NEURON_CC_FLAGS
              value: "--lnc 1"
            - name: TORCH_NEURONX_NEFF_CACHE_DIR
              value: "/tmp/neff_cache"
            - name: OMP_NUM_THREADS
              value: "8"
            - name: NEURON_RT_LOG_LEVEL
              value: "ERROR"
            - name: NEURON_CC_LOG_LEVEL
              value: "ERROR"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: GITHUB_TOKEN
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        - name: 621547421844-ap-southeast-4-pvc
          persistentVolumeClaim:
            claimName: 621547421844-ap-southeast-4-pvc
