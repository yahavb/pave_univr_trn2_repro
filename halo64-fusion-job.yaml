apiVersion: batch/v1
kind: Job
metadata:
  name: univr-halo64
  namespace: default
spec:
  template:
    metadata:
      labels:
        app: univr-halo64
    spec:
      restartPolicy: Never
      nodeSelector:
        node-type: trn3-dev1
      resourceClaims:
        - name: neurons
          resourceClaimTemplateName: s-lnc1
      containers:
        - name: repro
          image: 421672808698.dkr.ecr.us-east-1.amazonaws.com/concourse-release-0461d3b:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - "-exc"
            - |
              set -euo pipefail

              cd /tmp
              git clone -b main https://yahavb:${GITHUB_TOKEN}@github.com/yahavb/pave_univr_trn2_repro.git REPRO
              cd REPRO

              echo "┌── PROVENANCE ──"
              echo "│ commit : $(git rev-parse HEAD)"
              echo "│ subject: $(git log -1 --pretty=%s)"
              echo "└────────────────"
              echo "neuronx-cc: $(neuronx-cc --version 2>&1 | head -1 || true)"
              echo ""

              # ============================================================================
              # HALO 64: make 4x8 actually fuse, and score what the smaller halo costs
              # ============================================================================
              # 4x8 never fused. It was declared FUSES from --only-tile 1, which compiles the
              # 576x768 shape; 4x8 has FOUR shapes and its largest, 704x768 at tile 9, is
              # rejected with EBIR033 in=7,569,408 -- and 7,569,408/14 = 540,672 = 704x768
              # exactly. An 8-core run compiles all four, so 4x8 at halo 128 cannot run fused.
              #
              # The DMA operand is padded_px * 14, so the padded tile size IS the constraint, and
              # halo is what sets padded size. All four measurements bracket the budget tightly:
              #     largest that FUSED   442,368 px  (4x8 tile1 576x768, operand 6,193,152)
              #     smallest that FAILED 507,904 px  (2x16 992x512,      operand 7,110,656)
              # so the max padded shape must be <= roughly 442,368..507,904 px.
              #
              # Halo 64 puts 4x8's largest shape at 576x640 = 368,640 px, operand 5,160,960 --
              # BELOW a shape already proven to compile. It should fuse.
              #
              # It also costs far less than expected: total pixel work drops to 1.13x the 2x4
              # halo-128 baseline, not the 1.56x that 4x8 at halo 128 carries, because the halo IS
              # the overlap. So the smaller halo improves both the compile constraint and the work.
              #
              # WHY 64 AND NOT 43.28: TILE_ALIGN is 32, so the padded window snaps to a 32-px grid
              # and halo is quantised. Measured on the real tiling math, halo 44/45/48 all yield
              # the identical 544x640 shape, and 50..64 all yield 576x640. Setting 43.28 buys
              # nothing over 48, and 64 is the LARGEST halo in its quantisation step -- maximum
              # margin at zero extra cost. Anything from 50 to 64 compiles to the same tile.
              #
              # WHY MARGIN MATTERS HERE: REPRO_README calls halo "a correctness requirement, not
              # margin" and cites 43.28 px max flow displacement at 4K. That number is contested by
              # this repo's own records -- STATE.md says the 43.28 figure does NOT hold for this
              # frame pair and measures 2.33 px, the README itself lists 6.29 px at 992x1280, and a
              # --record-flow run over all 112 resample calls measured 29.02 px. Three values for
              # one quantity. Displacement is also not the whole requirement: the conv receptive
              # field reads outside the tile too, and nobody has quantified that. Halo 64 clears the
              # largest of those figures by ~48% and costs the same as halo 50.
              #
              # ACCURACY IS THE POINT OF THIS RUN, not a formality. Reducing halo is a correctness
              # change and it fails SILENTLY -- edge artefacts look plausible while disagreeing with
              # the untiled reference. Every arm is scored against ref_cuda_fp32_1728x4096.npy at
              # --bar 3. A fused arm that fails the gate is a rejection, not a result.

              OUT=/tmp/univr_h64_out; mkdir -p "$OUT"
              FRAMES="--rs0 rs70.png --rs1 rs71.png --rs2 rs72.png"
              REF="--gt ref_cuda_fp32_1728x4096.npy --weights pre_net_flow.pth"

              # STAGE 1: compile-only, LARGEST tile per geometry, because that is the binding
              # constraint and testing tile 1 is exactly the mistake that produced the false
              # "4x8 FUSES". Indices computed from the script's own tiling math at halo 64:
              #   4x8 -> tile 9  576x640  368,640 px  operand 5,160,960  predicted FUSE
              #   2x8 -> tile 1  928x640  593,920 px  operand 8,314,880  above the bracket, but the
              #                  exact limit is unknown so it is worth one cheap compile
              #   4x4 -> tile 5  576x1152 663,552 px  operand 9,289,728  larger tiles, 1.01x px
              echo "=== [1/2] COMPILE-ONLY at halo 64, largest tile per geometry ==="
              for spec in "4x8:9" "2x8:1" "4x4:5"; do
                G=${spec%%:*}; T=${spec##*:}
                echo "---- --tiles $G --halo 64 --only-tile $T ----"
                rm -rf /tmp/neff_cache; mkdir -p /tmp/neff_cache
                set +e
                NEURON_LAUNCH_BLOCKING=1 python -u repro_unrolling_trn2.py \
                    $FRAMES $REF \
                    --height 1728 --width 4096 --tiles "$G" --halo 64 --bar 3 \
                    --device neuron --cores 1 --only-tile "$T" \
                    --warp gather --dtype fp32 --compile whole --iters 0 \
                    2>&1 | tee "$OUT/c_${G}.log"
                rc=${PIPESTATUS[0]}
                set -e
                echo "$rc" > "$OUT/crc_${G}.txt"
                if grep -aq "NCC_EBIR033" "$OUT/c_${G}.log"; then
                  echo "  REJECTED(dma): $(grep -aoE 'got in=[0-9]+ and out=[0-9]+' "$OUT/c_${G}.log" | head -1)"
                elif grep -aq "NCC_EBVF030" "$OUT/c_${G}.log"; then
                  echo "  REJECTED(instr): $(grep -aoE 'Instructions generated by compiler [0-9]+' "$OUT/c_${G}.log" | head -1)"
                elif [ "$rc" = "0" ]; then
                  echo "  FUSES"
                else
                  echo "  OTHER FAILURE"; tail -20 "$OUT/c_${G}.log" | sed 's/^/    /'
                fi
                for i in $(seq 1 30); do pgrep -f repro_unrolling_trn2.py >/dev/null || break; sleep 2; done
                sleep 5
              done
              echo ""

              # STAGE 2: time and SCORE only the geometries that fused, plus the eager baseline in
              # the same pod so the comparison is not across hardware or cache state. The eager arm
              # is at halo 128 -- the documented configuration -- so any accuracy difference
              # attributable to halo 64 shows up as a difference between the arms.
              echo "=== [2/2] TIME + SCORE fused arms, and the eager halo-128 baseline ==="
              for spec in "4x8:64:whole" "2x8:64:whole" "4x4:64:whole" "2x4:128:none"; do
                G=$(echo "$spec" | cut -d: -f1); HL=$(echo "$spec" | cut -d: -f2)
                CM=$(echo "$spec" | cut -d: -f3)
                if [ "$CM" = "whole" ] && [ "$(cat "$OUT/crc_${G}.txt" 2>/dev/null || echo 1)" != "0" ]; then
                  echo "---- skip $G: did not fuse in stage 1 ----"; continue
                fi
                echo "---- --tiles $G --halo $HL --compile $CM, 8 cores, 3 iters ----"
                B=$(find /tmp/neff_cache -name '*.neff' 2>/dev/null | wc -l || echo 0)
                set +e
                python -u repro_unrolling_trn2.py $FRAMES $REF \
                    --height 1728 --width 4096 --tiles "$G" --halo "$HL" --bar 3 \
                    --device neuron --cores 8 --warp gather --dtype fp32 \
                    --compile "$CM" --iters 3 \
                    2>&1 | tee "$OUT/t_${G}_h${HL}_${CM}.log"
                rc=${PIPESTATUS[0]}
                set -e
                A=$(find /tmp/neff_cache -name '*.neff' 2>/dev/null | wc -l || echo 0)
                echo "$rc" > "$OUT/trc_${G}_h${HL}_${CM}.txt"
                echo "$((A-B))" > "$OUT/tn_${G}_h${HL}_${CM}.txt"
                echo "  rc=$rc  NEFFs +$((A-B))"
                for i in $(seq 1 60); do pgrep -f repro_unrolling_trn2.py >/dev/null || break; sleep 2; done
                sleep 5
              done
              echo ""

              echo "################ HALO 64 FUSION + TIMING"
              echo "  compile stage, largest tile per geometry:"
              for G in 4x8 2x8 4x4; do
                L="$OUT/c_${G}.log"; [ -f "$L" ] || continue
                rc=$(cat "$OUT/crc_${G}.txt" 2>/dev/null || echo '?')
                PAD=$(grep -aoE "padded [0-9]+x[0-9]+" "$L" | head -1 | awk '{print $2}' || true)
                IN=$(grep -aoE "got in=[0-9]+" "$L" | head -1 | cut -d= -f2 || true)
                NI=$(grep -aoE "Instructions generated by compiler [0-9]+" "$L" | head -1 | awk '{print $5}' || true)
                V=$([ "$rc" = "0" ] && echo FUSES || echo REJECTED)
                printf "    %-5s %-10s dma_in=%-10s instr=%-10s rc=%s %s\n" \
                  "$G" "${PAD:--}" "${IN:--}" "${NI:--}" "$rc" "$V"
              done
              echo ""
              echo "  timing + accuracy:"
              printf "    %-22s %5s %11s %7s %9s %6s\n" arm rc median_ms neffs max_LSB gate
              for f in "$OUT"/t_*.log; do
                [ -f "$f" ] || continue
                B=$(basename "$f" .log); B=${B#t_}
                rc=$(cat "$OUT/trc_${B}.txt" 2>/dev/null || echo '?')
                NN=$(cat "$OUT/tn_${B}.txt" 2>/dev/null || echo '-')
                MS=$(grep -aoE "steady state: median [0-9.]+ ms" "$f" | head -1 | awk '{print $4}' || true)
                LSB=$(grep -aoE "max_diff +[0-9.]+ LSB" "$f" | head -1 | awk '{print $2}' || true)
                GT=$(grep -aoE "\[(PASS|FAIL) vs the shipped bar" "$f" | head -1 | tr -d '[' | awk '{print $1}' || true)
                printf "    %-22s %5s %11s %7s %9s %6s\n" \
                  "$B" "$rc" "${MS:--}" "${NN:--}" "${LSB:--}" "${GT:--}"
              done
              echo ""
              echo "  HOW TO READ IT:"
              echo "  * a fused arm PASSES the gate and beats the eager median -> the result. Halo 64"
              echo "    costs 1.13x pixel work against 2x4 halo 128, so the dispatch saving only has"
              echo "    a 13% penalty to overcome, not 56%."
              echo "  * a fused arm PASSES but is SLOWER -> dispatch count is not the lever, and that"
              echo "    is a real answer: it closes the whole fusion line."
              echo "  * a fused arm FAILS the gate while eager halo-128 PASSES -> halo 64 is too"
              echo "    small. Next step is halo 96 (4x8 max 640x704 = 450,560 px, marginal against"
              echo "    the bracket) rather than abandoning the approach."
              echo "  * BOTH fail the gate -> the defect is upstream of halo and of fusion. The eager"
              echo "    2x4 arm last measured 81.46 LSB against a bar of 3, so this is possible and"
              echo "    would mean nothing here is shippable until that is fixed."
              echo ""

              ARCHIVE=/tmp/univr_h64_$(date -u +%Y%m%d_%H%M%S).tar.gz
              tar -czf "$ARCHIVE" -C /tmp univr_h64_out
              mkdir -p /var/mdl/univr_neuron
              cp "$ARCHIVE" /var/mdl/univr_neuron/
              echo "Saved: /var/mdl/univr_neuron/$(basename "$ARCHIVE") ($(du -h "$ARCHIVE" | cut -f1))"
              echo "Done."
          resources:
            claims:
              - name: neurons
            requests:
              cpu: 48
              memory: 248Gi
            limits:
              cpu: 150
              memory: 1000Gi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: 621547421844-ap-southeast-4-pvc
              mountPath: /var/mdl
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: NEURON_LOGICAL_NC_CONFIG
              value: "1"
            - name: NEURON_RT_NUM_CORES
              value: "8"
            - name: NEURON_RT_VISIBLE_CORES
              value: "0-7"
            # No --target (node is trn3), no -O1 (caused the in=4 / I-3276 rejection), no -O3
            # (measured to change the instruction count by exactly zero on 2x8 and 2x12).
            - name: NEURON_CC_FLAGS
              value: "--lnc 1 --model-type unet-inference"
            - name: TORCH_NEURONX_NEFF_CACHE_DIR
              value: "/tmp/neff_cache"
            - name: OMP_NUM_THREADS
              value: "8"
            - name: NEURON_RT_LOG_LEVEL
              value: "ERROR"
            - name: NEURON_CC_LOG_LEVEL
              value: "ERROR"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: GITHUB_TOKEN
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        - name: 621547421844-ap-southeast-4-pvc
          persistentVolumeClaim:
            claimName: 621547421844-ap-southeast-4-pvc
