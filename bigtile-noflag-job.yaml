apiVersion: batch/v1
kind: Job
metadata:
  name: univr-bigtile-noflag
  namespace: default
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: univr-bigtile-noflag
    spec:
      restartPolicy: Never
      nodeSelector:
        node-type: trn3-dev1
        # Pinned: the S3 add-on backing the 621547421844-ap-southeast-4-pvc mount only runs on
        # this node. Elsewhere the pod sits Pending on
        #   MountVolume.SetUp failed ... DeadlineExceeded
        # which is what happened on ip-192-168-192-40 (21 mount retries over 74 min).
        kubernetes.io/hostname: ip-192-168-192-189.us-east-2.compute.internal
      resourceClaims:
        - name: neurons
          resourceClaimTemplateName: s-lnc1
      containers:
        - name: repro
          image: 421672808698.dkr.ecr.us-east-1.amazonaws.com/concourse-release-0461d3b:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - "-exc"
            - |
              set -euo pipefail

              cd /tmp
              git clone -b main https://yahavb:${GITHUB_TOKEN}@github.com/yahavb/pave_univr_trn2_repro.git REPRO
              cd REPRO

              echo "┌── PROVENANCE ──"
              echo "│ commit : $(git rev-parse HEAD)"
              echo "│ subject: $(git log -1 --pretty=%s)"
              echo "└────────────────"
              echo "neuronx-cc: $(neuronx-cc --version 2>&1 | head -1 || true)"
              echo "NEURON_CC_FLAGS: ${NEURON_CC_FLAGS:-<unset>}"
              echo ""

              # ============================================================================
              # 4x8 halo 64: compile ALL FOUR shapes, without --model-type unet-inference
              # ============================================================================
              # This job originally swept the LARGEST tiles on the theory that the flag was the
              # only blocker. It OOM-killed on its first compile (2x4 h64, 928x1088, 147 min at
              # 1500Gi) which showed there is a second, independent constraint. Both are now
              # pinned, and together they select exactly one config -- see the CONFIGS block below
              # for the measurements.
              #
              # Short version: the flag caused the DMA rejection and is gone; tile SIZE causes an
              # OOM that memory does not fix; 4x8 is the only grid entirely under that size ceiling.
              #
              # ALL FOUR SHAPES, not one tile. A frame needs every distinct padded shape to
              # compile -- tiles of a rejected shape have no graph, their pixels are never written,
              # and the 8-core run dies (observed rc=139). Testing one tile and generalising is
              # what produced a false "4x8 FUSES" verdict that stood for several runs.
              #
              # Compile-only. Steady-state latency is the critical path; compile is a one-off the
              # NEFF cache absorbs. Timing is a follow-up at 8 cores with the accuracy gate.

              OUT=/tmp/univr_bt_out; mkdir -p "$OUT"
              FRAMES="--rs0 rs70.png --rs1 rs71.png --rs2 rs72.png"
              REF="--gt ref_cuda_fp32_1728x4096.npy --weights pre_net_flow.pth"

              # grid:halo:tile,tile,... -- one tile per distinct padded shape, from the planner.
              #
              # 4x8 halo 64 ONLY, all four shapes. There are two INDEPENDENT constraints and both
              # are now pinned, which is what selects this config and rules out everything larger:
              #
              # 1. DMA rejection -- caused by --model-type unet-inference. FIXED. Measured on
              #    4x8 h64 tile 0 (512x576): every arm carrying unet-inference rejected with the
              #    identical in=23,040, and --lnc 1 alone, --model-type transformer and
              #    --model-type generic all FUSED. Perfect separation across 7 arms, so it is the
              #    flag and --lnc is irrelevant to it. This job uses --lnc 1.
              #
              # 2. Compiler HOST MEMORY -- a function of tile size, and the flag does not touch it:
              #      4x8 h64  512x576    294,912 px  FUSES (118 min)
              #      4x8 h128 576x768    442,368 px  FUSES
              #      2x8 h64  928x640    593,920 px  OOM at 600, 1000 AND 1500Gi
              #      2x4 h64  928x1088 1,009,664 px  OOM at 1500Gi, WITHOUT the flag, after 147 min
              #    So the ceiling sits between ~442k and ~594k padded px, and raising memory does
              #    not move it -- 2x8 died at all three levels. 2x4 (1.0M px) and 2x8 (594k px) are
              #    both above it regardless of flags, which is why the previous run of this job
              #    OOM-killed on its very first compile.
              #
              # 4x8 is the only grid whose every shape fits under that ceiling (294k-450k px), and
              # it is already 3/4 proven: three of its four shapes fused even WITH the bad flag, and
              # the fourth (512x576) fuses without it. So all four plausibly compile now.
              #
              # Cost: ~2h per compile, ~8h for the set. That is acceptable because compile is a
              # one-off the NEFF cache absorbs and steady-state latency is the critical path.
              #
              # Larger grids are NOT included. They are above the memory ceiling, not merely
              # untested:
              #   2x4:64:0,1       1,009,664 px  OOM measured
              #   2x8:64:0,1         593,920 px  OOM measured x3
              #   3x4:64:0,1,4,5     811,008 px  above the ceiling, expect OOM
              CONFIGS="${CONFIGS:-4x8:64:0,1,8,9}"
              echo "configs (largest tile first): $CONFIGS"
              echo ""

              for C in $CONFIGS; do
                GRID=$(echo "$C" | cut -d: -f1); HL=$(echo "$C" | cut -d: -f2)
                TILES=$(echo "$C" | cut -d: -f3 | tr ',' ' ')
                ALL=1; SHAPES=""
                echo "================================================================"
                echo "=== $GRID halo $HL   shapes at tiles: $TILES"
                echo "================================================================"
                for T in $TILES; do
                  TAG="${GRID}_h${HL}_t${T}"
                  rm -rf /tmp/neff_cache; mkdir -p /tmp/neff_cache
                  set +e
                  NEURON_CC_FLAGS="--lnc 1" NEURON_LAUNCH_BLOCKING=1 \
                  python -u repro_unrolling_trn2.py \
                      $FRAMES $REF \
                      --height 1728 --width 4096 --tiles "$GRID" --halo "$HL" --bar 3 \
                      --device neuron --cores 1 --only-tile "$T" \
                      --warp gather --dtype fp32 --iters 0 \
                      2>&1 | tee "$OUT/${TAG}.log"
                  rc=${PIPESTATUS[0]}
                  set -e
                  echo "$rc" > "$OUT/rc_${TAG}.txt"
                  SH=$(grep -aoE "padded [0-9]+x[0-9]+" "$OUT/${TAG}.log" | head -1 | awk '{print $2}' || true)
                  echo "$SH" > "$OUT/sh_${TAG}.txt"
                  if [ "$rc" = "0" ]; then
                    echo "  tile $T  $SH  FUSES"
                  else
                    ALL=0
                    echo "  tile $T  $SH  REJECTED"
                    grep -aoE "got in=[0-9]+ and out=[0-9]+|Instructions generated by compiler [0-9]+ exceeds the typical limit of [0-9]+" \
                      "$OUT/${TAG}.log" | head -2 | sed 's/^/      /'
                  fi
                  for i in $(seq 1 60); do pgrep -f repro_unrolling_trn2.py >/dev/null || break; sleep 2; done
                  sleep 5
                done
                echo "$ALL" > "$OUT/all_${GRID}_h${HL}.txt"
                echo "  ==> $GRID halo $HL : ALL SHAPES FUSE = $ALL"
                echo ""
              done

              echo "################ WHICH GEOMETRY IS FULLY FUSABLE (NEURON_CC_FLAGS=--lnc 1)"
              printf "  %-16s %-10s %5s %s\n" arm padded rc verdict
              for f in "$OUT"/*_h*_t*.log; do
                [ -f "$f" ] || continue
                TAG=$(basename "$f" .log)
                rc=$(cat "$OUT/rc_${TAG}.txt" 2>/dev/null || echo '?')
                SH=$(cat "$OUT/sh_${TAG}.txt" 2>/dev/null || echo '-')
                IN=$(grep -aoE "got in=[0-9]+" "$f" | head -1 | cut -d= -f2 || true)
                V=$([ "$rc" = "0" ] && echo FUSES || echo "REJ${IN:+ in=$IN}")
                printf "  %-16s %-10s %5s %s\n" "$TAG" "$SH" "$rc" "$V"
              done
              echo ""
              echo "  COMPLETE CONFIGS (1 = every shape fused; only these can run a frame):"
              for f in "$OUT"/all_*.txt; do
                [ -f "$f" ] || continue
                B=$(basename "$f" .txt); B=${B#all_}
                echo "    $B = $(cat "$f")"
              done
              echo ""
              echo "  HOW TO READ IT:"
              echo "  * ALL SHAPES FUSE = 1 -> the first fully fusable configuration. 4x8 halo 64,"
              echo "    32 tiles, 4 shapes, 1.13x the total pixel work of the 2x4 halo-128 baseline."
              echo "    Next: populate the NEFF cache once, then 8 cores --iters 3, and read the"
              echo "    steady-state median WITH the accuracy gate. That is the number."
              echo "  * one shape REJECTED -> record its in= operand. If it differs from 23,040 it is"
              echo "    a different fault from the one the flag caused, and it is that shape that"
              echo "    needs attention, not the geometry."
              echo "  * a shape OOMs -> unexpected here, since every 4x8 halo-64 shape is 294k-450k"
              echo "    px and both known-good compiles sit in that range. It would mean the memory"
              echo "    ceiling is lower than the ~442k-594k bracket currently measured."
              echo ""
              echo "  Compile time is NOT the critical path. ~2h per shape is a one-off absorbed by"
              echo "  the NEFF cache; only steady-state latency matters."
              echo ""

              ARCHIVE=/tmp/univr_bt_$(date -u +%Y%m%d_%H%M%S).tar.gz
              tar -czf "$ARCHIVE" -C /tmp univr_bt_out
              mkdir -p /var/mdl/univr_neuron
              cp "$ARCHIVE" /var/mdl/univr_neuron/
              echo "Saved: /var/mdl/univr_neuron/$(basename "$ARCHIVE") ($(du -h "$ARCHIVE" | cut -f1))"
              echo "Done."
          resources:
            claims:
              - name: neurons
            requests:
              cpu: 48
              memory: 248Gi
            limits:
              cpu: 150
              memory: 1500Gi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: 621547421844-ap-southeast-4-pvc
              mountPath: /var/mdl
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: NEURON_LOGICAL_NC_CONFIG
              value: "1"
            - name: NEURON_RT_NUM_CORES
              value: "8"
            - name: NEURON_RT_VISIBLE_CORES
              value: "0-7"
            # Each arm exports NEURON_CC_FLAGS="--lnc 1" itself. Deliberately NOT set here, so
            # there is no chance of a stale value overriding the point of the experiment.
            - name: TORCH_NEURONX_NEFF_CACHE_DIR
              value: "/tmp/neff_cache"
            - name: OMP_NUM_THREADS
              value: "8"
            - name: NEURON_RT_LOG_LEVEL
              value: "ERROR"
            - name: NEURON_CC_LOG_LEVEL
              value: "ERROR"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: GITHUB_TOKEN
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        - name: 621547421844-ap-southeast-4-pvc
          persistentVolumeClaim:
            claimName: 621547421844-ap-southeast-4-pvc
