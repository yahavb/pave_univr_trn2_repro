apiVersion: v1
kind: Pod
metadata:
  name: s3-mount-test
  namespace: default
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: ip-192-168-192-40.us-east-2.compute.internal
  containers:
    - name: test
      image: public.ecr.aws/amazonlinux/amazonlinux:2023
      command:
        - /bin/bash
        - "-c"
        - |
          set -x
          echo "node: $(cat /etc/hostname)"
          echo "--- is it actually a mountpoint, and of what type ---"
          mount | grep -E " /var/mdl " || echo "NOT MOUNTED"
          stat -f -c 'fstype=%T' /var/mdl || true
          echo "--- read ---"
          ls -la /var/mdl/ | head -20
          ls -la /var/mdl/univr_neuron/ 2>/dev/null | tail -5 || echo "univr_neuron not readable"
          echo "--- write, then read back, then clean up ---"
          F=/var/mdl/univr_neuron/.mounttest_$(cat /etc/hostname)
          if echo "ok $(date -u +%FT%TZ)" > "$F" 2>/dev/null; then
            echo "WRITE OK"; cat "$F"; rm -f "$F" && echo "DELETE OK"
          else
            echo "WRITE FAILED -- mount is read-only or the IAM policy lacks PutObject"
          fi
          echo "MOUNT TEST DONE"
      volumeMounts:
        - name: mdl
          mountPath: /var/mdl
  volumes:
    - name: mdl
      persistentVolumeClaim:
        claimName: 621547421844-ap-southeast-4-pvc
