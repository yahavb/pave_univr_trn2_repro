# Smallest test that the S3 mount works on a given node.
#
# WHAT IT PROVES, and why it is a pod and not a Job: it mounts the same PVC the real jobs
# use, on a node you choose, then reads AND writes and exits. If the mount is broken the
# pod sits Pending on
#   MountVolume.SetUp failed ... DeadlineExceeded
# exactly as univr-bigtile-noflag-872v7 did for 74 minutes. Nothing here compiles, so a
# broken mount costs seconds instead of hours.
#
# THE FAILURE THIS IS TESTING FOR. On ip-192-168-192-40 the CSI driver never completes its
# handover to the Mountpoint pod:
#   mp-zxkmx      waits on /comm/mount.sock, times out after exactly 120s, 38 restarts
#   s3-csi-node   shows no mount activity at all, and
#                 "*v2.MountpointS3PodAttachment total 0 items received"
# Both sides Running, neither doing anything. That is a missing attachment record, not IAM
# and not a missing daemon -- an IAM fault would appear after the handshake as an S3 error.
#
# ORDER OF OPERATIONS: clear the orphaned Mountpoint pod first, otherwise this test just
# reproduces the same stuck state.
#   kubectl -n mount-s3 delete pod mp-zxkmx
#   kubectl get mountpoints3podattachments -A
#   kubectl -n kube-system delete pod s3-csi-node-f85s2      # forces re-reconcile on .40
#   kubectl apply -f s3-mount-test-pod.yaml
#   kubectl get pod s3-mount-test -w                          # Pending = still broken
#   kubectl logs s3-mount-test
#   kubectl delete pod s3-mount-test
#
# To test the KNOWN-GOOD node instead, change the hostname to
# ip-192-168-192-189.us-east-2.compute.internal. Running it there first is worth the 30
# seconds: it proves the test itself is sound before it is used as evidence about .40.
apiVersion: v1
kind: Pod
metadata:
  name: s3-mount-test
  namespace: default
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: ip-192-168-192-40.us-east-2.compute.internal
  containers:
    - name: test
      image: public.ecr.aws/amazonlinux/amazonlinux:2023
      command:
        - /bin/bash
        - "-c"
        - |
          set -x
          echo "node: $(cat /etc/hostname)"
          echo "--- is it actually a mountpoint, and of what type ---"
          mount | grep -E " /var/mdl " || echo "NOT MOUNTED"
          stat -f -c 'fstype=%T' /var/mdl || true
          echo "--- read ---"
          ls -la /var/mdl/ | head -20
          ls -la /var/mdl/univr_neuron/ 2>/dev/null | tail -5 || echo "univr_neuron not readable"
          echo "--- write, then read back, then clean up ---"
          # The real jobs write their archive here, so read-only would still fail them.
          F=/var/mdl/univr_neuron/.mounttest_$(cat /etc/hostname)
          if echo "ok $(date -u +%FT%TZ)" > "$F" 2>/dev/null; then
            echo "WRITE OK"; cat "$F"; rm -f "$F" && echo "DELETE OK"
          else
            echo "WRITE FAILED -- mount is read-only or the IAM policy lacks PutObject"
          fi
          echo "MOUNT TEST DONE"
      volumeMounts:
        - name: mdl
          mountPath: /var/mdl
  volumes:
    - name: mdl
      persistentVolumeClaim:
        claimName: 621547421844-ap-southeast-4-pvc
