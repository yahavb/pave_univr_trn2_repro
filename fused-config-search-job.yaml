apiVersion: batch/v1
kind: Job
metadata:
  name: univr-fused-search
  namespace: default
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: univr-fused-search
    spec:
      restartPolicy: Never
      nodeSelector:
        node-type: trn3-dev1
        # NOT pinned to a host (retired 2026-08-19). The PVC mounts on any trn3-dev1 now. If a
        # pod ever sits Pending on "MountVolume.SetUp failed ... DeadlineExceeded" again,
        # s3-mount-test-pod.yaml checks one node in 85 s.
      resourceClaims:
        - name: neurons
          resourceClaimTemplateName: s-lnc1
      containers:
        - name: repro
          image: 421672808698.dkr.ecr.us-east-1.amazonaws.com/concourse-release-0461d3b:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - "-exc"
            - |
              set -euo pipefail

              cd /tmp
              git clone -b main https://yahavb:${GITHUB_TOKEN}@github.com/yahavb/pave_univr_trn2_repro.git REPRO
              cd REPRO

              echo "┌── PROVENANCE ──"
              echo "│ commit : $(git rev-parse HEAD)"
              echo "│ subject: $(git log -1 --pretty=%s)"
              echo "└────────────────"
              echo "neuronx-cc: $(neuronx-cc --version 2>&1 | head -1 || true)"
              echo "NEURON_CC_FLAGS: ${NEURON_CC_FLAGS:-<unset>}"
              echo ""

              # ============================================================================
              # FIND A WHOLE-GRAPH FUSED CONFIG THAT COMPILES
              # ============================================================================
              # The script now ALWAYS compiles torch.compile(backend="neuron", dynamic=False,
              # fullgraph=True) applied to the entire model, ONE graph over the whole forward.
              # Verified at repro_unrolling_trn2.py:1414 that a single _CC
              # dict carries fullgraph=True, and at :1441 that `whole` returns
              # torch.compile(m, **_CC).
              #
              # THE SEARCH SPACE IS GEOMETRY x WARP. Every rejection so far is:
              #   "Number of elements in dimension 0 of InstDMACopy's input and dimension 0 of
              #    output AccessPatterns must MATCH, but got in=17776640 and out=128"
              # Match means EQUAL. out=128 is the SBUF partition count and is constant across all
              # 8 rejecting shapes; the input side is a FLAT pattern never tiled to partitions. The
              # operand tracks how many resamples landed in one DMA:
              #   14 * px   992x1280, 704x1280, 832x736, 992x512, 704x768
              #    4 * px   480x608
              #   45 * h    480x576 (21,600), 512x576 (23,040)  exact, no width term
              #
              # WHAT IS NEW HERE vs the geometry sweeps already done: the warp. Every whole-graph
              # verdict to date was measured with --warp gather. Production runs nki. gather is a
              # plain-torch 4-tap indirect gather; nki is the shipping kernel with 2 indirect DMA
              # descriptors per pixel and its own internal 128-partition tiling. That is a
              # materially different graph feeding the fused DMA, and it has NEVER been tried under
              # whole at 4x8 halo 64 -- the one geometry where three of four shapes already
              # compile. SINGLE_GRAPH_NCC_EBIR033.md showed gather/gridsample/nki-dyn fail
              # IDENTICALLY at 2x4 halo 128, but identical failure at one geometry does not imply
              # identical failure at another, and it certainly does not imply identical success.
              #
              # TWO GEOMETRIES:
              #   2x4 halo 128 tile 1  992x1280  the production config, known to reject with
              #                                  in=17,776,640 under gather. Included as the control
              #                                  and to get the nki-dyn datapoint there.
              #   4x8 halo 64  tile 9  576x640   the best result on record: 3 of its 4 shapes
              #                                  compile under gather. This is the arm to watch.
              #
              # Compile-only, --iters 0, LARGEST tile per geometry. Testing tile 1 blindly is what
              # produced a false "4x8 FUSES" verdict that stood for several runs. Timing is a
              # separate job once something compiles, so no device time goes to benchmarking a
              # config that cannot run.

              OUT=/tmp/univr_fs_out; mkdir -p "$OUT"
              FRAMES="--rs0 rs70.png --rs1 rs71.png --rs2 rs72.png"
              REF="--gt ref_cuda_fp32_1728x4096.npy --weights pre_net_flow.pth"

              # geometry:halo:tile -- tile is the LARGEST padded shape for that grid, from the
              # planner. 2x4 largest is tile 1 (992x1280); 4x8 halo 64 largest is tile 9 (576x640).
              # Testing tile 1 blindly is what produced a false "4x8 FUSES" verdict once already.
              GEOMS="${GEOMS:-2x4:128:1 4x8:64:9}"
              WARPS="${WARPS:-gather nki-dyn}"
              echo "geoms: $GEOMS"
              echo "mode: torch.compile(backend=neuron, dynamic=False, fullgraph=True), always"
              echo "warps: $WARPS"
              echo ""

              for G in $GEOMS; do
                GRID=$(echo "$G" | cut -d: -f1); HL=$(echo "$G" | cut -d: -f2); T=$(echo "$G" | cut -d: -f3)
                for WP in $WARPS; do
                  TAG="${GRID}_h${HL}_${WP}"
                  echo "---- $GRID halo $HL  warp $WP  tile $T ----"
                    rm -rf /tmp/neff_cache; mkdir -p /tmp/neff_cache
                    set +e
                    NEURON_LAUNCH_BLOCKING=1 python -u repro_unrolling_trn2.py \
                        $FRAMES $REF \
                        --height 1728 --width 4096 --tiles "$GRID" --halo "$HL" --bar 3 \
                        --device neuron --cores 1 --only-tile "$T" \
                      --warp "$WP" --dtype fp32 --iters 0 \
                        2>&1 | tee "$OUT/${TAG}.log"
                    rc=${PIPESTATUS[0]}
                    set -e
                    echo "$rc" > "$OUT/rc_${TAG}.txt"
                    GR=$(grep -aoE "[0-9]+ graphs?:|1 graph over the whole forward" "$OUT/${TAG}.log" | head -1 || true)
                    if [ "$rc" = "0" ]; then
                      echo "  COMPILES   [$GR]"
                    elif grep -aq "NCC_EBIR033" "$OUT/${TAG}.log"; then
                      echo "  REJECTED(dma) $(grep -aoE 'got in=[0-9]+ and out=[0-9]+' "$OUT/${TAG}.log" | head -1)"
                    elif grep -aq "NCC_EBVF030" "$OUT/${TAG}.log"; then
                      echo "  REJECTED(instr) $(grep -aoE 'Instructions generated by compiler [0-9]+' "$OUT/${TAG}.log" | head -1)"
                    else
                      echo "  OTHER rc=$rc"; tail -12 "$OUT/${TAG}.log" | sed 's/^/    /'
                    fi
                    echo ""
                    for i in $(seq 1 40); do pgrep -f repro_unrolling_trn2.py >/dev/null || break; sleep 2; done
                    sleep 5
                  done
                done
              done

              echo "################ FUSED CONFIG SEARCH (every arm is fullgraph=True)"
              printf "  %-30s %5s %-16s %s\n" arm rc verdict operand_or_graphs
              for f in "$OUT"/*_h*_*.log; do
                [ -f "$f" ] || continue
                TAG=$(basename "$f" .log)
                rc=$(cat "$OUT/rc_${TAG}.txt" 2>/dev/null || echo '?')
                IN=$(grep -aoE "got in=[0-9]+" "$f" | head -1 | cut -d= -f2 || true)
                NI=$(grep -aoE "Instructions generated by compiler [0-9]+" "$f" | head -1 | awk '{print $5}' || true)
                GR=$(grep -aoE "[0-9]+ graphs:|1 graph over the whole forward" "$f" | head -1 || true)
                if [ "$rc" = "0" ]; then V=COMPILES; X="$GR"
                elif [ -n "$IN" ]; then V="REJECTED(dma)"; X="in=$IN"
                elif [ -n "$NI" ]; then V="REJECTED(instr)"; X="$NI instr"
                else V=OTHER; X="-"; fi
                printf "  %-30s %5s %-16s %s\n" "$TAG" "$rc" "$V" "${X:--}"
              done
              echo ""
              echo "  HOW TO READ IT:"
              echo "  * any COMPILES row -> a whole-graph fullgraph=True config exists. Prefer the"
              echo "    nki-dyn arm, since nki is the production resample path. Next step is to"
              echo "    compile every remaining shape of that geometry, then time it against eager."
              echo "  * 4x8 halo 64 nki-dyn COMPILES where gather did not -> the resample"
              echo "    implementation is the lever, not the geometry, and that is a new result."
              echo "  * both geometries reject under both warps -> whole-graph fullgraph=True is"
              echo "    unavailable for this model, and the in= operands say why. Report it as a"
              echo "    hard compiler limit rather than continuing to sweep."
              echo ""

              ARCHIVE=/tmp/univr_fs_$(date -u +%Y%m%d_%H%M%S).tar.gz
              tar -czf "$ARCHIVE" -C /tmp univr_fs_out
              mkdir -p /var/mdl/univr_neuron
              cp "$ARCHIVE" /var/mdl/univr_neuron/
              echo "Saved: /var/mdl/univr_neuron/$(basename "$ARCHIVE") ($(du -h "$ARCHIVE" | cut -f1))"
              echo "Done."
          resources:
            claims:
              - name: neurons
            requests:
              cpu: 48
              memory: 248Gi
            limits:
              cpu: 150
              memory: 1500Gi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: 621547421844-ap-southeast-4-pvc
              mountPath: /var/mdl
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: NEURON_LOGICAL_NC_CONFIG
              value: "1"
            - name: NEURON_RT_NUM_CORES
              value: "8"
            - name: NEURON_RT_VISIBLE_CORES
              value: "0-7"
            # No --target (node is trn3), no -O1 (causes the in=4 / I-3276 rejection), no -O3
            # (measured to change the instruction count by exactly zero on 2x8 and 2x12).
            # No --model-type unet-inference: measured as the sole cause of the NCC_EBIR033 DMA
            # rejection. 8 arms on one shape, every arm with it rejected at in=23,040, every arm
            # without it fused. --target dropped too: the node is trn3 and the compiler detects it.
            - name: NEURON_CC_FLAGS
              value: "--lnc 1"
            - name: TORCH_NEURONX_NEFF_CACHE_DIR
              value: "/tmp/neff_cache"
            - name: OMP_NUM_THREADS
              value: "8"
            - name: NEURON_RT_LOG_LEVEL
              value: "ERROR"
            - name: NEURON_CC_LOG_LEVEL
              value: "ERROR"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: GITHUB_TOKEN
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        - name: 621547421844-ap-southeast-4-pvc
          persistentVolumeClaim:
            claimName: 621547421844-ap-southeast-4-pvc
