apiVersion: batch/v1
kind: Job
metadata:
  name: univr-settle-2x8
  namespace: default
spec:
  template:
    metadata:
      labels:
        app: univr-settle-2x8
    spec:
      restartPolicy: Never
      nodeSelector:
        node-type: trn3-dev1
      resourceClaims:
        - name: neurons
          resourceClaimTemplateName: s-lnc1
      containers:
        - name: repro
          image: 421672808698.dkr.ecr.us-east-1.amazonaws.com/concourse-release-0461d3b:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - "-exc"
            - |
              set -euo pipefail

              cd /tmp
              git clone -b main https://yahavb:${GITHUB_TOKEN}@github.com/yahavb/pave_univr_trn2_repro.git REPRO
              cd REPRO

              echo "┌── PROVENANCE ──"
              echo "│ commit : $(git rev-parse HEAD)"
              echo "│ subject: $(git log -1 --pretty=%s)"
              echo "└────────────────"
              echo "neuronx-cc: $(neuronx-cc --version 2>&1 | head -1 || true)"
              echo "NEURON_CC_FLAGS: ${NEURON_CC_FLAGS:-<unset>}"
              echo ""

              # ============================================================================
              # SETTLE 2x8 AT 1500Gi, AND CLOSE THE --warp GAP
              # ============================================================================
              # 2x8 is worth settling because it is the best geometry on every axis that costs
              # time, measured from the real planner:
              #     grid  halo  largest   total px vs 2x4 h128  distinct shapes
              #     2x8    64   928x640          0.96x                 2
              #     4x8    64   576x640          1.13x                 4
              # 2x8 does LESS total pixel work than the 2x4 production baseline and needs only 2
              # distinct padded shapes, so it needs the fewest graphs of any candidate. 4x8 is the
              # only geometry confirmed to fuse so far, and it is worse on both counts.
              #
              # WHY IT HAS NOT BEEN SETTLED: it OOM-killed at 600Gi and again at 1000Gi. This run
              # gets 1500Gi. Compile cost is a one-off -- the NEFF cache is reused -- so a long or
              # memory-hungry compile is acceptable if it produces a usable graph.
              #
              # ONE ARM PER POD IS NOT ENOUGH ON ITS OWN: the last run reached "4x8 FUSES" and was
              # then killed compiling 2x8, losing the timing stage. Every arm holds its compiled
              # graph, so peak memory is the SUM across arms. This job therefore runs the 2x8 arms
              # only, and 4x8 timing is a separate job.
              #
              # EVIDENCE ON WHETHER MORE MEMORY WILL HELP: at halo 128 the compiler FINISHED 2x8
              # and returned a verdict (NCC_EBVF030, 5,988,611 instructions). At halo 64 -- a
              # SMALLER graph, est ~4.7M instructions -- it produced no error at all and was killed
              # mid-compile. A smaller graph using more memory means it got FURTHER into
              # compilation before dying, past the pass where halo 128 bailed out. So it is
              # plausibly memory-starved rather than structurally impossible.
              #
              # PREDICTION, recorded so the result can be judged against it rather than
              # rationalised after: 2x8 probably still fails, on the instruction cap.
              #  * The instruction count barely tracks tile size: 2x8 at 761,856 px gave 5,988,611
              #    and 2x12 at 634,880 px gave 5,983,171 -- a 17% pixel cut bought 0.09% fewer
              #    instructions. It is dominated by fixed conv/U-Net structure, not the tile.
              #  * -O3 changed it by EXACTLY ZERO on both 2x8 and 2x12.
              #  * bf16 cut it 13.5% (5,180,608) and still missed the 5,000,000 cap by 3.6%.
              #  * No halo gets 2x8 under the DMA bracket either: halo 32 is still 516,096 px,
              #    above the 507,904 that failed with EBIR033.
              # If it compiles anyway, the model above is wrong and that is worth knowing.
              #
              # THE --warp GAP, which matters independently of 2x8: every fusion verdict so far,
              # including "4x8 halo 64 FUSES", was measured with --warp gather. Production runs
              # --warp nki. gather is plain torch; nki is the shipping kernel with 2 indirect DMA
              # descriptors per pixel. Different resample implementation means a different graph,
              # so the fusion verdict does NOT automatically transfer. SINGLE_GRAPH_NCC_EBIR033.md
              # established the failure was implementation-independent at 2x4 (gather, gridsample
              # and nki-dyn gave identical operands and the same failing instruction), but that was
              # one geometry at halo 128 and it was a FAILURE -- identical failure does not imply
              # identical success. So each halo is tested with gather AND nki-dyn.
              #
              # nki-dyn rather than nki: the README puts nki at 80-100 min per distinct tile shape,
              # and nki-dyn compiles in seconds at ~1.1-1.3x runtime while exercising the SAME NKI
              # indirect-DMA path. It answers "does the NKI form fuse" without spending hours. If it
              # fuses, nki is the follow-up and its compile cost is a one-off.

              OUT=/tmp/univr_s28_out; mkdir -p "$OUT"
              FRAMES="--rs0 rs70.png --rs1 rs71.png --rs2 rs72.png"
              REF="--gt ref_cuda_fp32_1728x4096.npy --weights pre_net_flow.pth"

              # Halo choice for 2x8, from the real planner. 2x8's largest tile is index 1 at every
              # halo, verified, so --only-tile 1 IS the binding constraint here.
              #   halo 64 -> 928x640 = 593,920 px, operand 8,314,880, total px 0.96x
              #   halo 32 -> 896x576 = 516,096 px, operand 7,225,344, total px 0.84x
              # 64 is the primary: it clears the largest contested displacement figure (29.02 px
              # measured) by ~2.2x. 32 is included only because it is the smallest legal step and
              # bounds the question -- if 2x8 fails even there, no halo saves it.
              ARMS="${ARMS:-64:gather 64:nki-dyn 32:gather 32:nki-dyn}"
              echo "arms this run: $ARMS"
              echo ""

              for spec in $ARMS; do
                HL=${spec%%:*}; WP=${spec##*:}
                TAG="2x8_h${HL}_${WP}"
                echo "================================================================"
                echo "=== 2x8  halo $HL  warp $WP  tile 1 (largest)  whole-graph"
                echo "================================================================"
                rm -rf /tmp/neff_cache; mkdir -p /tmp/neff_cache
                set +e
                NEURON_LAUNCH_BLOCKING=1 python -u repro_unrolling_trn2.py \
                    $FRAMES $REF \
                    --height 1728 --width 4096 --tiles 2x8 --halo "$HL" --bar 3 \
                    --device neuron --cores 1 --only-tile 1 \
                    --warp "$WP" --dtype fp32 --compile whole --iters 0 \
                    2>&1 | tee "$OUT/${TAG}.log"
                rc=${PIPESTATUS[0]}
                set -e
                echo "$rc" > "$OUT/rc_${TAG}.txt"
                if grep -aq "NCC_EBIR033" "$OUT/${TAG}.log"; then
                  echo "  REJECTED(dma) $(grep -aoE 'got in=[0-9]+ and out=[0-9]+' "$OUT/${TAG}.log" | head -1)"
                elif grep -aq "NCC_EBVF030" "$OUT/${TAG}.log"; then
                  echo "  REJECTED(instr) $(grep -aoE 'Instructions generated by compiler [0-9]+' "$OUT/${TAG}.log" | head -1)"
                elif [ "$rc" = "0" ]; then
                  echo "  FUSES"
                else
                  echo "  OTHER FAILURE (or killed)"; tail -20 "$OUT/${TAG}.log" | sed 's/^/    /'
                fi
                echo ""
                for i in $(seq 1 60); do pgrep -f repro_unrolling_trn2.py >/dev/null || break; sleep 2; done
                sleep 5
              done

              echo "################ 2x8 VERDICT"
              printf "  %-22s %-10s %11s %11s %5s %s\n" arm padded dma_in instr rc verdict
              for f in "$OUT"/2x8_*.log; do
                [ -f "$f" ] || continue
                TAG=$(basename "$f" .log)
                rc=$(cat "$OUT/rc_${TAG}.txt" 2>/dev/null || echo '?')
                PAD=$(grep -aoE "padded [0-9]+x[0-9]+" "$f" | head -1 | awk '{print $2}' || true)
                IN=$(grep -aoE "got in=[0-9]+" "$f" | head -1 | cut -d= -f2 || true)
                NI=$(grep -aoE "Instructions generated by compiler [0-9]+" "$f" | head -1 | awk '{print $5}' || true)
                if grep -aq "NCC_EBIR033" "$f"; then V="REJECTED(dma)"
                elif grep -aq "NCC_EBVF030" "$f"; then V="REJECTED(instr)"
                elif [ "$rc" = "0" ]; then V=FUSES
                else V="KILLED/OTHER"; fi
                printf "  %-22s %-10s %11s %11s %5s %s\n" \
                  "$TAG" "${PAD:--}" "${IN:--}" "${NI:--}" "$rc" "$V"
              done
              echo ""
              echo "  HOW TO READ IT:"
              echo "  * any 2x8 arm FUSES -> best geometry available. 0.96x the pixel work of the"
              echo "    2x4 baseline and only 2 distinct shapes, so fewest graphs of any candidate."
              echo "    Time it against eager next, and prefer the nki-dyn arm if both fuse since"
              echo "    that is the production resample path."
              echo "  * REJECTED(instr) with the count still near 5.98M -> the prediction above holds:"
              echo "    instruction count is fixed by conv/U-Net structure, not the tile, and no halo"
              echo "    or geometry change reaches the 5,000,000 cap. 2x8 is then closed for good and"
              echo "    4x8 halo 64 is the answer."
              echo "  * KILLED again at 1500Gi -> memory is not the binding issue and raising it"
              echo "    further is not worth another pod."
              echo "  * gather FUSES but nki-dyn does not -> the fusion verdicts in STATE.md apply"
              echo "    only to the gather path and NOT to production. That would matter for 4x8 too,"
              echo "    whose FUSES verdict was measured with gather."
              echo ""

              ARCHIVE=/tmp/univr_s28_$(date -u +%Y%m%d_%H%M%S).tar.gz
              tar -czf "$ARCHIVE" -C /tmp univr_s28_out
              mkdir -p /var/mdl/univr_neuron
              cp "$ARCHIVE" /var/mdl/univr_neuron/
              echo "Saved: /var/mdl/univr_neuron/$(basename "$ARCHIVE") ($(du -h "$ARCHIVE" | cut -f1))"
              echo "Done."
          resources:
            claims:
              - name: neurons
            requests:
              cpu: 48
              memory: 248Gi
            limits:
              cpu: 150
              memory: 1500Gi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: 621547421844-ap-southeast-4-pvc
              mountPath: /var/mdl
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: NEURON_LOGICAL_NC_CONFIG
              value: "1"
            - name: NEURON_RT_NUM_CORES
              value: "8"
            - name: NEURON_RT_VISIBLE_CORES
              value: "0-7"
            # No --target (node is trn3), no -O1 (causes the in=4 / I-3276 rejection), no -O3
            # (measured to change the instruction count by exactly zero on 2x8 and 2x12).
            - name: NEURON_CC_FLAGS
              value: "--lnc 1 --model-type unet-inference"
            - name: TORCH_NEURONX_NEFF_CACHE_DIR
              value: "/tmp/neff_cache"
            - name: OMP_NUM_THREADS
              value: "8"
            - name: NEURON_RT_LOG_LEVEL
              value: "ERROR"
            - name: NEURON_CC_LOG_LEVEL
              value: "ERROR"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: GITHUB_TOKEN
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        - name: 621547421844-ap-southeast-4-pvc
          persistentVolumeClaim:
            claimName: 621547421844-ap-southeast-4-pvc
