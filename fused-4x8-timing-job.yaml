apiVersion: batch/v1
kind: Job
metadata:
  name: univr-fused-4x8
  namespace: default
spec:
  template:
    metadata:
      labels:
        app: univr-fused-4x8
    spec:
      restartPolicy: Never
      nodeSelector:
        node-type: trn3-dev1
      resourceClaims:
        - name: neurons
          resourceClaimTemplateName: s-lnc1
      containers:
        - name: repro
          image: 421672808698.dkr.ecr.us-east-1.amazonaws.com/concourse-release-0461d3b:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - "-exc"
            - |
              set -euo pipefail

              cd /tmp
              git clone -b main https://yahavb:${GITHUB_TOKEN}@github.com/yahavb/pave_univr_trn2_repro.git REPRO
              cd REPRO

              echo "┌── PROVENANCE ──"
              echo "│ commit : $(git rev-parse HEAD)"
              echo "│ subject: $(git log -1 --pretty=%s)"
              echo "└────────────────"
              echo "neuronx-cc: $(neuronx-cc --version 2>&1 | head -1 || true)"
              echo ""

              # ============================================================================
              # DOES FUSED 4x8 BEAT EAGER? The question the whole fusion search was for.
              # ============================================================================
              # 4x8 is the ONLY geometry that fuses. Everything else is ruled out by measurement:
              #
              #   2x4  992x1280  EBIR033 in=17,776,640          DMA wall
              #   3x4  704x1280  EBIR033 in=12,615,680          DMA wall
              #   3x9  832x736   EBIR033 in=8,572,928           DMA wall
              #   2x16 992x512   EBIR033 in=7,110,656           DMA wall
              #   2x8  992x768   EBVF030 5,988,611 instr        instruction cap (5,000,000)
              #   2x12 992x608   EBVF030 5,983,171 instr        instruction cap
              #   4x8  576x768   FUSES
              #
              # Two things that search established, both negative and both worth not re-testing:
              #  * -O3 does NOTHING. 2x8 and 2x12 produced byte-identical instruction counts at
              #    baseline and at -O3 (5,988,611 and 5,983,171 respectively). Optlevel is not a
              #    lever on instruction count.
              #  * The count barely tracks tile size. 2x8 761,856 px -> 5,988,611 and 2x12
              #    634,880 px -> 5,983,171: a 17% pixel cut bought 0.09% fewer instructions. The
              #    count is dominated by fixed conv/U-Net structure, not tile pixels, which is why
              #    no geometry in that band clears the cap. bf16 on 2x8 gave 5,180,608, a 13.5%
              #    cut -- the only thing that moved the number, and still 3.6% over.
              #  * Below 2x8 the DMA wall returns: 3x9 and 2x16 report DMA operands ABOVE 2x8's
              #    instruction figure. The two walls overlap with no gap between them.
              #
              # So 4x8 it is, and this job answers whether it is worth anything.
              #
              # STAGE 1 closes a real gap. "4x8 FUSES" was established with --only-tile 1, which
              # compiles the 576x768 shape. 4x8 has FOUR distinct padded shapes -- 576x640,
              # 576x768, 704x640, 704x768 -- and the largest, 704x768 at tile 9, was never
              # compiled. Instruction count and the DMA operand both scale with tile pixels, so the
              # largest shape is the binding constraint: a full 8-core run must compile all four and
              # it can still fail on the one never tested. Stage 1 compiles tile 9 alone, cheaply,
              # before stage 2 spends real time.
              #
              # STAGE 2 is the measurement, and it is A/B in ONE pod so the comparison is not
              # across hardware or cache states:
              #   fused  = --tiles 4x8 --compile whole   (fullgraph=True, ~8 graphs per frame)
              #   eager  = --tiles 2x4 --compile none    (the documented baseline config)
              # Both at 8 cores, 3 iters, fp32, warp=gather.
              #
              # warp=gather, NOT nki: gather is plain torch, needs no NKI toolchain, and compiles
              # in minutes rather than the 80-100 min per tile shape the README records for nki.
              # With 4 distinct shapes at 4x8, nki would be hours before producing a number. The
              # question here is dispatch count vs pixel work, and gather answers it on both arms.
              #
              # ACCURACY IS SCORED ON BOTH ARMS and is not optional. A fused graph that is fast and
              # wrong is worth nothing, and the eager 2x4 baseline currently FAILS at 81.46 LSB
              # against a bar of 3 -- so the eager arm here doubles as a check on whether that
              # failure reproduces. If both arms fail accuracy the timing comparison is still
              # readable as dispatch-vs-pixel-work, but neither is shippable and that must be said.
              #
              # COST NOTE: 4x8 is 1.56x the total pixel work of 2x4 (recomputed from the script's
              # own tiling math; earlier comments in this repo said 1.39x and were wrong). So fused
              # 4x8 must overcome a 56% pixel-work penalty using dispatch savings alone. The eager
              # 2x4 arm caches ~275 NEFFs; fused 4x8 should be ~8.

              OUT=/tmp/univr_f48_out; mkdir -p "$OUT"
              FRAMES="--rs0 rs70.png --rs1 rs71.png --rs2 rs72.png"
              REF="--gt ref_cuda_fp32_1728x4096.npy --weights pre_net_flow.pth"

              echo "=== [1/3] CONFIRM 4x8's LARGEST SHAPE COMPILES (tile 9 = 704x768) ==="
              set +e
              NEURON_LAUNCH_BLOCKING=1 python -u repro_unrolling_trn2.py \
                  $FRAMES $REF \
                  --height 1728 --width 4096 --tiles 4x8 --halo 128 --bar 3 \
                  --device neuron --cores 1 --only-tile 9 \
                  --warp gather --dtype fp32 --compile whole --iters 0 \
                  2>&1 | tee "$OUT/1_largest_shape.log"
              rc9=${PIPESTATUS[0]}
              set -e
              echo "  rc=$rc9"
              if [ "$rc9" != "0" ]; then
                echo "  LARGEST SHAPE DOES NOT FUSE -- 4x8 cannot run fused at 8 cores."
                grep -oE "got in=[0-9]+ and out=[0-9]+|Instructions generated by compiler [0-9]+ exceeds the typical limit of [0-9]+" \
                  "$OUT/1_largest_shape.log" | head -2 | sed 's/^/    /'
                echo "  Stage 2's fused arm is expected to fail the same way; running it anyway so"
                echo "  the eager baseline is still measured in this pod."
              else
                echo "  LARGEST SHAPE FUSES. All four 4x8 shapes now known to compile."
              fi
              echo ""

              echo "=== [2/3] FUSED 4x8, 8 cores, --compile whole, 3 iters ==="
              B=$(find /tmp/neff_cache -name '*.neff' 2>/dev/null | wc -l || echo 0)
              set +e
              python -u repro_unrolling_trn2.py $FRAMES $REF \
                  --height 1728 --width 4096 --tiles 4x8 --halo 128 --bar 3 \
                  --device neuron --cores 8 --warp gather --dtype fp32 \
                  --compile whole --iters 3 \
                  2>&1 | tee "$OUT/2_fused_4x8.log"
              rcf=${PIPESTATUS[0]}
              set -e
              A=$(find /tmp/neff_cache -name '*.neff' 2>/dev/null | wc -l || echo 0)
              echo "  rc=$rcf   NEFFs +$((A-B))"
              echo "$((A-B))" > "$OUT/neffs_fused.txt"
              echo ""
              for i in $(seq 1 60); do pgrep -f repro_unrolling_trn2.py >/dev/null || break; sleep 2; done
              sleep 5

              echo "=== [3/3] EAGER 2x4, 8 cores, --compile none, 3 iters (the baseline) ==="
              B=$(find /tmp/neff_cache -name '*.neff' 2>/dev/null | wc -l || echo 0)
              set +e
              python -u repro_unrolling_trn2.py $FRAMES $REF \
                  --height 1728 --width 4096 --tiles 2x4 --halo 128 --bar 3 \
                  --device neuron --cores 8 --warp gather --dtype fp32 \
                  --compile none --iters 3 \
                  2>&1 | tee "$OUT/3_eager_2x4.log"
              rce=${PIPESTATUS[0]}
              set -e
              A=$(find /tmp/neff_cache -name '*.neff' 2>/dev/null | wc -l || echo 0)
              echo "  rc=$rce   NEFFs +$((A-B))"
              echo "$((A-B))" > "$OUT/neffs_eager.txt"
              echo ""

              echo "################ FUSED 4x8 vs EAGER 2x4"
              printf "  %-14s %7s %12s %10s %9s %8s %s\n" arm rc median_ms neffs_added max_LSB gate graphs
              for pair in "fused_4x8|$OUT/2_fused_4x8.log|$OUT/neffs_fused.txt" \
                          "eager_2x4|$OUT/3_eager_2x4.log|$OUT/neffs_eager.txt"; do
                NM=${pair%%|*}; rest=${pair#*|}; L=${rest%%|*}; NF=${rest##*|}
                [ -f "$L" ] || continue
                MS=$(grep -oE "steady state: median [0-9.]+ ms" "$L" | head -1 | awk '{print $4}' || true)
                LSB=$(grep -oE "max_diff +[0-9.]+ LSB" "$L" | head -1 | awk '{print $2}' || true)
                GT=$(grep -oE "\[(PASS|FAIL) vs the shipped bar" "$L" | head -1 | tr -d '[' | awk '{print $1}' || true)
                NN=$(cat "$NF" 2>/dev/null || echo '-')
                GR=$(grep -oE "up to [0-9]+ graphs to compile" "$L" | head -1 | awk '{print $3}' || true)
                RC=$([ "$NM" = "fused_4x8" ] && echo "$rcf" || echo "$rce")
                printf "  %-14s %7s %12s %10s %9s %8s %s\n" \
                  "$NM" "$RC" "${MS:--}" "${NN:--}" "${LSB:--}" "${GT:--}" "${GR:--}"
              done
              echo ""
              echo "  HOW TO READ IT:"
              echo "  * fused median < eager median AND both gates PASS -> fusion wins; the dispatch"
              echo "    saving beat the 1.56x pixel-work penalty. This is the result being sought."
              echo "  * fused median > eager median -> the 56% extra pixel work costs more than 271"
              echo "    fewer dispatches save, and fusion is not the lever for this model."
              echo "  * fused FAILS accuracy but eager PASSES -> a fusion correctness bug, and the"
              echo "    timing is irrelevant until it is fixed."
              echo "  * BOTH fail accuracy -> the known tile-0 defect (eager 2x4 last measured"
              echo "    81.46 LSB against a bar of 3) is upstream of fusion. The timing comparison"
              echo "    still reads as dispatch vs pixel work, but neither arm is shippable."
              echo ""
              echo "  reference: README documents eager 2x4 --warp nki at 3673.3 ms / 0.64 LSB PASS."
              echo "  This job uses --warp gather on BOTH arms, so its eager number is not directly"
              echo "  comparable to that figure -- the internal fused-vs-eager delta is the result."
              echo ""

              ARCHIVE=/tmp/univr_f48_$(date -u +%Y%m%d_%H%M%S).tar.gz
              tar -czf "$ARCHIVE" -C /tmp univr_f48_out
              mkdir -p /var/mdl/univr_neuron
              cp "$ARCHIVE" /var/mdl/univr_neuron/
              echo "Saved: /var/mdl/univr_neuron/$(basename "$ARCHIVE") ($(du -h "$ARCHIVE" | cut -f1))"
              echo "Done."
          resources:
            claims:
              - name: neurons
            requests:
              cpu: 48
              memory: 248Gi
            limits:
              cpu: 150
              memory: 1000Gi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: 621547421844-ap-southeast-4-pvc
              mountPath: /var/mdl
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: NEURON_LOGICAL_NC_CONFIG
              value: "1"
            - name: NEURON_RT_NUM_CORES
              value: "8"
            - name: NEURON_RT_VISIBLE_CORES
              value: "0-7"
            # No --target: the node is trn3-dev1. No -O1: it caused the in=4 / I-3276 rejection.
            # No -O3: measured to change the instruction count by exactly zero on 2x8 and 2x12.
            - name: NEURON_CC_FLAGS
              value: "--lnc 1 --model-type unet-inference"
            - name: TORCH_NEURONX_NEFF_CACHE_DIR
              value: "/tmp/neff_cache"
            - name: OMP_NUM_THREADS
              value: "8"
            - name: NEURON_RT_LOG_LEVEL
              value: "ERROR"
            - name: NEURON_CC_LOG_LEVEL
              value: "ERROR"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: GITHUB_TOKEN
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        - name: 621547421844-ap-southeast-4-pvc
          persistentVolumeClaim:
            claimName: 621547421844-ap-southeast-4-pvc
